version: "2.0"

# Daemon configuration
daemon:
  idle_timeout_seconds: 600  # Auto-shutdown after 10 minutes of inactivity
  log_level: DEBUG
  self_install_mode: true  # Self-install: daemon runs from project root (not .claude/hooks-daemon/)
  strict_mode: true  # FAIL FAST on ALL errors (dogfooding requirement)
  project_root: ../../  # Project root relative to this config file (always ../../)

  stale_file_days: 7  # Remove daemon runtime files older than this many days

  # Language filter for strategy-pattern handlers
  languages: []

  # Input validation (v2.2.0+) - Catch malformed events at front controller layer
  input_validation:
    enabled: true              # Validate hook inputs (recommended)
    strict_mode: true          # Fail-closed: return errors on validation failures
    log_validation_errors: true

  # Payload capture (Plan 00158) - dogfooding aid. When enabled the daemon appends
  # the raw hook_input it receives to <untracked>/payload-capture/<event>.jsonl.
  # Applied by a daemon restart (never a Claude Code relaunch). Dogfooded ON here,
  # scoped to Status so we can inspect the session_id behind each status-line
  # render (background-agent bar vs Task-tool subagent row). Ships OFF by default.
  payload_capture:
    enabled: false             # off (shipped default); flip to true + restart daemon to dogfood
    dir: null                  # null = <daemon untracked>/payload-capture
    events:                    # empty list = all events; scope e.g. to [Status]
      - Status

  # Transport (Plan 00290) - opt-in relay/nc hot-path rungs. Both false is
  # today's behaviour, byte-identical. Relay measured at p50 4.3ms / p95
  # 5.1ms end-to-end (see CLAUDE/Plan/00290-.../MEASUREMENT-relay.md) and is
  # dogfooded here (Task 6.2), post commit c9a0f674 (Stop/SubagentStop
  # excluded from the relay guard; guard socket/binary paths overridable).
  transport:
    # DOGFOOD LIVE (Plan 00294 Phase 3): re-enabled via `bin/hooks-daemon
    # transport on` after the post-00290 fixes landed — typed relay
    # eligibility from the event catalogue, daemon-side hook_event_name
    # enrichment, and the real-payload e2e suite driving REAL Claude Code
    # payload shapes through every per-event socket
    # (tests/integration/test_relay_event_socket_real_payloads.py). The
    # toggle verified the live state (31 listeners, socket-stdin probes).
    # Any regression: `bin/hooks-daemon transport off` FIRST, diagnose second.
    relay_enabled: true
    nc_enabled: false
    timeout_seconds: 30
    relay_binary: null         # null = <untracked>/bin/hooks-relay
    relay_source: build        # build from relay/hooks_relay.rs via relay/build.sh

# Plan 00293: project-declared never-want tools for the tools-vs-tokens
# report (`bin/hooks-daemon tool-report`). Declaring one changes what the
# report RECOMMENDS — enforcement for Artifact is the blocker's own
# source_disable option below.
tool_policy:
  never_want:
    - tool: Artifact
      reason: "publishing leaves the repository; source-disabled via artifact_publish_blocker"

# Plan 00116 Decision I: data-driven promotion. Handlers listed here keep FULL
# guidance resident in the injected CLAUDE.md block; every other blocking
# handler gets a rule-table row + first-fire-verbose progressive disclosure.
# Evidence: bin/hooks-daemon block-report (2026-08-31 scan: 359 transcripts,
# 12 sessions). Thresholds tightened from the 5/2 defaults because this repo's
# dogfood sessions put 29/34 handlers over the default bar — 20/3 captures the
# real hot set above the frequency cliff. auto_continue_stop is a judgement
# add: stop-hook blocks are not tool_result denies, so the transcript scan
# cannot count them, but they fire in nearly every session.
claude_md:
  promotion:
    min_blocks: 20
    min_sessions: 3
    promoted_handlers:
      - lsp_enforcement
      - pipe_blocker
      - sed_blocker
      - qa_suppression
      - plan_number_helper
      - sensitive_content
      - security_antipattern
      - tdd_enforcement
      - error_hiding_blocker
      - comment_changelog
      - auto_continue_stop

# Built-in handler configuration
# Handlers run in priority order (lower number = earlier execution)
# Priority ranges: 5=test, 10-20=safety, 25-45=workflow, 50-60=tool usage
handlers:
  # PreToolUse handlers (run before every tool call)
  pre_tool_use:
    # SAFETY HANDLERS (Priority 10-20)
    destructive_git:       # Blocks git reset --hard, git clean -f, etc
      enabled: true
      priority: 10

    daemon_location_guard: # Prevents cd into .claude/hooks-daemon (run commands from project root)
      enabled: true
      priority: 11

    sed_blocker:           # Blocks sed command usage (use Edit tool instead)
      enabled: true
      priority: 11
      # options:
      #   blocking_mode: strict              # strict (default): block Bash + Write tool creating shell scripts with sed
      #   blocking_mode: direct_invocation_only  # Only block Bash tool direct invocation; allow Write to create scripts

    absolute_path:         # Enforces absolute paths in file operations
      enabled: true
      priority: 12

    error_hiding_blocker:  # Blocks error-hiding patterns in written code (|| true, except: pass, etc)
      enabled: true
      priority: 13

    security_antipattern:  # Blocks security antipatterns (hardcoded secrets, eval, innerHTML, etc)
      enabled: true
      priority: 14

    # Blocks two independent sources of sensitive content (Plan 00201):
    # public_patterns are safe to name in the deny message (that is what
    # makes them fixable) and should stay STRUCTURAL — a shape any reviewer
    # could describe without seeing the leak itself. A specific identifier
    # (an employer/client name, a real person's name) is exactly what
    # secret_word_list_path is for: it is never named anywhere, only a
    # numeric index into the gitignored file. Populated here per the
    # presentation-quality audit that motivated this handler
    # (untracked/resume-readiness/REDACTION-MAP.md).
    #
    # Profanity WAS deliberately left out of this list, on the reasoning that
    # "the handful of historic instances" would be paraphrased once and did
    # not warrant a standing rule. That reasoning rested on a count, and the
    # count was wrong: the hand-audit found 6 instances, a systematic scan
    # found 27 — 25 of them in the project's own authored voice in live docs,
    # not in quoted user feedback. A one-off paraphrase pass with no guard
    # behind it is exactly the shape CLAUDE.md Core Standard 15 (DBF) exists
    # to reject, so the rule is now populated. A profanity blocklist in a
    # linter config is ordinary and reads as such; the words below are
    # deliberately NOT in the secret list, because unlike an employer name
    # there is nothing sensitive about naming them in a deny message — and
    # naming them is what makes the block actionable.
    #
    # A generic "non-placeholder home directory" structural pattern was
    # tried and dropped: this repo's own test suite uses short synthetic
    # strings under the home-dir prefix pervasively as fixture data for
    # unrelated path-parsing tests (e.g. root_recursion_guard, pipe_blocker),
    # so the heuristic could not distinguish a real leaked path from a
    # fixture without naming the specific real segments — which belongs in
    # the secret list, not here.
    # Plan 00261. Dogfooded ON, which is also the shipped default. A Write to an
    # existing file not read this session is denied — it would replace contents
    # the agent has never seen. New files and Edits are unaffected; `Read` is the
    # one-call remedy, which is why there is no escape hatch.
    write_clobber_guard:
      enabled: true
      priority: 16

    # Plan 00259. Dogfooded ON, which is also the shipped default. Publishing
    # renders a local file to a page hosted on claude.ai and returns a URL —
    # an egress path this repository cannot audit or retract. Read-only
    # `action: "list"` stays allowed. There is deliberately no agent-side
    # escape hatch: lifting this is a human's config edit, visible in review.
    artifact_publish_blocker:
      enabled: true
      priority: 14
      options:
        # Plan 00293 dogfood: this project never wants the Artifact tool at
        # all, so the daemon keeps `.claude/settings.json` at
        # `"enableArtifact": false` — removing the tool (and its ~6k-token
        # schema) from every new session. The call-time deny above remains
        # as the in-session backstop.
        source_disable: true

    sensitive_content:
      enabled: true
      priority: 14
      options:
        public_patterns:
          - name: vhosts-path
            pattern: '/var/www/vhosts'
            description: 'employer/hosting-provider server path convention'
          # The leading negative lookahead exempts UUIDs whose hex digits are
          # all the SAME character (all-zeros, all-a, all-f, ...). Without it
          # the rule blocked the exact placeholder its own deny message tells
          # you to use, so the only advertised remediation was itself denied.
          # Found the first time this rule was used to redact a real UUID --
          # and the fix could not even be typed into this file until the
          # pattern was relaxed, because the explanatory comment tripped it.
          # Uniformity is the test, not "starts with zeros": a placeholder
          # with one odd digit is still real-shaped and is still caught.
          - name: session-uuid
            pattern: '\b(?!([0-9a-fA-F])\1{7}-\1{4}-\1{4}-\1{4}-\1{12}\b)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b'
            description: 'a real session UUID — use an all-same-digit placeholder (all zeros; or all-a / all-b when two must stay distinguishable)'
          # Literal stems, case-insensitive, word-bounded. Written literally
          # ON PURPOSE: the first attempt obfuscated them (`f\w*ck\w*`) to
          # avoid tripping the live rule while editing this file, and that
          # `\w*` matched straight through "feedback" and "fallback" — 1,308
          # false positives on the first scan. The exclude_paths entry for
          # this file is what makes the literal form possible, and the
          # literal form is the only one that is actually reviewable.
          # 'ass' and 'hell' are deliberately absent: assert/assign/hello
          # make them pure noise, and a rule that cries wolf gets disabled.
          - name: profanity
            pattern: '(?i)\b(fuck\w*|shit\w*|bullshit|bollocks|wank(?:er|ers|ing)?|bastard)\b'
            description: 'profanity in a tracked document — paraphrase it, keeping the engineering point'
        secret_word_list_path: .claude/block-words.secret
        # --- consumed by scripts/qa/check_git_history.py, not by the handler ---
        # The write-time handler blocks NEW contamination of git metadata
        # (commit messages, identities, tag/branch names, tag messages). The
        # history already committed here is a different problem: it can only be
        # cleaned by a force-push, which only a human may run. Without these two
        # keys the gate would be red the day it landed and stay red until then —
        # and a permanently-red gate gets disabled, not fixed.
        #
        # history_baseline: commits reachable from this sha are exempt.
        #
        # The rewrite has now landed, and it did exactly what the previous note
        # here predicted: every commit got a new sha, the old baseline stopped
        # resolving, and the fail-safe (an unresolvable baseline exempts
        # NOTHING) swept the full history for the first time. So this is no
        # longer a placeholder awaiting a rewrite — it is the published tip as
        # of the day the sweep first ran clean, and it means "everything
        # already public predates this guard".
        #
        # It covers exactly one known finding, deliberately: a commit body on
        # published main carries profanity ('profanity' public pattern). That
        # is unreachable without a SECOND force-push of all 1562 commits and
        # 121 tags, which is disproportionate to one word in one message body.
        # New commits get no such tolerance — that is the point of a baseline.
        history_baseline: ccfe3baa4d54dfbf930d2e5169bd335ef11c17b9
        # Refs cannot be covered by a commit baseline — a ref has no ancestry,
        # so exempting by the tagged commit would let a tag created TODAY on an
        # ancient commit sail through. Unlike the baseline this list cannot
        # auto-expire, so the checker reports a `stale-grandfather` violation
        # once an entry stops being needed.
        #
        # It held v3.16.0 / v3.22.0 / v3.25.0, whose annotated tag MESSAGES
        # carried the contamination. The rewrite cleaned those messages and the
        # forced tag re-fetch brought the clean objects down, at which point the
        # checker reported all three as `stale-grandfather` — the self-reporting
        # worked, so the entries are gone. The list is now empty by design:
        # nothing is exempt, and adding an entry should need a written reason.
        history_grandfathered_refs: []
        exclude_paths:
          # A rules file must be able to contain its own rules. This config
          # DECLARES the patterns above, so it necessarily contains text
          # matching them — editing the vhosts-path rule was denied for
          # matching vhosts-path, and the profanity rule could not be added
          # at all without this. Same principle as the handler's built-in
          # exemption for its own secret word list: the file that defines
          # what is blocked is the one file that must be allowed to say it.
          # Narrow by design — this exempts THIS file, not `.claude/`.
          - '.claude/hooks-daemon.yaml'
          # Confirmed-legitimate synthetic UUID fixtures (REDACTION-MAP.md
          # item 4) — these generate UUID-shaped strings on purpose as test
          # data, they do not contain a real session UUID.
          - 'tests/unit/handlers/status_line/test_thread_registry.py'
          - 'tests/unit/supervise/test_session_identity.py'
          # This handler's own source/tests necessarily demonstrate the
          # public patterns they implement (e.g. the vhosts-path example in
          # get_acceptance_tests() and unit-test fixtures) — self-referential
          # documentation of the feature, not a leak.
          - 'src/claude_code_hooks_daemon/handlers/pre_tool_use/sensitive_content.py'
          - 'tests/unit/handlers/pre_tool_use/test_sensitive_content.py'

    # Plan 00272: protected files' CONTENTS never enter context. Default globs
    # (*.secret*, .vault-pass*, ...) cover .claude/block-words.secret; use
    # `bin/hooks-daemon secret-meta <path>` for presence/metadata. No agent
    # escape hatch — this block is the only lift, and it is a human's edit.
    secret_file_guard:
      enabled: true
      priority: 14
      options:
        # exclude_paths scopes ONLY the authored-script content scan; a
        # protected path itself is never excludable. This handler's own
        # source/tests (and its matching core + docs generator fixtures)
        # necessarily NAME protected paths to test them.
        exclude_paths:
          - 'src/claude_code_hooks_daemon/handlers/pre_tool_use/secret_file_guard.py'
          - 'src/claude_code_hooks_daemon/utils/secret_file_matching.py'
          - 'src/claude_code_hooks_daemon/utils/secret_meta.py'
          - 'tests/unit/handlers/pre_tool_use/test_secret_file_guard.py'
          - 'tests/unit/utils/test_secret_file_matching.py'
          - 'tests/unit/utils/test_secret_meta.py'
          - 'tests/unit/daemon/test_cli_secret_meta.py'

    # Plan 00278 Phase 3d.1: dogfood-enabled here with the flaggable path
    # pointed at the cyber-flag test fixture (ships disabled upstream via
    # get_default_enabled). Closes the git/grep channel flaggable_work_advisor
    # can only advise about.
    flaggable_content_channel_guard:
      enabled: true
      priority: 14
      options:
        flaggable_path_globs:
          - 'tests/fixtures/cyber-flag/**'

    # Plan 00278 Phase 3d.2: dogfood-enabled here (ships disabled upstream).
    # Pre-seeded with the *-opus-security-DETAIL* marker glob, so no options
    # are needed even in this repo.
    quarantine_artefact_read_guard:
      enabled: true
      priority: 14

    root_recursion_guard:  # Blocks recursive scans (grep -r, find, rg) rooted at / /proc /sys ~ $HOME
      enabled: true
      priority: 15

    worktree_file_copy:    # Prevents copying files between git worktrees
      enabled: true
      priority: 15

    curl_pipe_shell:       # Blocks dangerous curl | sh patterns
      enabled: true
      priority: 16

    pipe_blocker:          # Blocks dangerous pipe patterns in bash commands
      enabled: true
      priority: 17

    dangerous_permissions: # Warns about dangerous file permission changes
      enabled: true
      priority: 18

    git_stash:             # Warns about git stash (stashes can be lost)
      enabled: true
      priority: 19
      options:
        mode: deny             # Block git stash entirely (use git commit or worktree instead)

    github_auto_close_keywords:  # Blocks GitHub auto-closing keyword refs (Plan 00275)
      enabled: true
      priority: 18

    git_message_backtick:  # Blocks backticks in a double-quoted git -m (Plan 00219)
      enabled: true
      priority: 20

    ancestry_preserving_merge: # Blocks git merge --squash / gh pr merge --squash|--rebase (Plan 00207)
      enabled: true
      priority: 19
      options:
        mode: block             # Block ancestry-severing merges (use --no-ff / gh pr merge --merge)

    lock_file_edit_blocker: # Prevents editing package lock files
      enabled: true
      priority: 20

    pip_break_system:      # Blocks pip commands that break system packages
      enabled: true
      priority: 21

    sudo_pip:              # Blocks sudo pip (use venv instead)
      enabled: true
      priority: 22

    ask_user_question_blocker: # Prefix-positive: blocks AskUserQuestion unless every question begins with `ASKING BECAUSE:`
      enabled: true
      priority: 23

    daemon_restart_verifier: # Verifies daemon restart after code changes
      enabled: true
      priority: 23

    # CODE QUALITY HANDLERS (Priority 25-45)
    qa_suppression:        # Unified multi-language QA suppression blocker (11 languages)
      enabled: true
      priority: 30
      # options:
      #   # Restrict QA suppression enforcement to specific languages (default: ALL languages)
      #   # Uncomment and list only the languages you want enforced.
      #   # If omitted or empty, ALL 11 languages are enforced.
      #   languages:
      #     - Python
      #     - Go
      #     - JavaScript/TypeScript
      #     - PHP

    comment_changelog:     # Blocks changelog narrative accumulating in a code comment (Plan 00208)
      enabled: true
      priority: 31
      # options:
      #   max_history_entries: 1   # more than this many distinct dated/versioned entries in one comment advises
      #   mode: block               # block | warn

    comment_size:          # Caps over-long comments, tiered like plan-doc-size (Plan 00208)
      enabled: true
      priority: 33
      # options:
      #   max_comment_line_chars: 400
      #   max_comment_block_lines: 40
      #   mode: block               # block | warn

    bash_safe_mode:  # Opt-in safe-prelude forcer (Plan 00270); dogfooded here in warn mode
      enabled: true
      priority: 36
      options:
        # Scoped to mutator-bearing commands for the first dogfood cycle:
        # unscoped, it fires on essentially every multi-statement Bash call
        # with a large advisory and no rate limiting. Widen to false once the
        # advisory volume is measured and acceptable.
        only_with_mutator: true
      #   mode: warn              # warn | block (inject is reserved and rejected at load)
      #   require: [errexit, pipefail]  # nounset available but off-default
      #   min_statements: 2
      #   exempt_patterns: []
    verification_result_gate:  # Flags a verifier whose result nothing consumes (Plan 00268)
      enabled: true
      priority: 34
      # options:
      #   mode: warn              # warn | block — ships advisory while the tables settle
      #   extra_verifiers:        # additive; literal command names, never regexes
      #     - "my-project-check"
      #   extra_mutators:
      #     - "terraform apply"

    tdd_enforcement:       # Enforces test-first development
      enabled: true
      priority: 35
      # options:
      #   # Restrict TDD enforcement to specific languages (default: ALL languages)
      #   # Uncomment and list only the languages you want enforced.
      #   # If omitted or empty, ALL 11 languages are enforced.
      #   languages:
      #     - Python
      #     - Go
      #     - JavaScript/TypeScript
      #     - PHP
      #     - Rust
      #     - Java
      #     - C#
      #     - Kotlin
      #     - Ruby
      #     - Swift
      #     - Dart
      #   # Test file location styles to check (default: all three)
      #   # - separate: tests/ directory tree (existing behavior)
      #   # - collocated: test file next to source (e.g., handler_test.go)
      #   # - test_subdir: __tests__/ subdirectory next to source
      #   test_locations:
      #     - separate
      #     - collocated
      #     - test_subdir

    lsp_enforcement:       # Steers LLMs toward LSP tools instead of Grep/Bash grep for symbol lookups
      enabled: true
      priority: 38
      options:
        mode: block_once       # advisory | block_once | strict
        no_lsp_mode: block     # block | advisory | disable

    # WORKFLOW HANDLERS (Priority 30-50)
    plan_number_helper:    # Provides correct next plan number (prevents broken bash discovery)
      enabled: true        # Enable when using CLAUDE/Plan/ structure
      priority: 33

    agent_isolation_advisor:  # Advises worktree isolation for concurrent agents
      enabled: true
      priority: 46

    dispatch_declaration:  # Advises a file-handoff declaration on Task dispatch (Plan 00307)
      enabled: true
      priority: 48
      options:
        strict: false
        fallback_report_dir: "untracked/agent-reports/"

    gh_issue_comments:     # Requires --comments flag for gh issue view
      enabled: true
      priority: 40

    gh_pr_comments:        # Requires --comments flag for gh pr view
      enabled: true
      priority: 40

    global_npm_advisor:    # Advises against global npm installs
      enabled: true
      priority: 42

    staged_lint_gate:      # Cheap syntax-check backstop over staged files on git commit (Plan 00268)
      enabled: true
      priority: 43
      # options:
      #   mode: warn              # warn | block — ships advisory while the rollout settles
      #   max_files: 20            # stand down (advisory only) above this many staged lintable files

    plan_qa_edit:          # Stage 1 plan QA lint on PLAN.md writes (Plan 00144)
      enabled: true        # Policy under top-level plan_workflow.qa (edit_mode: block)
      priority: 44

    plan_qa_commit_gate:   # Stage 2 cross-file plan checks on git commit (Plan 00144)
      enabled: true        # Warn-first rollout (plan_workflow.qa.commit_gate_mode: warn)
      priority: 44

    plan_time_estimates:   # Blocks time estimates in plan files
      enabled: true        # Enable for projects using CLAUDE/Plan/
      priority: 45

    plan_workflow:         # Provides guidance when creating plans
      enabled: true        # Enable for projects using CLAUDE/Plan/
      priority: 46

    docs_qa_edit:          # EDIT-stage docs QA lint on documentation writes (Plan 00284)
      enabled: true        # Policy under top-level documentation.qa (edit_mode: warn)
      priority: 47

    docs_qa_commit_gate:   # STAGED docs QA gate on git commit (Plan 00284)
      enabled: true        # Warn-first rollout (documentation.qa.commit_gate_mode: warn)
      priority: 47

    npm_command:           # Restricts npm commands to approved list
      enabled: true        # Enable for strict npm usage control
      priority: 49

    markdown_organization: # Enforces markdown file organization rules & plan tracking
      enabled: true        # Enable for md organization + plan tracking
      priority: 50
      # Docs: docs/guides/handlers/markdown_organization.md
      # Plan tracking options (track_plans_in_project, plan_workflow_docs)
      # are now in top-level plan_workflow: section.
      options:
        # Dogfood the forbid-untracked-memory policy (Plan 00131/00133). This
        # repo keeps durable knowledge in tracked docs (CLAUDE/, .claude/rules/),
        # not in untracked ~/.claude/projects/*/memory/ files. Reads stay allowed
        # (for migration); Write/Edit + bash redirect/tee writes to memory are
        # blocked. From v3.24.0 this is also the shipped default — set here
        # explicitly so the intent is visible in config.
        allow_untracked_claude_memory: false
        # extra_allowed_markdown_paths: ADDITIVE on top of the built-in defaults.
        # The built-ins already cover CLAUDE/, docs/, untracked/, RELEASES/,
        # eslint-rules/, src/.../guides/, src/.../skills/, README/CHANGELOG/CLAUDE.md
        # anywhere, the standard repo-root files (CONTRIBUTING, LICENSE, ...), and
        # .claude/{agents,commands,rules,skills}. We only declare the EXTRAS here —
        # no need to redeclare the defaults. See HANDLER_REFERENCE.md.
        # (Migrated from the legacy allowed_markdown_paths override in Plan 00121.)
        extra_allowed_markdown_paths:
          - "^\\.github/.*\\.md$"      # GitHub issue/PR templates, workflow docs
          - "^BUG_REPORTING\\.md$"     # Project root doc (not a standard repo file)
          # Daemon-bundled markdown template assets deployed into client projects
          # (e.g. the plan _TEMPLATE_.md, Plan 00144 Phase 5) — code assets, not docs.
          - "^src/claude_code_hooks_daemon/install/templates/.*\\.md$"

    # TOOL USAGE HANDLERS (Priority 50-60)
    web_search_year:       # Fixes year in web search queries (uses current year)
      enabled: true
      priority: 55

    daemon_docs_guard:     # Warns when reading from hooks-daemon internal CLAUDE/ docs (wrong directory)
      enabled: true
      priority: 57

    flaggable_work_advisor:  # Delegate-first advisory for safeguard-flaggable work (Plan 00278)
      enabled: true           # Ships disabled upstream (get_default_enabled); dogfood-enabled here
      priority: 58            # Topic-term seed only; no flaggable path globs in this repo

    british_english:       # Warns about American English spelling
      enabled: true
      priority: 60

  # PostToolUse handlers (run after tool execution)
  post_tool_use:
    validate_eslint_on_write:  # Runs ESLint after file writes
      enabled: true            # Enable for automatic ESLint validation
      priority: 20

    lint_on_edit:              # Language-aware lint validation after Write/Edit
      enabled: true
      priority: 25
      # Optional: Override lint commands per language
      # command_overrides:
      #   Python:
      #     default: "/usr/bin/python3.11 -m py_compile {file}"  # Custom Python path
      #     extended: "ruff check {file}"
      #   Shell:
      #     default: "bash -n {file}"
      #     extended: null  # Disable shellcheck
      # Default: Uses sys.executable for Python, standard binaries for others
      # Optional: Per-language extended-lint timeout (seconds), default 15s.
      # A timeout ALLOWs (fail-open, unchanged) but is now logged/advised by
      # name -- raise the budget for a language whose extended linter is
      # genuinely slower (e.g. a cold/lock-contended toolchain wrapper).
      # options:
      #   timeouts:
      #     PHP: 30

    markdown_table_formatter:  # Auto-format markdown tables via mdformat + mdformat-gfm
      enabled: true
      priority: 26

    git_hooks_executable_fixer:  # Auto-chmod +x git hooks git skipped as non-executable
      enabled: true
      priority: 27

    background_process_tracker:  # Tracks backgrounded processes; advises harvest-background + watchdog cron (never kills)
      enabled: true
      priority: 28

    command_hints:  # Generic config-driven advisory reminder after a configured command (Plan 00212)
      enabled: true
      priority: 29
      # options:
      #   mode: additive          # additive (default) | replace
      #   hints:
      #     - id: agent-browser-close-session   # overrides the built-in hint of the same id
      #       pattern: "agent-browser"
      #       hint: "Custom reminder text"
      #       ttl_seconds: 1800
      #       min_calls_between: 0  # optional secondary count-based gate

    recovery_cron_advisor:  # Advises on failsafe recovery cron lifecycle (creation, progress, completion)
      enabled: true         # Dogfooding: enabled in this repo; opt-in (false) elsewhere
      priority: 30
      # progress_cooldown_events: 20  # Events between repeat progress reminders (default: 20)

    goal_injection:  # Dogfood: write <session>.goal-intent when a plan flips to In Progress (Plan 00269)
      enabled: true  # Opt-in (false) elsewhere; harmless without an armed supervisor
      priority: 31
      # options:
      #   mode: additive                  # additive (default) | replace (fixed header line always kept)
      #   once_per_plan_per_session: true
      #   lines:
      #     - id: subagents-encouraged    # enable a vetted built-in line without restating its text
      #       enabled: true
      #     - id: project-motto
      #       text: "All findings are logged to {plan_path}/REPORTS/."

  # SessionStart handlers (run when session starts)
  session_start:
    disclosure_reset_session_start:  # Reset per-agent rule-disclosure state on every SessionStart (Plan 00116 Phase 4)
      enabled: true
      priority: 15

    project_handler_load_checker:  # Loud alert when project handlers failed to load (Plan 00143)
      enabled: true
      priority: 50

    hook_registration_checker:  # Validates hook registrations in settings.json
      enabled: true
      priority: 51
      options:
        # Plan 00102 Phase 2: rewrite legacy bare-path command entries to
        # ``bash <path>`` form on first new session after upgrade. One-shot
        # backup at settings.json.bak.pre-bash-migration. Set false to
        # opt out (e.g. if your team manages settings.json by hand).
        auto_migrate_settings: true

    optimal_config_checker:  # Checks Claude Code env for optimal settings
      enabled: true
      priority: 52

    git_filemode_checker:  # Warns when git core.fileMode=false (hooks lose exec perms)
      enabled: true
      priority: 53

    gitignore_safety_checker:  # Warns when required .claude/ paths are missing from .gitignore
      enabled: true            # Uses content-hash cache - only re-checks when .gitignore changes
      priority: 54

    git_upstream_checker:  # Full fetch + pull policy on session start (Plan 00178)
      enabled: true        # New sessions only; silent unless the branch is behind upstream
      priority: 56
      options:
        mode: warn         # warn | agent-pull | auto-pull
        auto_fetch: true   # run additive `git fetch --all --no-prune` before checking ahead/behind

    suggest_status_line:  # Suggests daemon-based status line setup
      enabled: true      # Enable to suggest status line configuration
      priority: 55

    version_check:  # Checks if daemon is up-to-date with latest release
      enabled: true  # Notifies on new sessions if updates available (24h cache)
      priority: 56

    plan_qa_sweep:  # Plan-tree drift report at session start (Plan 00144; silent when clean)
      enabled: true  # Policy under top-level plan_workflow.qa
      priority: 57

    ccy_supervisor_integrity:  # Warns when the ccy supervisor is armed but its files are unsafe (Plan 00148)
      enabled: true            # Silent unless .claude/ccy/ is a ccy project with an armed ccy.env
      priority: 58

    plan_workflow_asset_checker:  # Advise deploy-plan-workflow when mkplan.bash is missing (Plan 00185)
      enabled: true               # Silent unless plan_workflow enabled AND mkplan.bash absent
      priority: 59

    contract_staleness:  # Advise a hooks-contract refresh when Claude Code outruns the vendored audit (Plan 00271)
      enabled: true      # Silent unless installed Claude Code > META.json last_audited_claude_code_version
      priority: 60

    skill_opportunity_detector:  # TTL-gated advisory: run `bin/hooks-daemon skill-scan` (Plan 00274)
      enabled: true              # Dogfood-enabled 2026-08-26 (Task 5.2); ships disabled upstream
      priority: 61

    secret_file_hygiene_checker:  # On-disk hygiene for protected paths (Plan 00272 Task 6.1)
      enabled: true                # gitignore/tracked/permissions -- never reads content
      priority: 62

    model_fallback_detector:  # Loud alert on a recorded safety-triggered model fallback (Plan 00278)
      enabled: true            # Dogfood-ON only: ships DISABLED upstream (opt-in). We keep it
                               # here because THIS estate does flaggable work and the diagnostic
                               # snapshots to untracked/reports/ help tune delegation config.
      priority: 63

    docs_qa_sweep:  # Whole-corpus docs drift report at session start (Plan 00284; silent when clean)
      enabled: true  # Policy under top-level documentation.qa; also builds/refreshes the corpus index
      priority: 64

    tool_disable_advisor:  # Plan 00293 dogfood: check tool_policy.never_want against project settings
      enabled: true  # Opt-in (ships disabled); advisory only, never edits settings
      priority: 65

    monorepo_detector:  # Advise on an unconfigured monorepo shape (manifests found below the repo root, none at it) (Plan 00298)
      enabled: true  # Advisory only, never resolves a boundary; silent when projects: already declared
      priority: 66

    config_optimisation_reminder:  # Remind to re-run /optimise after an upgrade (Plan 00308)
      enabled: true  # Advisory only; silent once a run is recorded against the current version
      priority: 67

  # PreCompact handlers (run before conversation compaction)
  pre_compact:
    disclosure_reset_pre_compact:  # Reset per-agent rule-disclosure state before compaction (Plan 00116 Phase 4)
      enabled: true
      priority: 15

    compaction_signal:  # Dogfood: drop <session>.compacting so the supervisor auto-continues
      enabled: true
      priority: 20

  # SessionEnd handlers — none ship today. `cleanup` was the only one and was
  # removed in Plan 00237 (it reaped a temp/hooks/ directory nothing writes).
  # The section stays so SessionEnd remains a declared, dispatchable event.
  session_end: {}

  # SubagentStop handlers. Both Plan 00237 removals (`subagent_completion_logger`,
  # `remind_prompt_library`) stay gone; Plan 00307 Task 3.1 adds the first live
  # handler back onto this event.
  subagent_stop:
    subagent_report_size_blocker:  # Blocks an oversized subagent final message
      enabled: true
      priority: 15
      options:
        threshold_chars: 4000

  # UserPromptSubmit handlers (run when user submits prompt)
  user_prompt_submit:
    git_context_injector:  # Injects git context into user prompts
      enabled: true
      priority: 10

    failsafe_cron_blockage_suppressor:  # Suppress a delivered failsafe-cron tick while the session is blocked only on human input (Plan 00298)
      enabled: true  # On by default (dogfooding purpose); never terminal
      priority: 37

    critical_thinking_advisory:  # Periodic advisory encouraging critical evaluation
      enabled: true
      priority: 55

    idle_housekeeping_advisory:  # BETA (Plan 00161): report-first idle housekeeping.
      # Off by default upstream; dogfood-enabled here. After 2 consecutive no-op
      # failsafe-recovery ticks, suggests dispatching housekeeping sub-agents that
      # write shareable markdown reports (untracked/reports/). Report-only.
      enabled: true
      priority: 56
      options:
        noop_threshold: 2
        max_passes_per_session: 1
        reports_dir: "untracked/reports"

    standing_authorisations:  # Plan 00223: replay authorisations THIS project recorded.
      # Delivered on UserPromptSubmit because Phase 1 measured it as the only
      # channel that keeps pace with a system prompt re-sent every request:
      # SessionStart's full payload fired ONCE across 18 compactions.
      # Every entry ships DISABLED upstream (Decision 3) — the daemon must
      # never assert consent nobody gave. Enabled here because in this repo
      # the authorisation is real and on the record.
      enabled: true
      priority: 57
      options:
        authorisations:
          - id: subagent-delegation
            enabled: true
          - id: workflow-orchestration
            enabled: false
          # Enabled 2026-08-26 on the user's explicit request: "commit and
          # push atomically and regularly. git is your primary backup".
          - id: commit-push-cadence
            enabled: true

    # auto_continue:  # Auto-continues on 'continue' keyword
    #   enabled: false # Optional - enable for auto-continue behavior
    #   priority: 20

  # Other hook events
  permission_request:
    auto_approve_reads:  # Auto-approves read-only file operations
      enabled: true
      priority: 10

  # Notification handlers — none ship today. `notification_logger` was the only
  # one and was removed in Plan 00237 (it wrote a JSONL nothing ever read).
  # The section stays so Notification remains a declared, dispatchable event.
  notification: {}

  # auto_continue_stop is terminal at priority 10 and matches nearly every Stop,
  # so ANY handler added above it is unreachable on an ordinary stop (Plan 00237
  # removed three that sat there silently). Message-auditing belongs on the
  # nitpick pseudo-event, which fires per-turn. See
  # tests/integration/test_stop_chain_terminal_shadowing.py.
  stop:
    auto_continue_stop:  # Auto-continues after stop events based on criteria
      enabled: true
      priority: 10
      options:
        continue_on_errors: true

  # Status line handlers (format daemon-based status display)
  status_line:
    model_context:  # Shows model name and color-coded context percentage
      enabled: true
      priority: 10
      # options:
      #   # Context thresholds by window size (in thousands of tokens).
      #   # Larger windows get tighter % thresholds — 400k tokens is enormous
      #   # to push back and forth, quality degrades, latency spikes, costs balloon.
      #   200k_orange_pct: 51    # default: 51 (standard models)
      #   200k_red_pct: 76       # default: 76
      #   1000k_orange_pct: 30   # default: 30 (1M context models)
      #   1000k_red_pct: 40      # default: 40

    downgrade_indicator:  # Warns when the session model has silently downgraded (Plan 00278)
      # Self-detected from model-family-rank high-water per session; silent
      # unless a downgrade is active, so it costs nothing normally.
      enabled: true
      priority: 11

    context_sidecar:  # Observe-only context sidecar for the Plan 00135 PTY supervisor
      # Dogfood: ENABLED here so this repo's ccy sessions write a live sidecar
      # (untracked/context-sidecar/<session>.json) the supervisor can read.
      # Shares model_context's thresholds, so `red` matches the status line.
      enabled: true
      priority: 12

    environment_indicator:  # Shows 💻 desktop / 🐳 docker / 📦 podman (cached at startup)
      enabled: true
      priority: 11

    supervisor_indicator:  # Top hat 🎩 w/ bg colour: green armed / yellow dry-run / orange down (ccy supervisor)
      # On by default (renders nothing when no supervisor is configured).
      # Explicitly enabled here for this repo's always-armed ccy sessions.
      enabled: true
      priority: 13

    git_branch:     # Shows current git branch if in repo
      enabled: true
      priority: 20
      options:
        # Keep remote-tracking refs fresh so ahead/behind icons are honest
        auto_fetch: true
        fetch_interval_seconds: 300

    git_repo_name:  # Shows git repository name
      enabled: true
      priority: 25

    working_directory:  # Shows current working directory when different from project root
      enabled: true
      priority: 25

    startup_cleanup:  # Shows 🧹 briefly after startup when stale files were removed
      enabled: true
      priority: 28

    daemon_stats:   # Shows daemon uptime, memory, log level
      # Dev-repo exception (Plan 00167): the health line is useful here.
      # Client projects should generally leave this off — the upgrade
      # prompt no longer depends on it (see upgrade_notifier below).
      enabled: true
      priority: 30

    upgrade_notifier:  # Shows "📦 vX → vY" when a newer daemon version is available
      # On by default; renders NOTHING unless an upgrade is genuinely available.
      enabled: true
      priority: 32

    account_display: # Shows account information
      enabled: true
      priority: 40

    multithread_indicator:  # Shows "🧵 Y/X" — first segment; this thread's rank among live threads
      enabled: true
      priority: 2

    current_time:   # Shows current local time (24-hour format)
      enabled: true
      priority: 14

  worktree_create:  # WorktreeCreate event (isolation:worktree agents / --worktree sessions)
    worktree_create:  # Creates the git worktree at a semantic path and echoes it
      enabled: true
      priority: 50
      options:
        # Both of these were found by running `check-worktree-seed` against this
        # repository (Plan 00267) — neither was configured, and a worktree agent
        # had been running without them for as long as the handler has existed.
        seed:
          default_mode: symlink
          entries:
            # The secret word list. Gitignored, so a worktree lacks it — and
            # sensitive_content does not fail without it, it goes silently
            # INERT. Symlinked so an update to the list reaches every worktree
            # at once; nothing writes to it.
            - .claude/block-words.secret
            # Sets HOOKS_DAEMON_ROOT_DIR. The value is resolved at runtime
            # rather than baked in, so it is identical for every worktree and
            # sharing one copy is correct.
            - .claude/hooks-daemon.env


# Project-level handlers (custom handlers in .claude/hooks/handlers/)
plugins:
  paths: [".claude/hooks/handlers/session_start"]
  plugins:
    - path: dogfooding_reminder
      event_type: session_start
      enabled: true
      priority: 35

# Project layout truths (Plan 00288): which dirs are source/test. Read only
# through the ProjectLayout facade, which composes this with
# documentation.trees and plan_workflow.directory. mode: additive means
# these EXTEND the built-in per-language/test-dir conventions.
layout:
  source_dirs: ["src"]
  test_dirs: ["tests"]
  mode: additive

# Plan workflow configuration (single source of truth for plan tracking)
plan_workflow:
  enabled: true
  directory: "CLAUDE/Plan"
  workflow_docs: "CLAUDE/PlanWorkflow.md"
  enforce_claude_code_sync: false
  # planlib operator-script safety library (Plan 00213 Phase 2). Dogfoods the
  # DEPLOYMENT mechanism only (mirrors the ccy.deploy_supervisor precedent
  # below): this repo is a pure software project with no plan-folder
  # deploy/verify/triage orchestrator scripts to run the library's
  # operational primitives against, so there is nothing genuine to point
  # plan_gate_change/plan_load_ssh_keys/the run-log tee at here. Enabling
  # this still exercises the real, config-gated deploy path end to end
  # (idempotent redeploy through deploy_plan_workflow_if_enabled, the same
  # seam mkplan.bash uses) rather than leaving it entirely unexercised.
  scripts:
    enabled: true
    # pyproject.toml is unique to this repo's root and is never .git (which
    # is the walk's BOUNDARY, not a valid marker -- see PLAN.md Decision 1).
    root_marker: "pyproject.toml"
  # Plan QA subsystem (Plan 00144): one policy for the edit-time lint, the
  # git-commit gate, the SessionStart sweep, and the `plan-qa` CLI.
  qa:
    enabled: true
    completed_dir: Completed
    cancelled_dir: Cancelled
    edit_mode: block
    commit_gate_mode: warn      # warn-first rollout; flip to block after clean dogfooding
    sweep_mode: advise
    require_terminal_date: false  # git history is the SSoT for "when" in this repo
    staleness_days: 30
    legacy_plan_allowlist: []
    # Historic pre-counter number collisions (both claimants archived) —
    # tolerated for ever; new collisions still block.
    collision_allowlist: [34, 39, 41]
    # Per-plan journalling (Plan 00163). Grammar/append-only/freshness/entry
    # checks ship ADVISE; grandfather at 163 (the plan that introduces
    # journalling) so the ~160 legacy journal-less plans are never nagged.
    # freshness_days 3 nags a quiet JOURNAL/ sooner than the 30-day plan
    # staleness window. today_only_mode defaults to block (Plan 00197) and is
    # left at that default here — a stale-dated day-file edit is denied.
    journal:
      enabled: true
      mode: advise
      dir_name: JOURNAL
      freshness_days: 3
      enforce_on_completion: false
      grandfather_before: 163
      # Left at the `block` default. Noted during the Plan 00201 redaction
      # pass: today_only_mode has no exemption for a SECURITY redaction of a
      # historical day-file. Its premise is right for narrative — a
      # correction belongs in a new dated entry, not an edit to an old one —
      # but appending "the 15 July entry contained a real session UUID" does
      # not remove the UUID. That pass flipped this to `advise` for four
      # edits and flipped it straight back; if it recurs, the fix is a
      # first-class escape hatch in the handler (the `MUST_..._BECAUSE`
      # idiom used by git_stash / root_recursion_guard), not a standing
      # relaxation here.

# Documentation SSoT enforcement (Plan 00284). Ships disabled upstream;
# dogfooded here. All surfaces advisory-first (warn/advise) while the
# check catalogue is new -- flip edit_mode/commit_gate_mode to `block`
# only after a clean rollout period, mirroring plan_workflow.qa's own
# warn-first precedent.
documentation:
  enabled: true
  trees:
    agent: CLAUDE
    human: docs
  qa:
    edit_mode: warn
    commit_gate_mode: warn
    sweep_mode: advise
    check_modes: {}
    grandfather_allowlist: []
    # Plan 00289: frozen historical records are excluded from the corpus
    # ENTIRELY, not merely capped at advisory severity the way
    # grandfather_allowlist caps a still-indexed file. A versioned upgrade
    # guide (CLAUDE/UPGRADES/v2/**, v3/**) is a record of what was true when
    # it was written (PlanWorkflow.md's "truth is enforced on LIVE plans,
    # never on the historical record") -- its dead relative links are
    # permanent noise, not debt. The LIVE siblings under CLAUDE/UPGRADES/
    # (README.md, upgrade-template/, UNRELEASED/, truth-changes/,
    # config-changes/) are deliberately NOT matched by the v[0-9]* glob, so
    # they stay normally enforced. The two filename-shape patterns are the
    # same principle applied to individual files rather than a directory: a
    # superseded plan draft kept alongside its live PLAN.md
    # (PLAN-v1.md), and any file that self-labels itself an archived record
    # in its own name (*archived*.md, e.g.
    # CLAUDE/AcceptanceTests/PLAYBOOK-v1-manual-archived.md).
    scope_exclude_globs:
      - "CLAUDE/UPGRADES/v[0-9]*/**"
      - "PLAN-v[0-9]*.md"
      - "*archived*.md"
      # Plan 00288 Task 6.3: the daemon's shipped payload markdown under
      # src/ -- skills, guides and install templates are ASSETS deployed to
      # clients, not documentation living in the wrong place, so the
      # source-tree-markdown check must not ask for them to be promoted.
      # Permanent and deliberate, hence scope exclusion rather than the
      # grandfather allowlist (which marks legacy debt).
      - "src/claude_code_hooks_daemon/skills/**"
      - "src/claude_code_hooks_daemon/guides/**"
      - "src/claude_code_hooks_daemon/install/templates/**"
    generated_docs:
      - glob: ".claude/HOOKS-DAEMON.md"
        generator: "bin/hooks-daemon generate-docs"
      # Task 3.3 T6: this repo's own .claude/skills/ and .claude/agents/ are
      # DEPLOYED COPIES of the canonical sources under
      # src/claude_code_hooks_daemon/skills/ and install/templates/agents/
      # (self-install mode: source == deploy target, so they are currently
      # byte-identical). Declaring them here stops generated-doc-hand-edit
      # blocking the intended redeploy workflow, and stops a future
      # docs-qa run filing the pair as an undeclared duplicate (the first
      # dogfood audit run flagged exactly this shape for docs-qa/SKILL.md).
      - glob: ".claude/skills/hooks-daemon/**/*.md"
        generator: "scripts/upgrade_version.sh (redeploys src/claude_code_hooks_daemon/skills/hooks-daemon/)"
      - glob: ".claude/skills/docs-qa/SKILL.md"
        generator: "scripts/upgrade_version.sh (redeploys src/claude_code_hooks_daemon/skills/docs-qa/SKILL.md)"
      - glob: ".claude/agents/hooks-daemon-*.md"
        generator: "bin/hooks-daemon agents install <name> (redeploys install/templates/agents/)"
      # Plan 00288 D5: the 7 shipped directory-role .claude/rules/ pointer
      # files, same self-install-only reasoning as the agents entry above --
      # this repo's own deployed copy should always track
      # install/directory_role_rules.py's body templates, dogfooding the
      # deploy engine rather than diverging from it. The never-clobber-
      # customised contract those files ALSO carry (like agents) is real for
      # CLIENTS: a hand-edit there is a supported, permanently-preserved
      # customisation, and this manifest entry is deliberately NOT part of
      # the daemon's shipped default `generated_docs` list, so a client's
      # own generated-doc-hand-edit check never fires on their legitimate
      # customisation. Declaring it only HERE nudges an agent working in
      # THIS repo toward the correct edit route (the Python source, then a
      # daemon restart) instead of hand-editing the deployed artefact and
      # silently diverging dogfood from what ships.
      - glob: ".claude/rules/source-dirs.md"
        generator: "bin/hooks-daemon restart (redeploys install/directory_role_rules.py)"
      - glob: ".claude/rules/test-dirs.md"
        generator: "bin/hooks-daemon restart (redeploys install/directory_role_rules.py)"
      - glob: ".claude/rules/human-docs.md"
        generator: "bin/hooks-daemon restart (redeploys install/directory_role_rules.py)"
      - glob: ".claude/rules/agent-docs.md"
        generator: "bin/hooks-daemon restart (redeploys install/directory_role_rules.py)"
      - glob: ".claude/rules/claude-skills.md"
        generator: "bin/hooks-daemon restart (redeploys install/directory_role_rules.py)"
      - glob: ".claude/rules/claude-agents.md"
        generator: "bin/hooks-daemon restart (redeploys install/directory_role_rules.py)"
      - glob: ".claude/rules/plan-dir.md"
        generator: "bin/hooks-daemon restart (redeploys install/directory_role_rules.py)"
    registered_module_docs:
      # Canonical home for the ccy supervisor hot-reload contract
      # (Plan 00284 Task 3.2 slice E — promoted from
      # .claude/rules/ccy-supervisor-dogfooding.md).
      - ".claude/ccy/CLAUDE.md"
    resident_at_imports: ["CLAUDE.md"]

# Daemon-shipped agent assets (Plan 00279). docs_qa dogfoods the Plan 00284
# hooks-daemon-docs-qa auditor in THIS repo; ships disabled upstream.
agents:
  docs_qa:
    enabled: true

project_handlers:
  enabled: true
  path: .claude/project-handlers

# ccy container-workflow config (Plan 00147). deploy_supervisor auto-deploys the
# standalone PTY supervisor (.claude/ccy/claude-supervise.py) into a project's
# .claude/ccy/ on install/upgrade. In this repo (self-install) source == target,
# so the deploy is a no-op — the flag is set true to dogfood the enabled path.
ccy:
  deploy_supervisor: true

# Pseudo-events: synthetic events triggered by real events with frequency control
pseudo_events:
  nitpick:
    enabled: true
    triggers:
      - "pre_tool_use:1/5"    # Fire once every 5 PreToolUse events
      - "stop:1/1"            # Fire on every Stop event
    handlers:
      dismissive_language:
        enabled: true
      hedging_language:
        enabled: true
