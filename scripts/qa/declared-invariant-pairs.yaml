# Declared invariant pairs — the Defence for `asymmetric-sibling-protection`.
#
# Each row names TWO sites that this repository has already reasoned about, and
# the relation that must hold between them. A human who has read both sides
# writes the row; the Detector asserts it mechanically on every QA run.
#
# The class has no syntactic signature. Nothing about either site is wrong on
# its own — it is wrong only RELATIVE to its sibling — so a rule that reads one
# site can never find a member. That is why the pairs are declared, and it is
# also the blind spot: a divergence with no row here is invisible. Adding a row
# is the whole of how this Defence grows.
#
# Fields:
#   id         stable identifier, quoted in the deny message
#   relation   disjoint — the two member sets must not overlap
#              superset — every member of the RIGHT side must appear on the LEFT
#   reason     one sentence: why the two readings cannot both be right
#   left/right file (repo-relative), symbol (module-level name), extract,
#              and optionally `only` (see below)
#   allow      reviewed exceptions, by member name (optional)
#
# `only` restricts a side to named members, and it is load-bearing rather than
# a convenience. Two alternations can EACH be missing members of the other, so
# an unrestricted relation reports a violation in both directions and neither
# report is the defect. Declare which members participate.
#
# Extractors:
#   dict_keys          string keys of a module-level dict literal
#   str_tuple          string members of a module-level tuple/list literal
#   regex_alternation  members of every `(a|b|c)` group in a pattern literal,
#                      read through a `re.compile(...)` call; a top-level
#                      alternative that is punctuation (`>`, `of=`) is not a
#                      named member and is excluded
#   regex_head_names   the `^name\b` command name of each literal pattern in a
#                      module-level tuple/list; a non-literal entry (an
#                      f-string built from a shared grammar) is SKIPPED rather
#                      than guessed at
#
# Source: CLAUDE/Plan/00412-jobs-recurring-work-and-security-review/
#         DESIGN-declared-invariant-pairs.md

- id: pipe-whitelist-vs-command-wrappers
  relation: disjoint
  reason: >
    a name cannot be both a cheap filter whose own output is safe to truncate
    and a wrapper that runs someone else's command, because piping the wrapper
    truncates the WRAPPED command's output.
  left:
    file: src/claude_code_hooks_daemon/strategies/pipe_blocker/common.py
    symbol: UNIVERSAL_WHITELIST_PATTERNS
    extract: regex_head_names
  right:
    file: src/claude_code_hooks_daemon/utils/process_probe.py
    symbol: _WRAPPERS
    extract: dict_keys

- id: worktree-relocation-verbs-vs-write-indicators
  relation: superset
  reason: >
    a verb that relocates a file defeats worktree isolation whichever verb it
    is, so the worktree guard must cover every relocation verb this repository
    already recognises elsewhere.
  left:
    file: src/claude_code_hooks_daemon/handlers/pre_tool_use/worktree_file_copy.py
    symbol: _RELOCATION_VERBS
    extract: str_tuple
  right:
    file: src/claude_code_hooks_daemon/core/utils.py
    symbol: _WRITE_INDICATOR_RE
    extract: regex_alternation
    # `tee` writes NEW content rather than relocating an existing file, so it
    # is not a member of this relation. Without `only`, the comparison would
    # also drag in a verb the left side has no business carrying, and the row
    # would report a defect that is not one.
    only: [cp, mv, install, dd]

# --- call-path rows: a helper exists, and both sites must REACH it ------------

- id: remote-docs-writers-reach-the-content-guard
  relation: reaches
  helper: content_guard
  reason: >
    both functions write fetched remote content to disk, so the writer that
    skips the sensitive-content scan is the one that lands unscanned bytes.
  left:
    file: src/claude_code_hooks_daemon/remote_docs/store.py
    function: write_capture
  right:
    file: src/claude_code_hooks_daemon/remote_docs/store.py
    function: refresh_document

# --- fragment rows: a shared regex fragment both patterns must be built from --

- id: executable-anchors-interpolate-the-path-qualifier
  relation: interpolates
  helper: OPTIONAL_PATH
  reason: >
    both anchor an executable NAME inside a command string, so an anchor that
    omits the shared path-qualifier fragment refuses to recognise the same
    binary invoked by path — and on the `gh` side that is a publish nobody can
    retract.
  left:
    file: src/claude_code_hooks_daemon/handlers/pre_tool_use/sensitive_content.py
    symbol: _GH_BODY_PATTERN
  # `sudo_pip` is the reference because it is a single symbol that already
  # interpolates the fragment. The git surface in `sensitive_content` itself is
  # deliberately NOT the sibling here: it hand-rolls `endswith("/git")`, which
  # is correct, merely bespoke. A row demanding one idiom of both would assert
  # style rather than protection.
  right:
    file: src/claude_code_hooks_daemon/handlers/pre_tool_use/sudo_pip.py
    symbol: _SUDO_PIP_PATTERN

- id: message-file-scanners-reach-the-shared-reader
  relation: reaches
  helper: read_message_files
  reason: >
    both judge text a command carries in a FILE rather than on the command
    line, so a scanner that reads only the command judges `git commit -m
    "<term>"` and misses `git commit -F msg.txt` carrying the same term.
  left:
    file: src/claude_code_hooks_daemon/handlers/pre_tool_use/sensitive_content.py
    function: _bash_haystacks
  right:
    file: src/claude_code_hooks_daemon/handlers/pre_tool_use/github_auto_close_keywords.py
    function: _message_file_texts

- id: automated-prompt-classifiers-reach-the-tick-classifier
  relation: reaches
  helper: classify_tick
  reason: >
    both decide whether a UserPromptSubmit prompt is the human or a daemon
    cron tick, so a classifier that knows only the failsafe literal reads
    every other cron's tick as the owner -- the defect that wiped the
    `[awaiting-human]` marker in multi-cron sessions (Plan 00388).
  left:
    file: src/claude_code_hooks_daemon/handlers/user_prompt_submit/failsafe_cron_blockage_suppressor.py
    function: handle
  right:
    file: src/claude_code_hooks_daemon/handlers/user_prompt_submit/standing_authorisations.py
    function: _is_automated_prompt

- id: installer-file-writers-reach-the-backup-helper
  relation: reaches
  helper: _free_backup_path
  reason: >
    both replace a file the CLIENT may have customised rather than one the
    installer owns, so a writer that hand-rolls its backup path — or skips the
    backup on the invocation most likely to be overwriting a customised file —
    destroys the configuration its sibling preserves.
  left:
    file: install.py
    function: create_settings_json
  right:
    file: install.py
    function: create_daemon_config

- id: write-target-resolvers-reach-the-home-expander
  relation: reaches
  helper: expand_home
  reason: >
    both resolve a write DESTINATION to an absolute path, so a resolver that
    declines `~` disagrees with its sibling about where the same token lands,
    and containment is then decided by the spelling rather than the location.
  left:
    file: src/claude_code_hooks_daemon/core/utils.py
    function: _resolve_write_target
  right:
    file: src/claude_code_hooks_daemon/handlers/pre_tool_use/project_containment.py
    function: _resolve_against_cwd

- id: routine-coverage-vs-interval-bearing-events
  relation: superset
  reason: >
    a run state proves coverage only if the ledger refused to write it without
    the span it covered, so every state the overdue clock accepts as coverage
    must be one that had to record an interval. `skipped` records that nothing
    was reviewed, and counting it as coverage buys another period of silence
    per skip — the mutable pointer this whole design replaced, wearing a
    ledger row.
  left:
    file: src/claude_code_hooks_daemon/routines/ledger.py
    symbol: _NEEDS_INTERVAL
    extract: enum_members
  right:
    file: src/claude_code_hooks_daemon/routines/qa.py
    symbol: _COVERING
    extract: enum_members
