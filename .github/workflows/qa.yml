name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The full three-Python matrix, every night, on main (Plan 00475 Phase 3b).
  # Pushes and pull requests run only the tier their change needs, so this is
  # the run that keeps the whole matrix honest between releases.
  schedule:
    - cron: '17 3 * * *'

# The classify job reads this workflow's earlier runs through the API.
permissions:
  contents: read
  actions: read

concurrency:
  group: qa-${{ github.ref }}
  # Never KILL a running run on the default branch. Plan 00359's release-slate
  # gate requires HEAD's EXACT sha to be CI-green, and plan completion criteria
  # cite a specific commit, so killing a run on main destroys the only evidence
  # either one can use. Superseded runs are still cancelled on a PR branch,
  # where only the tip matters.
  #
  # LIMIT, do not mis-read this as a per-sha guarantee (Plan 00400 N3): false
  # protects the run that is ALREADY RUNNING, and nothing more. GitHub allows
  # only ONE pending run per concurrency group, so while one run is in progress
  # a third push cancels the second before it ever starts — it ends with zero
  # jobs, which is a cancellation rather than a failure and so reads as noise.
  # The property holds for two concurrent pushes and breaks from the third on.
  # A sha pushed into a busy window and superseded before it starts therefore
  # gets NO result at all; cite a later green sha that contains it instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Plan 00475 Phase 3b: which tier does this change need? The rules live in
  # scripts/ci/classify_changes.py (unit-tested), never here.
  #   docs  markdown only: doc and plan checks + the tests the mapper selects
  #   code  anything else: static checks + mapped tests, on ONE Python
  #   full  build or CI config, an unknown base, a nightly or a manual dispatch:
  #         the three-Python matrix below (job qa)
  # Markdown is narrowed, never skipped: tests read the plan index, ledgers
  # and docs, and 9 of 34 markdown-only commits in the last 60 runs failed.
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      base: ${{ steps.classify.outputs.base }}
      head: ${{ steps.classify.outputs.head }}
    steps:
      # Full history: the base may be any ancestor, and a base that is not in
      # history is itself classified as the full tier.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Values arrive through env, never interpolated into the script text.
      # push: base is the head sha of the newest main run of this workflow that
      # reached a verdict, NOT github.event.before: a run superseded while
      # pending is cancelled and tests nothing, so the previous push may be
      # untested. pull_request: base is the merge base with the base branch,
      # head is the PR tip. Anything else (schedule, dispatch): no base, so full.
      - name: Classify
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/emit_tier.bash | tee -a "$GITHUB_OUTPUT"

  # The docs and code tiers: one Python, the change's own checks. A full-suite
  # run on that one Python replaces the mapped tests when the mapper cannot map
  # a changed file (unmapped or too broad), so a change is never verified by
  # tests that did not cover it.
  targeted:
    # A name built from a job output does not render while the job is skipped
    # (it shows the literal expression), so the name is a fixed string.
    name: QA (docs or code tier)
    needs: classify
    if: needs.classify.outputs.tier != 'full'
    runs-on: ubuntu-latest
    env:
      RANGE: ${{ needs.classify.outputs.base }}..${{ needs.classify.outputs.head }}
      TIER: ${{ needs.classify.outputs.tier }}
    steps:
      # fetch-depth 0: the range diff needs both ends, and the acceptance
      # conftest needs tags (see the qa job for the full reasoning).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Same uv-from-lockfile provisioning as the qa job (Plan 00346); the
      # rationale is written out there.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install uv
          VENV_DIR="$(HOOKS_DAEMON_PYTHON="$(command -v python)" \
            bash scripts/lib/resolve_venv.sh dir "$PWD" --fallback-target)"
          UV_PROJECT_ENVIRONMENT="$VENV_DIR" \
            uv sync --frozen --all-extras --python "$(command -v python)"
          test "$(bash scripts/lib/resolve_venv.sh python "$PWD")" = "$VENV_DIR/bin/python"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"

      # Same daemon and relay provisioning as the qa job (Plan 00250, 00350):
      # mapped tests include acceptance and transport gates that skip without
      # them, and a skipped gate is not a passed one.
      - name: Start daemon (for the acceptance gates)
        run: |
          echo "HOOKS_DAEMON_RELEASE_GATE=1" >> "$GITHUB_ENV"
          printf 'HOOKS_DAEMON_ROOT_DIR="%s"\n' "$GITHUB_WORKSPACE" \
            > .claude/hooks-daemon.env
          ./bin/hooks-daemon restart
          ./bin/hooks-daemon status

      - name: Build the relay (for the transport gates)
        run: |
          rustup target add x86_64-unknown-linux-musl
          bash relay/build.sh
          install -D -m 755 \
            untracked/relay-build/hooks-relay-x86_64-unknown-linux-musl \
            untracked/bin/hooks-relay

      # Code tier: the same static gates as the qa job.
      - name: Format (black)
        if: "!cancelled() && env.TIER == 'code'"
        run: black --check src/ tests/

      - name: Lint (ruff)
        if: "!cancelled() && env.TIER == 'code'"
        run: ruff check src/ tests/

      - name: Types (mypy)
        if: "!cancelled() && env.TIER == 'code'"
        run: mypy src/

      - name: Types (pyright)
        if: "!cancelled() && env.TIER == 'code'"
        run: python scripts/qa/run_pyright_check.py --json

      # Docs tier: the whole-tree doc and plan checks, then the mapper tests.
      # Code tier: the tests the mapper selects, plus the fast tools llm_qa
      # changed carries. --allow-unmapped lets the run finish so the next step
      # can decide what to do about files the mapper could not cover.
      - name: Targeted QA (docs tier)
        if: "!cancelled() && env.TIER == 'docs'"
        run: ./scripts/qa/llm_qa.py docs_qa plan_qa changed_tests --range "$RANGE" --allow-unmapped

      - name: Targeted QA (code tier)
        if: "!cancelled() && env.TIER == 'code'"
        run: ./scripts/qa/llm_qa.py changed --range "$RANGE" --allow-unmapped

      - name: Full suite fallback (only when the mapper cannot cover a file)
        if: "!cancelled()"
        run: bash scripts/ci/full_suite_if_unmapped.bash

      - name: Security (bandit)
        if: "!cancelled() && env.TIER == 'code'"
        run: bandit -r src/ .claude/ccy/claude-supervise.py -s B101

      - name: Dependencies (deptry)
        if: "!cancelled() && env.TIER == 'code'"
        run: deptry src/

  # The full three-Python matrix. Job id qa and the matrix key are read by
  # scripts/qa/run_test_matrix.py and tests/integration/test_ci_provisions_the_relay.py.
  qa:
    needs: classify
    if: needs.classify.outputs.tier == 'full'
    name: QA (Python${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.11".
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # fetch-depth: 0 (full history AND tags) is required, not a nicety.
      # tests/acceptance/conftest.py makes a local clone of this checkout and
      # runs `git describe --tags --abbrev=0` on it to find the tag the upgrade
      # gates target. The default shallow, tagless checkout gives that clone no
      # reachable tag, so describe exits 128 and four upgrade gates die on all
      # three interpreters. `fetch-tags: true` alone would NOT fix it: a
      # depth-1 clone has no ancestors, so a tag on any earlier commit is
      # unreachable from HEAD no matter how many tag refs are present.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # uv is needed twice over, and the second reason predates the first.
      #
      # tests/integration/test_ensure_venv.py drives the REAL bootstrap
      # (`ensure_venv` -> `create_venv_at_path` -> `uv sync`), which is the code
      # path behind two field incidents (the v3.9.x ModuleNotFoundError class and
      # the v3.10.0 stdout-capture SEV-1). Without uv on the runner those tests
      # cannot build anything, so CI would have to skip them — and a skipped
      # bootstrap test on all three interpreters is exactly the blindness this
      # workflow exists to remove. The whole file measures ~15s including four
      # real venv builds, so it is not worth trading that coverage for.
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      # Provision from uv.lock, NOT by resolving pyproject.toml (Plan 00346).
      #
      # `pip install -e ".[dev]"` never reads the lockfile — it resolves the
      # lower bounds against PyPI — so this job's toolchain was whatever was
      # newest that morning, on three interpreters drifting independently,
      # while `run_dependency_check.sh` certified the lockfile's freshness with
      # `uv lock --check` and nothing installed from it. A gate that runs an
      # unpinned toolchain answers a different question every day.
      #
      # `--frozen` is the load-bearing flag: a bare `uv sync` UPDATES the lock
      # to satisfy pyproject when the two disagree, re-resolving against PyPI
      # and restoring the drift. The lock is universal (`requires-python
      # = ">=3.11"`), so one lockfile serves the whole matrix.
      #
      # `--python` takes the resolved PATH of the interpreter setup-python
      # installed, not the bare version string, so uv pins the matrix entry
      # rather than downloading a managed interpreter that merely matches it.
      #
      # The venv is built AT THE FINGERPRINT PATH the resolver globs for
      # (untracked/venv-<slug>-py<MM>-<hash>/), not at .venv, and no
      # HOOKS_DAEMON_VENV_PATH is exported. Plan 00250 exported that variable
      # job-wide so the CLI the tests spawn could find .venv — but the test
      # suite's autouse `isolate_daemon_path_overrides` fixture UNSETS it for
      # every test, so every spawned `bin/hooks-daemon` found no venv and
      # auto-bootstrapped one with the runner's system python3: the 3.11 job
      # ran its CLI subprocesses under a py312 venv, paid a uv sync inside the
      # test run to do it, and the two resolutions disagreed. A venv where the
      # resolver looks needs no variable, so nothing a test strips can hide it.
      #
      # HOOKS_DAEMON_PYTHON is set for the ONE command that computes the
      # target: the fingerprint is derived from the interpreter that runs
      # paths.py, and without it the bootstrap path would discover the newest
      # python on the runner rather than the matrix entry.
      #
      # Adding the venv's bin to GITHUB_PATH is what carries the locked
      # toolchain into every later step: they invoke
      # black/ruff/mypy/pytest/bandit/deptry directly (see the note below), so
      # PATH is the only thing that decides which copy of each they get.
      - name: Install
        run: |
          VENV_DIR="$(HOOKS_DAEMON_PYTHON="$(command -v python)" \
            bash scripts/lib/resolve_venv.sh dir "$PWD" --fallback-target)"
          echo "venv: $VENV_DIR"
          UV_PROJECT_ENVIRONMENT="$VENV_DIR" \
            uv sync --frozen --all-extras --python "$(command -v python)"
          test "$(bash scripts/lib/resolve_venv.sh python "$PWD")" = "$VENV_DIR/bin/python"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"

      # The tools are invoked directly rather than through scripts/qa/run_all.sh.
      # That script resolves its interpreter via the daemon's fingerprint-keyed
      # venv resolver, which only exists on an installed daemon — it is a
      # self-install-mode entrypoint, not a CI one. These steps run the same
      # tools against the same pyproject configuration.

      # Every check below carries `if: ${{ !cancelled() }}`, because a failing
      # step otherwise ABORTS THE JOB and every later check is skipped —
      # reported as neither pass nor fail. That is not hypothetical: the four
      # upgrade gates above failed for one run, which silently skipped the
      # project-handler step, which had a test asserting on a hardcoded
      # `/workspace` path that cannot exist on a runner. Two independent
      # defects, and the first hid the second. These checks do not depend on
      # each other, so one run should name all of them — the same reasoning the
      # daemon-load job already applies to import failures. `!cancelled()`
      # rather than `always()`, so a superseded run still stops promptly.
      - name: Format (black)
        if: ${{ !cancelled() }}
        run: black --check src/ tests/

      - name: Lint (ruff)
        if: ${{ !cancelled() }}
        run: ruff check src/ tests/

      - name: Types (mypy)
        if: ${{ !cancelled() }}
        run: mypy src/

      # Plan 00368: the zero-errors pyright gate, run through its own script
      # rather than as a bare `pyright` call. The script passes the running
      # interpreter as --pythonpath, which matters HERE more than anywhere:
      # pyrightconfig.json names `untracked/venv`, a symlink no runner has,
      # and without the override every third-party import is reported
      # missing. The pinned PyPI `pyright` (a dev extra, installed by the
      # frozen sync above) wraps the npm release and needs the runner's node.
      - name: Types (pyright)
        if: ${{ !cancelled() }}
        run: python scripts/qa/run_pyright_check.py --json

      # Plan 00250: the acceptance gates RELEASING.md Step 12.0 declares
      # BLOCKING have never run here. They open a socket under untracked/ and
      # skip when they cannot find one, so without a daemon they are reported
      # as neither pass nor fail — the exact silence this workflow exists to
      # remove. 16 of them across four files, measured in a worktree that
      # reproduces the runner's no-daemon condition.
      #
      # DO NOT add `python install.py --self-install` here. It was tried, and
      # the runner proved it destructive: `create_daemon_config` and
      # `create_settings_json` do NOT skip an existing file — they RENAME it to
      # `.bak` and write a default template over it. The `force` flag only
      # controls whether that backup is taken, so BOTH paths overwrite. On the
      # runner it replaced this repo's 1188-line hooks-daemon.yaml, and the
      # daemon then refused to start because the template it wrote is invalid
      # against the current schema (`Unknown field 'min_confidence_score' at:
      # handlers.session_start.min_confidence_score`).
      #
      # Nothing needs installing. A checkout already has the config, the
      # forwarders and the package; the ONLY missing piece is
      # `.claude/hooks-daemon.env`, which `init.sh`'s repo guard
      # (init.sh:246-264) accepts on mere existence. It is gitignored
      # (.claude/.gitignore:16), so writing it leaves the tree clean.
      #
      # No venv variable is needed here or anywhere: the Install step built
      # the venv at the fingerprint path the CLI resolves on its own, which is
      # also what the CLI the tests spawn (with a stripped environment) finds.
      #
      # Full evidence: CLAUDE/Plan/00250-*/RESEARCH-ci-install.md
      - name: Start daemon (for the acceptance gates)
        if: ${{ !cancelled() }}
        run: |
          # blocking_gate_guard.py (tests/acceptance/) only escalates a skip
          # of a declared release-gate file to a failure when this is set
          # (Plan 00466 N39 widened) -- without it, a daemon that failed to
          # start here would leave those tests skipping quietly instead of
          # failing the job, exactly the Plan 00250 silence this workflow
          # exists to remove. Persisted via GITHUB_ENV for the pytest step
          # below. Written FIRST, before restart/status: `run:` steps use
          # `bash -e`, so a failure in either of those would otherwise abort
          # the script before this line runs, leaving the acceptance tests
          # to skip quietly instead of failing loudly alongside the red
          # start step (Plan 00466 N39 review1 LOW-1).
          echo "HOOKS_DAEMON_RELEASE_GATE=1" >> "$GITHUB_ENV"
          printf 'HOOKS_DAEMON_ROOT_DIR="%s"\n' "$GITHUB_WORKSPACE" \
            > .claude/hooks-daemon.env
          ./bin/hooks-daemon restart
          ./bin/hooks-daemon status

      # Plan 00350: fourteen transport gates skipped on every runner for want
      # of a compiled binary — 11 in test_transport_toggle_cycle.py and 3 in
      # test_relay_guard_fail_open.py. Same defect as the daemon socket above,
      # one artefact over, and the same answer: provision it.
      #
      # TWO paths, and building without deploying fixes only 3 of the 14.
      # relay/build.sh writes untracked/relay-build/hooks-relay-<target>, which
      # is what the three fail-open tests open directly; the eleven
      # toggle-cycle tests resolve the DEPLOYED untracked/bin/hooks-relay. The
      # copy below is what relay_deploy.deploy_relay_from_build does after the
      # build, reduced to the two steps CI needs (no route marker: that records
      # how an INSTALL obtained the binary, and this is not an install).
      #
      # Cost measured, not estimated: ~1s for the whole build. It is a single
      # crate-less source file compiled by plain rustc — no cargo, no
      # dependency graph — so there is nothing a cache would save, and a cache
      # that missed and skipped would reproduce the very skip being removed.
      #
      # `rustup target add` is the only provisioning needed. A runner's
      # preinstalled rustc carries the host target only. musl-gcc is NOT
      # required: rustc's self-contained linking handles it, verified by
      # building with a deliberately poisoned musl-gcc first on PATH.
      - name: Build the relay (for the transport gates)
        if: ${{ !cancelled() }}
        run: |
          rustup target add x86_64-unknown-linux-musl
          bash relay/build.sh
          install -D -m 755 \
            untracked/relay-build/hooks-relay-x86_64-unknown-linux-musl \
            untracked/bin/hooks-relay

      # 95% is the threshold CLAUDE.md and CONTRIBUTING.md both state, so CI
      # enforces it rather than merely reporting it — an unenforced claim is
      # the gap this workflow exists to close. Measured at 95.59% on a clean
      # checkout, so the margin is real but thin; a drop below 95 is a genuine
      # signal, not CI flake. That figure was taken with NO daemon running,
      # which the two steps above have just changed — waking 16 skipped
      # acceptance tests moves coverage, and can also surface long-standing
      # failures in tests that only ever ran without a daemon. Per Plan 00250
      # those are pre-existing, not regressions from this workflow edit.
      #
      # -rs names every SKIPPED test and its reason in the log. A skip is a test
      # that did not run, and this workflow exists because tests that quietly do
      # not run are indistinguishable from tests that pass: four upgrade gates
      # sat skipped here for want of `uv` on the runner, and adding uv turned
      # them straight into failures. Without -rs the only way to notice the next
      # such skip is to compare totals between two runs by hand.
      # Plan 00250 Task 2.4e: playbook probe #144 (Swift lint, expected DENY)
      # flaked to "no decision" on single interpreters across three runs. The
      # verdict now quotes what it observed, and the quote named the cause:
      # "Swift lint check timed out after 15s ... the write was ALLOWED
      # without this check passing". The runner image ships swiftc, and its
      # FIRST invocation builds the stdlib module cache, which on a busy runner
      # can exceed lint_on_edit's 15s budget. Warming the toolchain here moves
      # that cold start out of the timed probe. The budget is deliberately NOT
      # raised: 15s is the right ceiling for a warm toolchain, and widening it
      # would hide a genuinely slow linter from every client.
      - name: Warm the Swift toolchain
        if: ${{ !cancelled() }}
        run: |
          if command -v swiftc >/dev/null 2>&1; then
            printf 'let warm = 1\n' > "${RUNNER_TEMP}/warm.swift"
            time swiftc -typecheck "${RUNNER_TEMP}/warm.swift"
          else
            echo "swiftc not on this runner; probe #144 will skip via required_tools"
          fi

      # Same shape for Go. Playbook probe #155 (Go lint, expected DENY) flaked
      # to "no decision" on one run in three, and the verdict quoted the cause:
      # "Go lint check timed out after 15s for invalid.go - the write was
      # ALLOWED without this check passing". The first `go vet` on a runner
      # compiles the standard library into an empty GOCACHE, which on a busy
      # runner can exceed the budget; warming it here moves that cold start out
      # of the timed probe. As above, the budget is not raised.
      - name: Warm the Go toolchain
        if: ${{ !cancelled() }}
        run: |
          if command -v go >/dev/null 2>&1; then
            mkdir -p "${RUNNER_TEMP}/warm-go"
            printf 'module warm\n\ngo 1.21\n' > "${RUNNER_TEMP}/warm-go/go.mod"
            printf 'package main\n\nimport "fmt"\n\nfunc main() { fmt.Println("warm") }\n' \
              > "${RUNNER_TEMP}/warm-go/main.go"
            (cd "${RUNNER_TEMP}/warm-go" && time go vet ./...)
          else
            echo "go not on this runner; probe #155 will skip via required_tools"
          fi

      # Plan 00463 round 9: `tests/conftest.py` refuses a whole-suite-sized
      # pytest run unless it holds the host-wide full-QA lock (the sink; see
      # claude_code_hooks_daemon.qa.full_qa_gate). A CI runner is single-tenant
      # so there is never real contention, but the sink does not know that —
      # it enforces the same rule everywhere, which is the point. Acquire the
      # SAME lock file (`<git-common-dir>/hooksdaemon-full-qa.lock`) the same
      # way `scripts/qa/run_tests.sh` does, so this step is not a special case.
      - name: Tests + coverage
        if: ${{ !cancelled() }}
        run: |
          GIT_COMMON_DIR="$(git rev-parse --path-format=absolute --git-common-dir)"
          exec {FULL_QA_LOCK_FD}>> "${GIT_COMMON_DIR}/hooksdaemon-full-qa.lock"
          flock "${FULL_QA_LOCK_FD}"
          pytest tests/ \
            -rs \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=95

      # The project handlers sit outside pyproject's `testpaths`, so `pytest
      # tests/` above cannot reach them and CI was as blind to them as the local
      # suite was. Both are terminal handlers that DENY — release_blocker denies
      # the Stop event, enforce_llm_qa denies a Bash command — and
      # scripts/qa/gate-scope.bash excuses them from mypy on the grounds that
      # their own tests cover them, so those tests have to actually run.
      #
      # Kept as its own step rather than folded into the coverage run:
      # --import-mode=importlib is required here (the directory name contains a
      # hyphen, so it is not an importable package) and must not be applied to
      # the main suite.
      - name: Project handler tests
        if: ${{ !cancelled() }}
        run: pytest .claude/project-handlers --import-mode=importlib

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

      - name: Security (bandit)
        # Filter ONLY B101 (asserts) - identical to scripts/qa/run_security_check.sh
        # and .pre-commit-config.yaml. Do NOT reintroduce `-c pyproject.toml`: that
        # used to pull in a skips list which silently exempted B108/B324/B602/B603/
        # B607/B404 in CI only, making CI the loosest of the three surfaces.
        if: ${{ !cancelled() }}
        run: bandit -r src/ .claude/ccy/claude-supervise.py -s B101

      - name: Dependencies (deptry)
        if: ${{ !cancelled() }}
        run: deptry src/

  # Cheap, and a docs-only change cannot break them.
  shell:
    name: Shell
    needs: classify
    if: needs.classify.outputs.tier != 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Scope and flags deliberately mirror scripts/qa/run_shell_check.sh:
          # scripts/ + src/ only, with -x so `source` directives are followed
          # (.shellcheckrc sets source-path=SCRIPTDIR).
          #
          # CLAUDE/UPGRADES/ and tests/fixtures/ are outside that scope by the
          # project's existing policy, not to hide findings: the former are
          # frozen v2-era migration scripts, and the latter are byte-exact
          # snapshots of known-bad code used as regression fixtures — "fixing"
          # a fixture would destroy the very defect it pins.
          find scripts src \( -name '*.sh' -o -name '*.bash' \) -print0 \
            | sort -z \
            | xargs -0 -r shellcheck -x

  daemon-load:
    name: Daemon load
    needs: classify
    if: needs.classify.outputs.tier != 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Same lockfile provisioning as the qa job (Plan 00346). This job asserts
      # that every handler module IMPORTS, so the dependency versions it imports
      # against are the whole point — resolving them from PyPI would let it pass
      # against a package set no other environment has.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen --all-extras --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # CLAUDE/CodeLifecycle/*.md name daemon-load as the check unit tests
      # cannot substitute for: it is what catches import errors, circular
      # imports and registration failures. A real `hooks-daemon restart` needs
      # an installed daemon, so asserting every handler module imports is the
      # CI-safe equivalent — and it is precisely the check that would have
      # caught the historical 5-handler wrong-import-path outage.
      - name: All handler modules import
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          import sys

          import claude_code_hooks_daemon.handlers as handlers

          failures = []
          for mod in pkgutil.walk_packages(handlers.__path__, handlers.__name__ + "."):
              try:
                  importlib.import_module(mod.name)
              # Broad by intent: collect EVERY import failure so one run names
              # all of them, instead of stopping at the first and needing a
              # push per broken module.
              except Exception as exc:
                  failures.append((mod.name, exc))

          for name, exc in failures:
              print(f"FAILED to import {name}: {exc!r}", file=sys.stderr)

          if failures:
              print(f"{len(failures)} handler module(s) failed to import.", file=sys.stderr)
              sys.exit(1)

          print("All handler modules imported cleanly.")
          PY
