name: Full gate trial

# Plan 00476 Tasks 1.1 and 1.2: a TRIAL, not the release gate. It runs each
# llm_qa.py check as its own job on a runner, so the run shows which checks
# pass there and how long each takes. It never runs on main.
on:
  workflow_dispatch:
    inputs:
      checks:
        description: "Space-separated llm_qa checks to run, or 'all'"
        required: false
        default: all
  push:
    branches: [worktree-476-ci-gate-trial]

permissions:
  contents: read

jobs:
  # Chooses the matrix: every check on a push or when `checks` is `all`,
  # otherwise only the named ones.
  plan:
    name: choose checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.pick.outputs.checks }}
    env:
      REQUESTED: ${{ github.event.inputs.checks || 'all' }}
      # Literal copy of llm_qa.ALL_TOOL_NAMES (43 checks, `all` order).
      ALL_CHECKS: >-
        magic_values format lint type_check pyright security dependencies
        shell_check error_hiding shell_audit skill_refs github_urls
        inline_suppressions released_changelog canonical_callers
        python_var_guidance eacces_safe authored_path_stat install_mode_marker
        signal_targets skip_list_substring unreachable_handle_branch
        declared_invariant_pairs fail_open_inventory dangerous_invocation_corpus
        security_downgrade_flags semgrep capture_corruption repo_hygiene
        doc_truth doc_snippets plan_qa docs_qa sensitive_content git_history
        handler_reference generated_doc_drift british_english hook_contract
        input_contract project_handlers tests smoke_test
    steps:
      - id: pick
        run: |
          if [ "$REQUESTED" = "all" ]; then
            chosen="$ALL_CHECKS"
          else
            chosen="$REQUESTED"
          fi
          json="$(printf '%s\n' $chosen | jq -R . | jq -sc .)"
          echo "checks=$json" >> "$GITHUB_OUTPUT"
          echo "matrix: $json"

  check:
    name: check ${{ matrix.check }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    env:
      CHECK: ${{ matrix.check }}
    steps:
      # Full history and tags, as the qa job needs them (acceptance conftest
      # runs git describe on a clone; git_history reads the log).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The `tests` check runs the suite under every Python in the qa.yml
      # matrix; 3.11 is listed first so it is the default `python`.
      - name: Set up Python 3.11
        if: matrix.check != 'tests'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Python 3.11, 3.12 and 3.13
        if: matrix.check == 'tests'
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
            3.13
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --user uv
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          VENV_DIR="$(HOOKS_DAEMON_PYTHON="$(command -v python)" \
            bash scripts/lib/resolve_venv.sh dir "$PWD" --fallback-target)"
          UV_PROJECT_ENVIRONMENT="$VENV_DIR" \
            uv sync --frozen --all-extras --python "$(command -v python)"
          test "$(bash scripts/lib/resolve_venv.sh python "$PWD")" = "$VENV_DIR/bin/python"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"

      - name: Install shellcheck
        if: matrix.check == 'shell_check' || matrix.check == 'shell_audit'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Same daemon provisioning as the qa job, for every check: the daemon is
      # cheap and any check may probe it.
      - name: Start daemon
        run: |
          echo "HOOKS_DAEMON_RELEASE_GATE=1" >> "$GITHUB_ENV"
          printf 'HOOKS_DAEMON_ROOT_DIR="%s"\n' "$GITHUB_WORKSPACE" \
            > .claude/hooks-daemon.env
          ./bin/hooks-daemon restart
          ./bin/hooks-daemon status

      - name: Build the relay
        if: matrix.check == 'tests' || matrix.check == 'smoke_test'
        run: |
          rustup target add x86_64-unknown-linux-musl
          bash relay/build.sh
          install -D -m 755 \
            untracked/relay-build/hooks-relay-x86_64-unknown-linux-musl \
            untracked/bin/hooks-relay

      # The daemon is started above, but it exits after
      # daemon.idle_timeout_seconds (600) without a connection, and the
      # suite's primary run reaches its acceptance tests long after that
      # (trial run 39702691821: daemon RUNNING at job start, "no live socket"
      # at test time). scripts/qa/run_test_matrix.py restarts an idled-out
      # daemon before each extra interpreter's serial run only. This loop
      # opens a connection every 60 s, which counts as activity, and starts
      # the daemon if no live socket answers. Bounded by `timeout`.
      - name: Keep the daemon alive during the run
        if: matrix.check == 'tests'
        run: |
          timeout 18000 bash -c '
            while true; do
              sleep 60
              python -c "
          import glob, socket, sys
          alive = False
          for path in glob.glob(\"untracked/daemon-*.sock\"):
              try:
                  with socket.socket(socket.AF_UNIX) as s:
                      s.settimeout(5)
                      s.connect(path)
                  alive = True
              except OSError:
                  pass
          sys.exit(0 if alive else 1)
          " || ./bin/hooks-daemon start
            done
          ' > untracked/daemon-keepalive.log 2>&1 &

      - name: Run the check
        run: |
          start="$(date +%s)"
          rc=0
          ./scripts/qa/llm_qa.py "$CHECK" || rc=$?
          echo "check=$CHECK exit=$rc seconds=$(( $(date +%s) - start ))"
          exit "$rc"

      - name: Upload QA output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.check }}
          path: untracked/qa/
          if-no-files-found: warn
