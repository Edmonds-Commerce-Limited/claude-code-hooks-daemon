name: Release gate

# Plan 00476 Design 2, 5 and 6: the WHOLE QA gate (every llm_qa.py check in
# ALL_TOOL_NAMES) on a release pull request, split over runners for wall
# clock. A release pull request comes from a branch named `release/<version>`,
# which `/release` creates (Design 1). The single required check is the
# `Release gate` job at the bottom; it needs every other job.
#
# Layout, from the Task 1.2 timings (trial run 39702691821, one 10544 s job):
#   - the 42 fast checks in four jobs, one shared setup each (`checks`);
#   - the `tests` check as one job per leg of scripts/ci/shard_legs.yaml's
#     `full` profile, run by the shared .github/workflows/test-shards.yml
#     (Plan 00572), which also combines and judges the 3.13 coverage once;
#   - the perf_sweep tests alone on a runner (`perf-sweep`, Design 6).
# The `layout` job fails if these lists drift from llm_qa.ALL_TOOL_NAMES or
# from scripts/qa/test_shards.yaml (via shard_legs.py --check), so a new
# check or shard cannot go unrun.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The fast checks, grouped by what they need. `tests` is not here: it is the
# `tests` job's matrix below.
env:
  # Static code checks: no daemon, no extra tools.
  CHECKS_STATIC: >-
    magic_values format lint type_check security dependencies error_hiding
    inline_suppressions canonical_callers python_var_guidance eacces_safe
    authored_path_stat install_mode_marker bare_python_invocation
    signal_targets skip_list_substring
    unreachable_handle_branch declared_invariant_pairs fail_open_inventory
    dangerous_invocation_corpus security_downgrade_flags capture_corruption
    venv_interpreter_trust
  # The slowest static check (118 s on the trial), alone so it extends no group.
  CHECKS_PYRIGHT: pyright
  # Shell, docs, plans and history: needs shellcheck.
  CHECKS_DOCS: >-
    shell_check shell_audit skill_refs github_urls released_changelog
    repo_hygiene doc_truth doc_snippets plan_qa docs_qa sensitive_content
    git_history handler_reference generated_doc_drift british_english semgrep
  # Contracts and the live smoke test: needs the daemon and the relay.
  CHECKS_CONTRACTS: hook_contract input_contract project_handlers smoke_test

jobs:
  # Only a release pull request (head branch release/...) or a manual run
  # gates; every other job needs this one, so a non-release pull request skips
  # the lot. `on.pull_request.branches` filters the BASE branch only, hence
  # the `if` here.
  layout:
    name: Gate layout covers every check and shard
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Compare the workflow's lists with llm_qa and the shards file
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, "scripts/qa")
          import llm_qa

          problems = []
          groups = [
              os.environ[name].split()
              for name in ("CHECKS_STATIC", "CHECKS_PYRIGHT", "CHECKS_DOCS", "CHECKS_CONTRACTS")
          ]
          listed = [check for group in groups for check in group] + ["tests"]
          if sorted(listed) != sorted(set(listed)):
              problems.append(f"a check is listed twice: {sorted(listed)}")
          wanted = set(llm_qa.ALL_TOOL_NAMES)
          if set(listed) != wanted:
              problems.append(
                  f"missing {sorted(wanted - set(listed))}, unknown {sorted(set(listed) - wanted)}"
              )

          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

      # The shard legs (scripts/ci/shard_legs.yaml): every Python of every
      # profile runs each shard of scripts/qa/test_shards.yaml exactly once,
      # and coverage is one Python's legs, all of them.
      - name: Check the shard legs cover every shard
        run: python scripts/ci/shard_legs.py --check

  checks:
    name: checks ${{ matrix.group }}
    needs: layout
    runs-on: ubuntu-latest
    # The groups measured 120 to 600 s of check time on the trial.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [static, pyright, docs, contracts]
    steps:
      # Full history and tags: git_history reads the log, and the acceptance
      # conftest and released_changelog read tags (see qa.yml's qa job).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.13"

      - name: Install shellcheck
        if: matrix.group == 'docs'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # qa.yml's daemon step. The trial started it for every check and 42 of
      # 42 fast checks passed that way, so every group gets it.
      - name: Start daemon
        run: |
          echo "HOOKS_DAEMON_RELEASE_GATE=1" >> "$GITHUB_ENV"
          printf 'HOOKS_DAEMON_ROOT_DIR="%s"\n' "$GITHUB_WORKSPACE" \
            > .claude/hooks-daemon.env
          ./bin/hooks-daemon restart
          ./bin/hooks-daemon status

      - name: Build the relay
        if: matrix.group == 'contracts'
        run: |
          rustup target add x86_64-unknown-linux-musl
          bash relay/build.sh
          install -D -m 755 \
            untracked/relay-build/hooks-relay-x86_64-unknown-linux-musl \
            untracked/bin/hooks-relay

      # One llm_qa.py call per group: each check still reports its own result.
      - name: Run the ${{ matrix.group }} checks
        env:
          GROUP: ${{ matrix.group }}
        run: |
          case "$GROUP" in
            static) checks="$CHECKS_STATIC" ;;
            pyright) checks="$CHECKS_PYRIGHT" ;;
            docs) checks="$CHECKS_DOCS" ;;
            contracts) checks="$CHECKS_CONTRACTS" ;;
            *) echo "unknown group $GROUP"; exit 1 ;;
          esac
          read -r -a check_args <<< "$checks"
          ./scripts/qa/llm_qa.py "${check_args[@]}"

      - name: Upload QA output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-checks-${{ matrix.group }}
          path: untracked/qa/
          if-no-files-found: warn
          retention-days: 14

  # The `tests` check, sliced over runners by the shared test-shards workflow
  # (Plan 00572 Task 2.1), which qa.yml's full tier and fallback also call.
  # Its legs (each Python runs every shard of scripts/qa/test_shards.yaml
  # once; 3.13 collects coverage, combined in its own coverage job) are the
  # `full` profile of scripts/ci/shard_legs.yaml, which the layout job checks.
  tests:
    name: tests
    needs: layout
    uses: ./.github/workflows/test-shards.yml
    with:
      profile: full

  # Plan 00476 Design 6: qa.yml's perf-sweep job, unchanged in shape. The
  # CPU-timing sweeps run alone on a runner, thresholds untouched.
  perf-sweep:
    name: Performance sweeps
    needs: layout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-env
        with:
          python-version: "3.11"

      - name: Performance sweeps (perf_sweep tests only)
        run: pytest tests/ -rs -m perf_sweep

  # The one required check. Green only when every job above succeeded; a
  # non-release pull request skips the whole gate, this job included.
  release-gate:
    name: Release gate
    needs: [layout, checks, tests, perf-sweep]
    if: ${{ !cancelled() && needs.layout.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          {
            echo "### Release gate"
            echo
            echo "| Job | Result |"
            echo "| --- | ------ |"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
