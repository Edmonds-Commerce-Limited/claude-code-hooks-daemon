name: Test shards

# Plan 00572 Task 2.1: the test suite split over runners, one definition for
# every caller. release-gate.yml runs it for a release pull request; qa.yml
# runs it for the full tier (nightly, CI config, manual) and as the code or
# docs tier's full-suite fallback. The legs of each profile are declared in
# scripts/ci/shard_legs.yaml (rules checked by `shard_legs.py --check`), the
# shards themselves in scripts/qa/test_shards.yaml.
on:
  workflow_call:
    inputs:
      profile:
        description: A profile of scripts/ci/shard_legs.yaml (full or fallback)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The profile's job matrix, read from the one declaration.
  plan:
    name: Plan the ${{ inputs.profile }} legs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      coverage-shards: ${{ steps.plan.outputs.coverage-shards }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Read the legs
        id: plan
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          python scripts/ci/shard_legs.py --profile "$PROFILE" | tee -a "$GITHUB_OUTPUT"

  # Each leg runs its shards through `run_test_matrix.py --shard ...` under
  # its own interpreter only.
  tests:
    name: tests ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    # The longest leg measured 2303 to 2880 s; one slow runner took 4644 s.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SHARDS: ${{ matrix.shards }}
      COVERAGE: ${{ matrix.coverage }}
    steps:
      # Full history and tags: the acceptance conftest clones this checkout
      # and runs `git describe --tags` on it (see qa.yml's qa job).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # qa.yml's Install: uv from --user, the venv at the fingerprint path the
      # resolver globs for, built from uv.lock.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --user uv
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          VENV_DIR="$(HOOKS_DAEMON_PYTHON="$(command -v python)" \
            bash scripts/lib/resolve_venv.sh dir "$PWD" --fallback-target)"
          UV_PROJECT_ENVIRONMENT="$VENV_DIR" \
            uv sync --frozen --all-extras --python "$(command -v python)"
          test "$(bash scripts/lib/resolve_venv.sh python "$PWD")" = "$VENV_DIR/bin/python"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"

      # Runner image ubuntu26/20261101.64 caps /tmp, and the integration
      # shard's tmp_path trees (a full clone of this repository among them)
      # outgrew it: every test leg on that image failed with EDQUOT under
      # /tmp/pytest-of-runner. /ci-tmp is on the root disk, short, and has no
      # ancestor but `/`. RUNNER_TEMP is none of the last two: it sits under
      # /home/runner, whose `.claude` the root-discovery tests found, and its
      # length overflowed AF_UNIX socket paths. Every later step, and every
      # process it spawns, inherits TMPDIR from GITHUB_ENV.
      - name: Keep temporary files off the capped /tmp
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /ci-tmp
          echo "TMPDIR=/ci-tmp" >> "$GITHUB_ENV"
          df -h /tmp /ci-tmp
          findmnt --target /tmp

      # The daemon legs reach the live daemon and the relay (acceptance and
      # transport gates); HOOKS_DAEMON_RELEASE_GATE turns a skipped gate red.
      # No `install.py --self-install`: it overwrites the tracked config (see
      # qa.yml's history in Plan 00250); the env file is all a checkout lacks.
      - name: Start daemon
        if: matrix.daemon
        run: |
          echo "HOOKS_DAEMON_RELEASE_GATE=1" >> "$GITHUB_ENV"
          printf 'HOOKS_DAEMON_ROOT_DIR="%s"\n' "$GITHUB_WORKSPACE" \
            > .claude/hooks-daemon.env
          ./bin/hooks-daemon restart
          ./bin/hooks-daemon status

      # Plan 00350: build AND deploy. relay/build.sh writes
      # untracked/relay-build/hooks-relay-<target> (3 fail-open gates read
      # that); the 11 toggle-cycle gates read the deployed untracked/bin copy.
      # rustc's self-contained linking needs only the musl target.
      - name: Build the relay
        if: matrix.daemon
        run: |
          rustup target add x86_64-unknown-linux-musl
          bash relay/build.sh
          install -D -m 755 \
            untracked/relay-build/hooks-relay-x86_64-unknown-linux-musl \
            untracked/bin/hooks-relay

      # Warm-ups for lint probes #144 (Swift) and #155 (Go): a cold toolchain
      # can exceed lint_on_edit's 15 s budget on a busy runner. The budget is
      # deliberately not raised.
      - name: Warm the Swift and Go toolchains
        if: matrix.daemon
        run: |
          if command -v swiftc >/dev/null 2>&1; then
            printf 'let warm = 1\n' > "${RUNNER_TEMP}/warm.swift"
            time swiftc -typecheck "${RUNNER_TEMP}/warm.swift"
          fi
          if command -v go >/dev/null 2>&1; then
            mkdir -p "${RUNNER_TEMP}/warm-go"
            printf 'module warm\n\ngo 1.21\n' > "${RUNNER_TEMP}/warm-go/go.mod"
            printf 'package main\n\nimport "fmt"\n\nfunc main() { fmt.Println("warm") }\n' \
              > "${RUNNER_TEMP}/warm-go/main.go"
            (cd "${RUNNER_TEMP}/warm-go" && time go vet ./...)
          fi

      # FALLBACK, not the preferred fix. The daemon exits after
      # daemon.idle_timeout_seconds (600) with no connection, and the
      # integration shard runs far longer than that between daemon uses.
      # There is no environment or overlay route to that setting: it is read
      # only from the TRACKED .claude/hooks-daemon.yaml, and editing that on
      # the runner dirties the tree the tests and the leg checkpoints read.
      # run_test_matrix.py restarts an idled-out daemon before each serial
      # shard; this covers the time inside one. Every 60 s it opens a socket
      # connection (which counts as activity) and starts the daemon if no
      # socket answers. Bounded by `timeout`; it dies with the job.
      - name: Keep the daemon alive during the run
        if: matrix.daemon
        run: |
          timeout 10800 bash -c '
            while true; do
              sleep 60
              python -c "
          import glob, socket, sys
          alive = False
          for path in glob.glob(\"untracked/daemon-*.sock\"):
              try:
                  with socket.socket(socket.AF_UNIX) as s:
                      s.settimeout(5)
                      s.connect(path)
                  alive = True
              except OSError as exc:
                  print(f\"{path}: {exc}\")
          sys.exit(0 if alive else 1)
          " || ./bin/hooks-daemon start
            done
          ' > untracked/daemon-keepalive.log 2>&1 &

      # The perf_sweep tests are deselected here (pytest reads PYTEST_ADDOPTS
      # in every shard run) and run alone in the perf-sweep job: under load
      # their CPU bounds are missed (ledger 00474 N455).
      - name: Run the shards
        env:
          PYTEST_ADDOPTS: -m "not perf_sweep"
        run: |
          args=()
          for shard in $SHARDS; do
            args+=(--shard "$shard")
          done
          if [ "$COVERAGE" = "true" ]; then
            args+=(--coverage)
          fi
          python scripts/qa/run_test_matrix.py "${args[@]}"

      - name: Upload test output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-tests-${{ inputs.profile }}-${{ matrix.python }}-${{ strategy.job-index }}
          path: |
            untracked/qa/
            untracked/daemon-keepalive.log
          if-no-files-found: warn

      # Each coverage shard's data file (untracked/qa/.coverage.<shard>),
      # combined in the coverage job. Hidden files need opting in.
      - name: Upload coverage data
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ inputs.profile }}-${{ strategy.job-index }}
          path: untracked/qa/.coverage.*
          include-hidden-files: true
          if-no-files-found: error

  # The coverage verdict over every shard of the coverage Python, held to
  # pyproject's fail_under (95), as the local stage's combine does. A missing
  # shard's file fails `coverage combine` by name. A profile with no coverage
  # legs skips it.
  coverage:
    name: coverage (all shards)
    needs: [plan, tests]
    if: ${{ !cancelled() && needs.plan.outputs.coverage-shards != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHARDS: ${{ needs.plan.outputs.coverage-shards }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --user uv
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          VENV_DIR="$(HOOKS_DAEMON_PYTHON="$(command -v python)" \
            bash scripts/lib/resolve_venv.sh dir "$PWD" --fallback-target)"
          UV_PROJECT_ENVIRONMENT="$VENV_DIR" \
            uv sync --frozen --all-extras --python "$(command -v python)"
          test "$(bash scripts/lib/resolve_venv.sh python "$PWD")" = "$VENV_DIR/bin/python"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-${{ inputs.profile }}-*
          path: untracked/qa/
          merge-multiple: true

      - name: Combine and judge
        run: |
          files=()
          for shard in $SHARDS; do
            files+=("untracked/qa/.coverage.$shard")
          done
          python -m coverage combine --keep --data-file=untracked/qa/coverage-combined.data "${files[@]}"
          python -m coverage report --data-file=untracked/qa/coverage-combined.data
