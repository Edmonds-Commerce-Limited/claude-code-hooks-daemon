version: "3.64.0"
truth_changes:
  - topic: install-and-upgrade
    was: >
      `check-truth-changes` prints the entire `was → now` reconciliation list
      inline, and step 4 of the upgrade skill reads every entry from that
      output and reconciles each one itself.
    now: >
      `check-truth-changes` writes the full report to
      `untracked/truth-changes/v<from>-to-v<to>/REPORT.md` plus one
      `chunk-NN-<topic>.md` file per topic, and prints only a bounded summary
      (under 8,000 bytes) naming them. Step 4 of the upgrade skill dispatches
      one subagent per chunk file, in parallel, and each subagent returns only
      the files it changed; a chunk marked SEQUENTIAL runs alone afterwards.
      `--full` prints the whole report inline; `--report-dir` moves the files.
  - topic: install-and-upgrade
    was: >
      `check-config-migrations` prints the whole advisory inline — every
      recommended and informational option with its description, note and
      example YAML — and step 5 of the upgrade skill reads it from stdout.
    now: >
      `check-config-migrations` writes the full advisory to
      `untracked/config-changes/v<from>-to-v<to>/ADVISORY.md` and prints a
      bounded summary: stale keys, renamed keys and each recommended key with
      its recommended and current value inline, plus a count of informational
      options. A recommendation's migration Note is read from the file before
      enabling. `--full` prints the whole advisory inline.
  - topic: bug-reporting
    id: upstream-issue-reporting
    was: >
      To report a hooks daemon bug, run the diagnostic generator
      (`scripts/debug_info.py`, `hooks-daemon bug-report`, or the `report`
      skill) and paste its output — or the relevant part of it, with sensitive
      values removed by hand — into a GitHub issue on the daemon's tracker.
    now: >
      Those three are LOCAL diagnostics for the person who ran them and must
      never be pasted into an issue: they reproduce the project's config file,
      its environment and its logs on purpose, because the reader is you. To
      report a defect upstream, run
      `hooks-daemon issue-report --fields <file.json>`, which collects a
      controlled field set and never gathers the hostname, git remote, `.env`,
      config dump or logs at all, then file the document it writes with
      `gh issue create --repo Edmonds-Commerce-Limited/claude-code-hooks-daemon
      --body-file <report>`. The full procedure — including what to establish
      before filing — is `BUG_REPORTING.md` at the daemon's root, and the
      `hooks-daemon` skill drives it with args `issue-report`. A client
      project's `gh issue create` against that tracker is DENIED unless the
      body came from the generator (`R-UPSTREAM-ISSUE-UNVERIFIED-BODY`);
      issues on your own repository are untouched, and so is `--web`, which
      files nothing and opens GitHub's own issue forms — the fallback when the
      generator genuinely cannot run.
  - topic: daemon-cli
    id: daemon-version-flag
    was: >
      `bin/hooks-daemon --version` prints the installed daemon version, and the
      version also appears in `hooks-daemon status` output.
    now: >
      There is no `--version` flag — it exits non-zero with
      `unrecognized arguments` — and `status` reports runtime state (PID,
      socket, PID file, listener count) with no version in it. Run
      `bin/hooks-daemon release-notes` with no flags: it prints the notes for
      the installed version and its first heading names that version.
  - topic: hook-transport
    was: >
      Running `transport on`/`off` for the state the config already holds is a
      clean no-op: it reports `relay already <state> — nothing to do`, exits 0
      and changes nothing.
    now: >
      `transport on`/`off` verify the DEPLOYED forwarders rather than trusting
      the config alone. When the forwarders already agree it is still a free
      no-op — no write, no restart, no probes — but when they have drifted
      (an interrupted toggle, a hand-edited config, a checkout that moved one
      and not the other) they are regenerated, the daemon restarted and the
      state verified, and the report names the repair instead of saying
      nothing to do. That reconcile never auto-reverts, because the config
      never moved and the only state to restore would be the drift itself.
      Enabling is gated on the relay binary first, so a repair cannot deploy a
      hot path with no binary behind it.
