version: "3.19.0"
truth_changes:
  - was: >
      To allow markdown files in an extra location, set `allowed_markdown_paths`
      in the markdown_organization handler config — a list of regex patterns that
      replaces the built-in allowed locations (so you must redeclare CLAUDE/, docs/,
      RELEASES/, etc. to keep them).
    now: >
      To ADD an allowed markdown location, set `extra_allowed_markdown_paths` — an
      additive list layered on top of the built-in defaults, so you declare only the
      extras and keep all upstream defaults automatically. `allowed_markdown_paths`
      still exists as a full override, but is discouraged for simple additions and
      should only be used to deliberately FORBID a built-in default location.
  - was: >
      Only `SKILL.md` inside `.claude/skills/` is allowed everywhere; other markdown
      a skill ships (reference/usage docs) is blocked by markdown_organization.
    now: >
      All markdown inside `.claude/skills/` is allowed everywhere, so a skill can ship
      supporting reference/usage docs alongside its `SKILL.md`.
