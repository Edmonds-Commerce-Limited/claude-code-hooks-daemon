# NOTE: filename must match the actual released version.
version: "3.51.0"
truth_changes:
  - was: >
      "bin/hooks-daemon" acts on whichever project your current working
      directory belongs to. Notes may assert that running one project's wrapper
      from another directory is a way to manage that other project's daemon —
      the wrapper's own design notes claimed it anchored to its own location,
      but that was true of the interpreter only.
    now: >
      The wrapper anchors the daemon it MANAGES to its own location (v3.51.0),
      not to your working directory. "/path/to/projectA/.claude/hooks-daemon/bin/hooks-daemon
      restart" restarts project A's daemon no matter where you run it from. If
      you relied on the old CWD-following behaviour, pass "--project-root
      /path/to/project" explicitly — it still takes precedence. This closes a
      silent cross-project hazard: a client project's wrapper, invoked by
      absolute path from another project's directory, previously restarted that
      OTHER project's daemon and reported success.

  - was: >
      The daemon's virtualenv is built by hand, at
      ".claude/hooks-daemon/untracked/venv/", e.g. with
      "python3 -m venv untracked/venv && untracked/venv/bin/pip install -e .".
      Install and upgrade notes, and any local runbook copied from older release
      notes, commonly assert this.
    now: >
      That is the pre-v3.7.0 layout and the canonical resolver REFUSES it —
      venvs have been fingerprint-keyed since v3.7.0
      ("untracked/venv-{slug}-py{MM}-{fingerprint}/"). A hand-built
      "untracked/venv/" is not picked up, so the daemon appears uninstalled
      while the directory plainly exists. Let the installer build it:
      "bash .claude/hooks-daemon/scripts/install_version.sh \"$PWD\" \"$PWD/.claude/hooks-daemon\"".
      Never hardcode a venv path in your own scripts — run the deployed wrapper
      ".claude/hooks-daemon/bin/hooks-daemon <command>", which resolves the venv
      itself. v3.51.0 also converts seven internal fallbacks to this retired
      path into fail-fast errors, because a fallback that can never succeed only
      turns "the resolver is missing" into a confusing "no such file".

  - was: >
      To run a daemon command, change into the daemon directory first:
      "cd .claude/hooks-daemon && <command>".
    now: >
      The "daemon_location_guard" handler BLOCKS Bash commands that cd into
      ".claude/hooks-daemon/". Run the wrapper from the project root instead —
      it works regardless of your working directory:
      ".claude/hooks-daemon/bin/hooks-daemon status". To read daemon source for
      debugging, use Read with an absolute path rather than cd-ing in. Docs that
      still teach the cd form instruct an agent to do something the daemon then
      denies, which reads as a broken install.

  - was: >
      "install.py" in the daemon directory is how the daemon is installed or
      reinstalled.
    now: >
      "install.py" is self-deprecated. The supported entry point is
      "scripts/install_version.sh" for a fresh install and "scripts/upgrade.sh"
      (curl-fetched, with "--project-root") for an upgrade. Both build the
      fingerprint-keyed venv, preserve configuration and start the daemon.
