version: "3.52.0"
date: "2026-08-12"
breaking: false
config_changes:
  added:
    - key: plan_workflow.qa.journal.today_only_mode
      recommended: true
      dormant: false
      description: >-
        NEW journal-dayfile-is-today edit-time check (Plan 00197), enabled by
        default at BLOCK. A Write/Edit targeting a plan JOURNAL/ day-file
        (NNNNN-Journal-YY-MM-DD.md) whose embedded date is anything other
        than TODAY -- including yesterday -- is denied, with a remediation
        naming the exact today-dated filename to write instead. Previously
        journal-dayfile-naming tolerated a yesterday-dated file as a
        "legitimate midnight rollover"; that tolerance is exactly the
        agent-mis-filing confusion this new check closes, so a session
        spanning midnight must now start today's day-file rather than keep
        appending to yesterday's. Controlled independently of the existing
        plan_workflow.qa.journal.mode knob via today_only_mode (advise |
        block | off; default block) -- unlike the rest of the journalling
        feature, this check does NOT ship advise-first, since the failure
        mode it defends against is silent mis-filing, not a rollout risk.
        Like every plan_qa edit-time blocker it is subordinate to the
        surface mode: it only denies when plan_workflow.qa.edit_mode is
        ALSO "block" (the shipped default); under edit_mode: warn it
        degrades to advisory, and edit_mode: off disables it entirely.
        Grandfathered plans in legacy_plan_allowlist only ever advise.
      migration_note: >-
        No action needed to adopt -- upgrading immediately blocks stale
        journal day-file edits for any project with plan_workflow enabled
        and edit_mode: block (the default). If your workflow genuinely
        needs to edit a non-today day-file (e.g. scripted backfill), set
        plan_workflow.qa.journal.today_only_mode: advise or off in your
        .claude/hooks-daemon.yaml.
    - key: handlers.pre_tool_use.sensitive_content
      recommended: true
      dormant: true
      description: >-
        NEW PreToolUse blocking handler (Plan 00201). Denies a Write/Edit
        whose content matches either of two independently configurable
        sources: options.public_patterns (named regexes, safe to name --
        the deny reason shows the pattern name and the exact matched text)
        and options.secret_word_list_path (default
        .claude/block-words.secret, one gitignored term per line, matched
        literally and case-insensitively). A secret-list match is NEVER
        disclosed anywhere -- not in the deny reason, not in any daemon
        log, not in payload capture, not in a PreCompact transcript
        archive -- the deny reason names only a 1-based index
        (entry N of M in the secret word list). Both sources are inert by
        default: public_patterns defaults to an empty list and a missing
        secret word list file is a silent no-op, so the handler ships
        dormant until a project populates either. A companion whole-tree
        QA backstop (scripts/qa/check_sensitive_content.py, wired into
        run_all.sh / llm_qa.py as check 16) enforces the same two sources
        against every git-tracked file, for content that never passed
        through a Write/Edit tool call (git mv, external editors, other
        agents).
      migration_note: >-
        Dormant by default -- no behaviour changes until you populate
        options.public_patterns and/or create
        .claude/block-words.secret (see
        .claude/block-words.secret.example for the file format). The
        secret word list MUST be gitignored (*.secret / *.secrets are
        added to the default .gitignore patterns this release,
        session_start.gitignore_safety_checker will warn if missing) and
        must never be committed, printed, or pasted into a bug report --
        only its gitignored file path and a numeric line index are ever
        surfaced anywhere.
    - key: handlers.pre_tool_use.agent_isolation_advisor
      recommended: true
      dormant: false
      description: >-
        NEW PreToolUse advisory handler (Plan 00200). When more than one agent
        thread is already live in this checkout, spawning another Agent without
        isolation is flagged. It never blocks. Agents sharing one working tree
        share a single .git/index, so a peer's bare "git commit" can silently
        absorb another agent's staged work -- the advisory suggests
        isolation: "worktree" on the Agent tool, with "git merge" or
        "git cherry-pick" to bring the work back. It deliberately does NOT
        advise isolation for agents that need the real project root (daemon
        restart verification and client-mode testing do not work in a
        worktree).
      migration_note: >-
        On by default and advisory only; no action needed. Disable with
        handlers.pre_tool_use.agent_isolation_advisor.enabled: false.
  renamed: []
  removed: []
  changed:
    - key: handlers.pre_tool_use.destructive_git
      recommended: false
      description: >-
        No config change, but a BEHAVIOUR change worth knowing before you
        upgrade: destructive_git, git_stash, sudo_pip, curl_pipe_shell and
        sensitive_content were each bypassable by respelling the command, and
        all ten known bypasses are now closed. Commands that previously ran
        will now be denied -- "git -C /path reset --hard", "git -C /path
        stash", "sudo -H pip install", "sudo /usr/bin/pip install",
        "curl URL | /bin/bash", and any of these split across lines with a
        trailing backslash. Shell line continuations are now normalised once at
        the point commands enter the daemon, so every command guard sees the
        joined form.
      migration_note: >-
        No configuration to change. If a script of yours relied on one of those
        spellings, it will now be blocked; use the documented escape hatch for
        that handler, or set its enabled: false, rather than respelling the
        command.
