# Drafted by Plan 00619.
version: "3.76.0"
date: "2026-11-20"

breaking: false

config_changes:
  added:
    - key: branches.wip.ladder
      recommended: false
      dormant: false
      description: >-
        The warning percentages of the open-work pool, measured against the
        point where creating a branch is refused (branches.wip.cap plus
        wip.creation_grace). warn, strong and very_strong default to 60, 80
        and 90 and must rise in that order. A pool whose mode is warn still
        gets the ladder, worded as a limit rather than a refusal.
      example_yaml: |
        branches:
          wip:
            ladder: {warn: 60, strong: 80, very_strong: 90}
    - key: branches.parked.ladder
      recommended: false
      dormant: false
      description: >-
        The same warning percentages for the parked pool, measured against
        branches.parked.cap. Defaults 60, 80 and 90; must rise in order.
      example_yaml: |
        branches:
          parked:
            ladder: {warn: 60, strong: 80, very_strong: 90}
    - key: branches.merged.ladder
      recommended: false
      dormant: false
      description: >-
        The same warning percentages for the merged pool, measured against
        branches.merged.cap. Defaults 60, 80 and 90; must rise in order.
      example_yaml: |
        branches:
          merged:
            ladder: {warn: 60, strong: 80, very_strong: 90}
    - key: handlers.pre_tool_use.branch_pool_pressure_advisor
      recommended: true
      dormant: false
      description: >-
        Warns on tool calls as a branch pool fills; at 90 percent of its block
        point it warns on every call until the pool drops below it. Context
        only: it never denies.
      example_yaml: |
        handlers:
          pre_tool_use:
            branch_pool_pressure_advisor: {enabled: true, priority: 20}
    - key: handlers.user_prompt_submit.branch_pool_pressure_prompt
      recommended: true
      dormant: false
      description: >-
        The same branch pool warning ladder on every prompt at 90 percent.
        Context only: it never holds a prompt.
      example_yaml: |
        handlers:
          user_prompt_submit:
            branch_pool_pressure_prompt: {enabled: true, priority: 44}
    - key: handlers.session_start.workflow_linter_advisor
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00621). At a new session (not a resume), when
        `.github/workflows/` holds at least one `.yml`/`.yaml` file and none
        has a `uses:` line naming `actions-qa-ci`, suggests that workflow
        linter: what it checks and its release page. It prints no install
        command, never runs the linter and never blocks. A workflow file it
        cannot read is named and never counts as using the linter.
      example_yaml: |
        handlers:
          session_start:
            workflow_linter_advisor:
              enabled: true
              priority: 72
      migration_note: >-
        On by default. Adopt the linter, or set `enabled: false` to silence
        the suggestion.
    - key: handlers.post_tool_use.lint_on_edit.options.timeouts."GitHub Workflow"
      recommended: false
      dormant: false
      description: >-
        NEW language name (Plan 00621). lint_on_edit runs the optional
        `actions-qa check --file` linter on a file directly in
        `.github/workflows/`; `GitHub Workflow` is its language name for
        `options.timeouts`, `options.languages` and `options.command_overrides`.
        Default budget 15s; a timeout allows the edit with an advisory.
      example_yaml: |
        handlers:
          post_tool_use:
            lint_on_edit:
              options:
                timeouts:
                  "GitHub Workflow": 30
