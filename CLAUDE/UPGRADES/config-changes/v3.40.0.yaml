version: "3.40.0"
date: "2026-07-14"
breaking: false
config_changes:
  added:
    - key: handlers.user_prompt_submit.idle_housekeeping_advisory
      recommended: false
      description: >-
        NEW beta handler (opt-in, OFF by default). When enabled, it watches for
        repeated no-op failsafe-recovery ticks and, once the session is
        demonstrably idle-and-caught-up, injects HOUSEKEEPING MODE guidance:
        dispatch specialist housekeeping sub-agents that run read-only audits and
        write shareable markdown report files (default untracked/reports/). It is
        strictly REPORT-ONLY -- it never auto-fixes or auto-commits -- and yields
        instantly to real work. Options: noop_threshold (default 2),
        max_passes_per_session (default 1), reports_dir (default untracked/reports),
        custom_guidance_doc (path to a project-owned housekeeping doc, absolute or
        project-relative; empty = none) and custom_guidance_mode
        (additive [default] appends the project doc to the built-in guidance;
        replace uses only the project doc). A configured-but-unreadable doc fails
        safe to the default guidance.
      migration_note: >-
        Beta -- leave it OFF unless you want to try it. To enable, add
        handlers.user_prompt_submit.idle_housekeeping_advisory.enabled: true to
        your .claude/hooks-daemon.yaml and restart the daemon. See
        docs/guides/CREATING_REPORTS.md for the report format and sharing
        channels (agent-to-agent, Slack, GitHub issue).
    - key: plan_workflow.qa.journal
      recommended: true
      description: >-
        NEW first-class plan journalling (ON by default when plan_workflow is
        enabled). Every plan folder may carry a JOURNAL/ of append-only,
        per-day NNNNN-Journal-YY-MM-DD.md files -- a chronological activity log
        (findings, decisions, dead-ends, hand-off state) complementary to
        PLAN.md. The daemon supports it through the existing plan_qa surfaces
        (no new handler): edit-time day-file-naming + append-only lint,
        SessionStart presence/freshness nudges, and commit-gate progress/
        completion coupling -- ALL advise-only (only day-file-naming can ever
        ratchet to block). mkplan.bash now scaffolds JOURNAL/ plus a seeded
        day-1 file, and install/upgrade seeds a client-owned _JOURNAL_TEMPLATE_.md
        (the "this project journals" marker that gates that scaffolding) and a
        PlanJournalling.md reference. Options under plan_workflow.qa.journal:
        enabled (default true), mode (advise [default] | block | off; only
        day-file-naming honours block), dir_name (default JOURNAL),
        freshness_days (default 3), enforce_on_completion (default false), and
        grandfather_before (default 0).
      migration_note: >-
        No action needed to adopt -- once you upgrade, new plans are born with a
        JOURNAL/ and completed/legacy plans are never touched (the presence
        nudge is In-Progress-only). Your handful of ACTIVE in-progress plans
        will get an advise-only "add a JOURNAL/" nudge each session: opt one in
        by adding a JOURNAL/NNNNN-Journal-YY-MM-DD.md (recommended), or exclude
        the pre-journalling ones wholesale by setting
        plan_workflow.qa.journal.grandfather_before to one-past your current
        highest plan number (run: git config --local hooksdaemon.latestPlanNumber,
        add 1). See CLAUDE/PlanJournalling.md (seeded alongside your plan
        directory on upgrade) for the entry grammar and the
        POLICY-vs-CONVENTION split.
  renamed: []
  removed: []
  changed:
    - key: handlers.status_line.daemon_stats
      description: >-
        The daemon health status-line element (uptime, memory usage, last error,
        log level) now defaults to DISABLED. These are developer-facing
        diagnostics that are not useful to normal users, so daemon_stats is now an
        opt-in handler (get_default_enabled() -> False) and the install template
        ships it enabled: false. The daemon-UPGRADE notifier is a SEPARATE handler
        (version_check, SessionStart) and remains enabled by default -- upgrade
        notifications are unaffected. Existing configs are not rewritten on
        upgrade: a project whose .claude/hooks-daemon.yaml already has
        daemon_stats enabled: true keeps the health line; only fresh installs and
        configs that inherited the old default now get it off.
      migration_note: >-
        No action needed for most users. If you relied on the daemon health line
        via the old default and want to keep it, add
        handlers.status_line.daemon_stats.enabled: true to your
        .claude/hooks-daemon.yaml. To adopt the new default, remove your explicit
        daemon_stats enabled: true (or set it to false).
    - key: daemon.enable_hello_world_handlers
      description: >-
        The daemon.enable_hello_world_handlers flag now actually gates the
        hello_world test handlers. Previously the flag was defined (default
        false) and documented on every hello_world handler, but no loader code
        consumed it, so the 10 test handlers loaded in EVERY project regardless.
        They injected "✅ <event> hook system active" context on every hook
        event, and on Stop that extra context made Claude Code grant another
        turn -- doubling idle turns. With the flag wired (default false), the
        test handlers no longer load unless you opt in. Observable effect after
        upgrade: the "✅ ... hook system active" confirmation messages stop
        appearing (expected -- they were debug output leaking from a dead flag).
      migration_note: >-
        No action needed. The confirmation messages were never meant to be on by
        default. To restore them for hook-system debugging, set
        daemon.enable_hello_world_handlers: true in your
        .claude/hooks-daemon.yaml, then restart the daemon and run generate-docs.
