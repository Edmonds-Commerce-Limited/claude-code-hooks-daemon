# Drafted by Plan 00490. The VERSION in the filename and the `version:` key are
# a target, not a decision; the release agent confirms or renames this file.
version: "3.69.0"
date: "2026-10-08"

breaking: false

config_changes:
  added:
    - key: autonomy
      recommended: false
      dormant: true
      description: >-
        NEW (Plan 00498). A top-level `autonomy:` block names where the
        work-DRIVING machinery may run: declared `persistent_crons` and their
        Stop enforcers, the failsafe-recovery advice (session start and plan
        edits), goal injection, the goal-ledger stop challenge, the
        awaiting-human stand-in cron, the idle-housekeeping advisory, the
        routine sweep and the session-actions directive. `environments` lists
        any of `host` (a desktop session, no container detected), `docker`,
        `podman`, `lxc`, `generic`; `hosts` lists role aliases or globs
        (`HOOKS_DAEMON_HOSTNAME`) that may run autonomy anywhere. Default: every
        environment, so a project with no block behaves exactly as before.
        Guards are never gated, and the plain `STOPPING BECAUSE:` rule applies
        everywhere.
      example_yaml: |
        autonomy:
          environments: [docker, podman, lxc, generic]   # no autonomy on a desktop
          hosts: []
      migration_note: >-
        No action needed. To keep a desktop session to the task it was given,
        leave `host` out of `environments`; SessionStart then says once that
        autonomy is off and the status line shows it.
    - key: handlers.session_start.autonomy_notice
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00498). On by default and silent wherever the `autonomy:`
        block allows autonomy (every environment, unless the project says
        otherwise). Where it does not, it states once at session start that
        autonomy is off, in which environment, and which config to change.
      example_yaml: |
        handlers:
          session_start:
            autonomy_notice:
              enabled: true
              priority: 47
      migration_note: >-
        No action needed; it never fires for a project with no `autonomy:`
        block. Disable with handlers.session_start.autonomy_notice.enabled:
        false.
    - key: handlers.pre_tool_use.host_command_guard
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00483 Task 2.2). On by default. Denies
        `docker run -v /:/host` (a host-root mount, also `--volume`,
        `--mount type=bind,source=/` and `docker create`) and `gh auth token`
        (a token piped to or substituted into another command is allowed). Human
        only, with no agent-side escape hatch: `pip install --index-url`, `-i`
        or `--extra-index-url` naming a non-PyPI index (PyPI is
        https://pypi.org and https://files.pythonhosted.org only), and
        `crontab -r`. `destructive_git` gains the same human-only denial for
        `git push --delete` and `git push <remote> :<name>` (R-GIT-PUSH-DELETE-REMOTE)
        with no config change, except that a branch already merged into the
        default branch may be deleted. Only `enabled` and `priority` are options.
      example_yaml: |
        handlers:
          pre_tool_use:
            host_command_guard:
              enabled: true
              priority: 10
      migration_note: >-
        No action needed. A project that installs from a private PyPI mirror
        and wants agents to do so sets `enabled: false` (a human config edit),
        or asks the human to run those installs.
    - key: handlers.pre_tool_use.github_issue_assignment_guard
      recommended: false
      dormant: true
      description: >-
        NEW (Plan 00490). Work tied to a GitHub issue (a Write/Edit inside a
        plan whose PLAN.md header carries `**GitHub Issue**: #N`, or a
        `git commit` citing that issue and naming that plan) is denied unless
        the issue is assigned to the signed-in GitHub account and, when an
        author list is configured, opened by an approved author. An unassigned
        issue is claimed with `bin/hooks-daemon issue-validity N --claim`;
        work not tied to an issue is never judged. A lookup that fails only
        advises. Off by default.
      example_yaml: |
        handlers:
          pre_tool_use:
            github_issue_assignment_guard:
              enabled: true
              priority: 53
      migration_note: >-
        Opt in only if your plans record `**GitHub Issue**: #N` and your
        sessions are signed in to `gh`.
    - key: handlers.pre_tool_use.github_issue_assignment_guard.options.approved_issue_authors
      recommended: false
      dormant: true
      description: >-
        NEW (Plan 00490). The list of GitHub logins (case-insensitive) whose
        issues agents may pick up. The single home of the list: the
        `github_issue_assignment_guard` handler, `bin/hooks-daemon issue-validity`
        (including `--list-eligible`) and the issue-sdlc runbook all read it.
        Unset or empty, the author check does not apply, and `--list-eligible`
        refuses to list rather than treat every issue as eligible.
      example_yaml: |
        handlers:
          pre_tool_use:
            github_issue_assignment_guard:
              options:
                approved_issue_authors: [your-login]
    - key: handlers.pre_tool_use.github_issue_assignment_guard.options.auto_claim
      recommended: false
      dormant: true
      description: >-
        NEW (Plan 00490). Default `false`: the hook only judges, and the agent
        runs the claim command. `true` lets the hook claim an unassigned,
        otherwise valid issue itself, which publishes an assignment to GitHub
        from inside a hook.
      example_yaml: |
        handlers:
          pre_tool_use:
            github_issue_assignment_guard:
              options:
                auto_claim: false
    - key: handlers.session_start.work_queue_rebrief
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00470). On by default, advisory only. When a session starts
        from `resume` or `compact`, lists the dispatched agents the durable
        work queue (`work-queue.json`, written with `hooks-daemon work-queue`)
        still records as running, with the facts needed to respawn them.
        Silent when no queue exists or nothing is running.
      example_yaml: |
        handlers:
          session_start:
            work_queue_rebrief:
              enabled: true
              priority: 48
      migration_note: >-
        No action needed. Disable with
        handlers.session_start.work_queue_rebrief.enabled: false.
    - key: handlers.user_prompt_submit.limit_rebrief
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00470). On by default, never denies. One-shot re-brief at
        the first prompt after a usage-limit resume; names a background or
        teammate agent the limit killed and lists the work queue.
      example_yaml: |
        handlers:
          user_prompt_submit:
            limit_rebrief:
              enabled: true
              priority: 39
      migration_note: >-
        No action needed. Disable with
        handlers.user_prompt_submit.limit_rebrief.enabled: false.
    - key: handlers.notification.quota_resume_recorder
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00470). On by default, silent bookkeeping. Records a
        `quota_auto_resume_*` notification so `limit_rebrief` can deliver the
        re-brief at the next prompt.
      example_yaml: |
        handlers:
          notification:
            quota_resume_recorder:
              enabled: true
              priority: 50
      migration_note: >-
        No action needed. Disable with
        handlers.notification.quota_resume_recorder.enabled: false.
    - key: handlers.stop.auto_continue_stop.options.stand_in_delay_hours
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00470). How long, in hours, the one-off stand-in cron that
        an `[awaiting-human]` stop must schedule waits before it fires.
        Default 3; must be above 0 and below 24 (checked at config load). The
        stand-in applies only where `persistent_crons.enabled` is true.
      example_yaml: |
        handlers:
          stop:
            auto_continue_stop:
              options:
                stand_in_delay_hours: 3
      migration_note: >-
        No action needed; the default is 3.
    - key: daemon.exclude_paths
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00484). An entry of `exclude_paths` (project-wide
        `daemon.exclude_paths` and any handler's `options.exclude_paths`) or of
        `extra_whitelist` may be written as `{pattern, reason}` as well as a
        plain string. Handlers receive the same plain pattern either way. With
        `daemon.strict_mode: true`, a plain string is reported as a config
        problem at session start (the config still loads).
      example_yaml: |
        daemon:
          exclude_paths:
            - pattern: "vendor/**"
              reason: "third-party code we do not edit"
      migration_note: >-
        No action needed; plain strings keep working. Under strict_mode, see
        the post-upgrade task 01-give-strict-mode-exclusions-a-reason.
  changed:
    - key: handlers.pre_tool_use.root_recursion_guard.priority
      recommended: true
      dormant: false
      recommended_value: 13
      description: >-
        DEFAULT CHANGED (Plan 00483). `root_recursion_guard` now runs at
        priority 13, ahead of `secret_file_guard` (14), so a recursive search
        rooted at `/`, `~` or `$HOME` is denied on the command text alone
        rather than walked first. A fresh install from the 3.69.0 example gets
        13. The upgrade moves a config that still carries the earlier
        example's 16 to 13, because it merges your customisations onto the new
        example. A config that set any other priority keeps it.
      example_yaml: |
        handlers:
          pre_tool_use:
            root_recursion_guard:
              priority: 13
      migration_note: >-
        Set handlers.pre_tool_use.root_recursion_guard.priority to 13 (any
        value below 14) to get the new order. A config still carrying 16 is
        moved to 13 by the upgrade; a config that set any other priority keeps
        it until you change it.
    - key: handlers.pre_tool_use.bash_safe_mode.options.only_with_mutator
      recommended: true
      dormant: false
      description: >-
        DEFAULT CHANGED (Plan 00483). `only_with_mutator` now
        defaults to `true`, reversing the block-everything default that
        3.68.0 shipped. A `;`- or newline-sequenced Bash command with no `set`
        safety prelude is denied only when it contains a mutator (`git add`,
        `git commit`, `git push`, `git tag`, ...); a read-only chain such as
        `grep x a; grep y b` is allowed. The handler stays enabled and in
        `mode: block`.
      example_yaml: |
        handlers:
          pre_tool_use:
            bash_safe_mode:
              options:
                only_with_mutator: true
      migration_note: >-
        No action needed to adopt the new default. A project that wants the
        strict scope (every sequenced command needs a prelude or `&&`
        chaining) sets `only_with_mutator: false`; a project config that
        pinned `only_with_mutator: false` keeps that behaviour.
