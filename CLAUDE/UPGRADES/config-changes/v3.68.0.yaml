# Drafted by Plan 00376. The VERSION in the filename and the `version:` key are
# a target, not a decision; the release agent confirms or renames this file.
version: "3.68.0"
date: "2026-10-03"

breaking: false

config_changes:
  added:
    - key: handlers.user_prompt_submit.usage_pause_gate
      recommended: true
      dormant: true
      description: >-
        NEW (Plan 00479). Pauses a session at its host usage ceiling. When
        `hosts:` gives the host a `usage_ceiling` and a live usage window
        reaches it, the pause is recorded and the model is told to replace
        every cron with ONE recurring resume cron on `*/10 * * * *` (it names
        no clock time; a tick before the resume time is dropped), then
        stop. While paused every later prompt (cron tick, supervisor message,
        human) is dropped before it reaches the model. The resume cron's
        prompt starts `[tick:usage-resume]`; when it fires, usage is re-read:
        below the ceiling the declared crons are re-established and work
        continues, still over it the pause is renewed and the same resume cron
        stays in place. No
        ceiling, no usage data or an unknown host never pauses a session.
        `hooks-daemon usage-pause clear` (run in a terminal) removes a pause
        and records an override until the latest reset among the windows over
        the ceiling (at most 8 days), during which no pause is started for
        that session.
      example_yaml: |
        handlers:
          user_prompt_submit:
            usage_pause_gate:
              enabled: true
              priority: 9
      migration_note: >-
        On by default and inert until a `hosts:` entry sets a `usage_ceiling`.
        Add the entry to a project config that lists its UserPromptSubmit
        handlers explicitly.
    - key: handlers.pre_tool_use.usage_pause_tool_gate
      recommended: true
      dormant: true
      description: >-
        NEW (Plan 00479). While a session is usage-paused, only CronList,
        CronDelete, CronCreate, ToolSearch (which loads the deferred cron
        tools), SendMessage and TaskStop are allowed; any other tool is denied
        with `continue: false` and a `stopReason`, so a turn already running
        halts at its next tool call. A session over its ceiling that has not
        yet been paused is paused by its next main-thread tool call, which is
        refused without a halt and carries the full directive; a subagent over
        the ceiling starts the pause too, but a subagent's own calls are never
        denied.
        Inert unless a pause is recorded or a ceiling is reached.
      example_yaml: |
        handlers:
          pre_tool_use:
            usage_pause_tool_gate:
              enabled: true
              priority: 9
      migration_note: >-
        On by default and inert until a usage pause is recorded. Add the entry
        to a project config that lists its PreToolUse handlers explicitly.
    - key: handlers.stop.usage_pause_stop_gate
      recommended: true
      dormant: true
      description: >-
        NEW (Plan 00479). A usage-paused session may stop only once its
        `session_crons` holds exactly the one usage-resume cron; otherwise the
        pause directive is repeated. While paused, `auto_continue_stop`,
        `cron_stop_enforcer`, `cron_subagent_stop_enforcer`,
        `persistent_cron_assertor`, `failsafe_cron_session_advisor` and
        `recovery_cron_advisor` stand down, so nothing forces the session on
        or re-arms a cron.
      example_yaml: |
        handlers:
          stop:
            usage_pause_stop_gate:
              enabled: true
              priority: 6
      migration_note: >-
        On by default and inert until a usage pause is recorded. Add the entry
        to a project config that lists its Stop handlers explicitly.
    - key: handlers.status_line.usage_indicator
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00479). A status-line segment showing subscription usage,
        for example `📈 5h10%|7d5%`, read from the `rate_limits` Claude Code sends
        on every status render. Each window is a chip whose background is
        coloured by its own percentage (green, yellow from `warn_pct`, orange
        from `high_pct`, red from `critical_pct`). A window below `warn_pct`
        is its label and percentage run together; from `warn_pct` it is
        spaced out and adds its reset countdown, e.g. `5h 67% 3h 20m`. Hidden when there is no usage data.
      example_yaml: |
        handlers:
          status_line:
            usage_indicator:
              enabled: true
              priority: 16
              options:
                warn_pct: 60
                high_pct: 80
                critical_pct: 90
      migration_note: >-
        On by default; no project-side action needed. Add the entry to a
        project config that lists its status-line handlers explicitly, or
        disable with handlers.status_line.usage_indicator.enabled: false.
    - key: handlers.status_line.prompt_cache_indicator.options
      recommended: false
      dormant: false
      description: >-
        NEW options (Plan 00452) for the prompt-cache status-line segment,
        which is redesigned as compact background-coloured chips:
        `⚡ main|⑂|Σ` (main thread, sub-agents, whole session; the last two
        only once a sub-agent has run). Each chip is coloured by its hit
        ratio: green at or above `healthy_pct` (default 90), yellow from
        `warn_pct` (75), orange from `critical_pct` (50), red below it. A
        high ratio is good, so the direction is the opposite of
        `usage_indicator`'s thresholds. A green chip is its label alone; any
        other adds its figures, e.g. `main 82% 1h`. The main chip is also
        raised by state: COLD is a red `❄ 509k`, EXPIRING is at least yellow
        with `⏳4m`, a recent miss is at least yellow with `↻ <cause>`.
      example_yaml: |
        handlers:
          status_line:
            prompt_cache_indicator:
              enabled: true
              priority: 15
              options:
                healthy_pct: 90
                warn_pct: 75
                critical_pct: 50
      migration_note: >-
        Optional; the defaults apply when the options are absent. The old
        `⚡ 99% 1h ⚠EXPIRING 4m sub 87% 5m total 97%` text rendering is
        replaced, so a script matching it needs updating.
    - key: daemon.expected_version
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00477). The daemon version this project expects, strictly
        X.Y.Z. `install` and `upgrade` write it after the deploy, so the
        tracked config names the version a fresh checkout is provisioned at:
        `bash .claude/provision.sh` fetches exactly this tag, never `main`.
        Distinct from the top-level `version`, which is the config SCHEMA
        version. A project that predates the key falls back to the
        `.claude/HOOKS-DAEMON.md` header.
      example_yaml: |
        daemon:
          expected_version: "3.68.0"
      migration_note: >-
        Nothing to do: the next upgrade records it. Commit the changed
        `.claude/hooks-daemon.yaml` and the new `.claude/provision.sh`.
    - key: daemon.unprovisioned_mode
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00477). What the hooks do in a fresh clone that has the
        tracked assets but no daemon: `warn` (the default) says so loudly to
        the human (`systemMessage`) and the agent (`additionalContext`) at
        SessionStart and on every prompt, and on the status line, and blocks
        nothing; `block` also denies every tool call except the provision
        command itself (`bash .claude/provision.sh`) and the hooks-daemon
        provision skill call. Read by `init.sh` in bash, since no daemon
        exists yet to read it. A project with `ci_enabled: true` keeps its own
        blocking behaviour whatever this says.
      example_yaml: |
        daemon:
          unprovisioned_mode: block
      migration_note: >-
        Nothing to do: the default is `warn`. Set `block` if a fresh checkout
        must not do any work before it is provisioned.
    - key: handlers.pre_tool_use.upgrade_approval_guard
      description: >-
        Denies an agent action that grants or bypasses the project owner's
        one-shot upgrade approval (Plan 00376, review finding MAJOR 4). The
        pre-deploy upgrade gate's escalation path is the owner's step --
        `hooks-daemon approve-upgrade <version> --from <previous>` needs an
        interactive TTY and a typed confirmation phrase, run in the owner's
        own terminal. Denied: running `approve-upgrade` (or the standalone
        gate's own `approve` subcommand) itself; writing or touching the
        `<version>.approved` marker under an `upgrade-approvals/` directory by
        any Bash route or with Write/Edit/NotebookEdit; assigning, exporting
        or env-setting HOOKS_DAEMON_UPGRADE_HANDOFF, which impersonates the
        upgrade's Layer 1; on a command that runs the upgrade, setting a
        variable that picks its interpreter, venv, tools, flags, pass state,
        git view or code (HOOKS_DAEMON_PYTHON, HOOKS_DAEMON_VENV_PATH, PATH,
        HOSTNAME, HOME, TMPDIR, HOOKS_DAEMON_CLONE_URL,
        HOOKS_DAEMON_UPGRADE_BASE_URL, HOOKS_DAEMON_UPGRADE_PREVIOUS_VERSION,
        HOOKS_DAEMON_UPGRADE_SECOND_PASS, UPGRADE_FLAGS, GIT_*, BASH_ENV, ENV,
        BASH_FUNC_*, SHELLOPTS, BASHOPTS, LD_*, DYLD_*, PYTHON*,
        HOOKS_DAEMON_OLD_DEFAULT_*, PIPX_BIN_DIR, the uv index/find-links/config/python
        variables, CA bundles and proxies) by any spelling (NAME=, read or
        printf -v into it, an indirect name, an x-flagged declare/typeset/local,
        a computed export; and set -a, eval or sourcing another file),
        exporting a shell function, or passing --uv <path> -- the upgrade
        recognised by name when it is the program run or the script a shell,
        an interpreter or source/. runs (past wrappers such as env, nice,
        timeout, sudo, flock), by Layer 1's
        --skip-reading-confirmation, by a script carrying
        HOOKS_DAEMON_UPGRADE_HANDOFF, or by an unreadable script (`bash
        "$tmp"`, stdin) run with --project-root or the daemon clone as an
        argument; forging a venv's `.daemon-version` stamp; moving the
        `.claude/hooks-daemon` clone to another ref by hand (checkout, switch,
        pull, merge, rebase, reset, cherry-pick, am, revert) or writing into
        its .git/. Never denied: reading (ls/cat/stat/grep/find -print/test -f),
        merely reading the env var, fetching, showing or logging the daemon
        clone, a command that only names an upgrade script as data (`git log
        -- scripts/upgrade.sh`, `shellcheck scripts/upgrade.sh`, `bash -n`), a
        git commit message, non-executing
        echo/printf prose, a grep search, or a quoted-delimiter heredoc body
        written to a file.
      example_yaml: |
        handlers:
          pre_tool_use:
            upgrade_approval_guard:
              enabled: true
              priority: 20
      migration_note: >-
        On by default; no project-side action needed. If this handler ever
        blocks a call, report the gate's reasons to the user and stop -- the
        owner runs `hooks-daemon approve-upgrade <version> --from <previous>`
        themselves. Disable with
        handlers.pre_tool_use.upgrade_approval_guard.enabled: false.
      recommended: true
      dormant: false
    - key: handlers.pre_tool_use.subagent_worktree_write_guard
      description: >-
        Denies a subagent's Write, Edit or NotebookEdit whose target is in a
        different checkout of the repository than the linked git worktree the
        subagent works in: a sibling worktree, or the main working tree
        (ledger 00474 N264, where a sub-agent's edits landed uncommitted in
        another branch's worktree). Scoped to subagents, so the coordinator is
        never judged; a subagent whose cwd is the main working tree, a write
        outside the repository and a write in another repository are not
        judged either. Worktree membership is read from git's own `.git`
        markers with no subprocess, and anything unreadable allows.
      example_yaml: |
        handlers:
          pre_tool_use:
            subagent_worktree_write_guard:
              enabled: true
              priority: 14
      migration_note: >-
        On by default; no project-side action needed. A subagent that needs a
        change on another branch reports it to the coordinator. Disable with
        handlers.pre_tool_use.subagent_worktree_write_guard.enabled: false.
      recommended: true
      dormant: false
    - key: handlers.session_start.branch_count_advisor
      description: >-
        At the start of a new session, counts the local `worktree-*` branches
        (the work branches CLAUDE/Worktree.md limits to 3 at once) and names
        them when there are more than `max_open_branches`. Also names any work
        branch more than `behind_main_threshold` commits behind the default
        branch. Advisory only; silent when within both limits, outside a git
        repository, or when git fails.
      example_yaml: |
        handlers:
          session_start:
            branch_count_advisor:
              enabled: true
              priority: 56
              options:
                max_open_branches: 3
                behind_main_threshold: 50
      migration_note: >-
        On by default and silent unless a repository has more than
        `max_open_branches` `worktree-*` branches or one far behind main. Raise
        the options to quieten it; disable with
        handlers.session_start.branch_count_advisor.enabled: false.
      recommended: true
      dormant: false
    - key: handlers.pre_tool_use.merge_qa_advisor
      description: >-
        Advises, before a Bash `git merge` of a work branch (`worktree-*`,
        local or `origin/worktree-*`) whose head has no recorded green
        `llm_qa.py changed` run (Plan 00475 Task 4.2, ledger 00474 N278). The
        advisory names the head and the static checks CLAUDE/QA.md lists for the
        coordinator's check. `llm_qa.py changed` records the commit a passing
        run of the whole selection judged, on a clean tree, in
        `refs/integration/changed-green/<branch>`, a ref every worktree shares.
        Advisory only; silent when the record names the head, for any other
        branch, for `--abort`, `--continue` and `--quit`, and whenever git
        cannot answer.
      example_yaml: |
        handlers:
          pre_tool_use:
            merge_qa_advisor:
              enabled: true
              priority: 59
      migration_note: >-
        On by default; no project-side action needed. Silent in a project that
        does not ship `scripts/qa/llm_qa.py`, because the advice names that
        script and such a project could never satisfy it. Disable with
        handlers.pre_tool_use.merge_qa_advisor.enabled: false.
      recommended: true
      dormant: false
    - key: handlers.pre_tool_use.conflict_marker_commit_gate
      description: >-
        NEW (Plan 00466 N211). Denies a `git commit` whose ADDED lines carry a
        merge-conflict marker in either spelling. It reads what the commit
        would record: the index, the working tree for `git commit -a`, or the
        named paths for a pathspec commit. A marker already in history, or one
        being removed, is never denied. A file that legitimately holds marker
        text (a fixture, documentation of the markers) is exempted with
        `options.exclude_paths` or the project-wide `daemon.exclude_paths`.
      example_yaml: |
        handlers:
          pre_tool_use:
            conflict_marker_commit_gate:
              enabled: true
              priority: 42
              options:
                exclude_paths: []
      migration_note: >-
        On by default; no project-side action needed. Add the entry to a
        project config that lists its PreToolUse handlers explicitly. Disable
        with handlers.pre_tool_use.conflict_marker_commit_gate.enabled: false.
      recommended: true
      dormant: false
    - key: handlers.stop_failure.stop_failure_recorder
      description: >-
        NEW (Plan 00470 Task 3.1). A silent StopFailure recorder: a turn that
        ends on a `rate_limit`, `authentication_failed` or
        `cloud_credential_error` API error is written down (the error type
        only, never the API's own text) and shown as a status-line chip by
        `usage_indicator`. Never speaks and fails open.
      example_yaml: |
        handlers:
          stop_failure:
            stop_failure_recorder:
              enabled: true
              priority: 50
      migration_note: >-
        On by default; no project-side action needed. Add the entry to a
        project config that lists its StopFailure handlers explicitly.
      recommended: true
      dormant: false
    - key: handlers.user_prompt_submit.stop_failure_resolver
      description: >-
        NEW (Plan 00470 Task 3.1). The next prompt a session submits (a human,
        a cron tick or a resume) clears that session's unresolved StopFailure
        record, so the status-line chip goes away once the session moves on.
        Silent and fails open; an ordinary prompt costs one small file read.
      example_yaml: |
        handlers:
          user_prompt_submit:
            stop_failure_resolver:
              enabled: true
              priority: 38
      migration_note: >-
        On by default; no project-side action needed. Add the entry to a
        project config that lists its UserPromptSubmit handlers explicitly.
      recommended: true
      dormant: false
    - key: handlers.pre_tool_use.ask_user_question_blocker.options.human_presence_minutes
      description: >-
        NEW option (default 30; absent in v3.67.0). A genuine human prompt
        received in this session within this many minutes proves a human is
        present, so the session counts as attended for that window and a
        question is judged by the strict-mode rules (the `ASKING BECAUSE:`
        prefix). Cron ticks, supervisor lines and task notifications are not
        human prompts. 0 disables the window.
      example_yaml: |
        handlers:
          pre_tool_use:
            ask_user_question_blocker:
              options:
                human_presence_minutes: 30
      migration_note: >-
        Optional. The default applies when the option is absent.
      recommended: false
      dormant: false
    - key: handlers.post_tool_use.plan_fact_check_feed
      description: >-
        NEW, opt-in (Plan 00480 Task 4.1). Watches writes to a plan's tracked
        documents and, once the plan has been quiet for `quiet_seconds`
        (default 5), stores the diff since its last fact-checked content as a
        pending fact-check record. Nothing is delivered yet. Never blocks and
        never speaks. Off unless a block names it.
      example_yaml: |
        handlers:
          post_tool_use:
            plan_fact_check_feed:
              enabled: true
              options:
                quiet_seconds: 5
      migration_note: >-
        Optional and inert until a later release delivers the check. Add the
        block only to try it.
      recommended: false
      dormant: true
    - key: persistent_crons.jobs[].runs_while_awaiting_human
      recommended: false
      dormant: true
      description: >-
        NEW per-job boolean (Plan 00470 Task 5.1, default false). A stop that
        declares `[awaiting-human]` normally drops every declared job's tick
        (R-DECLARED-CRON-SUPPRESSED) as well as the failsafe's. A job that sets
        this to true is delivered while the marker is live, because its work
        does not depend on the pending question. The failsafe and every job
        without the option are still dropped, so a project that adds nothing
        sees no change.
      example_yaml: |
        persistent_crons:
          enabled: true
          jobs:
            - id: issue-sdlc
              schedule: "23 * * * *"
              runs_while_awaiting_human: true
              prompt: |
                Invoke the `issue-sdlc` skill and follow it exactly.
      migration_note: >-
        Optional. Set `runs_while_awaiting_human: true` on a declared job whose
        work is independent of a human answer; leave it off for anything that
        resumes interrupted work.
    - key: persistent_crons.jobs[].hosts
      recommended: false
      dormant: true
      description: >-
        NEW per-job list of strings (Plan 00470 Task 6.1, default unset). A job
        without it is global, as before. A job with it is declared only where
        the session's effective hostname matches an entry (exact name or
        fnmatch glob: `*`, `?`, `[...]`): the first non-empty of the
        HOOKS_DAEMON_HOSTNAME and CCY_HOST_HOSTNAME environment variables, then
        the system hostname. Everywhere else the job is neither listed at
        session start nor demanded at Stop. An empty list is a config error.
      example_yaml: |
        persistent_crons:
          enabled: true
          jobs:
            - id: issue-sdlc
              schedule: "23 * * * *"
              hosts: [cchd-sdlc-runner]
              prompt: |
                Invoke the `issue-sdlc` skill and follow it exactly.
      migration_note: >-
        Optional. Add `hosts:` to a job that only one machine or role should
        run, then export HOOKS_DAEMON_HOSTNAME=<name> before launching the
        session that should take the role. Leave it off for a job every
        session needs.
    - key: hosts
      recommended: false
      dormant: true
      description: >-
        NEW optional top-level mapping (Plan 00479, default empty). Each key is
        a label; an optional `pattern` is a case-sensitive fnmatch glob matched
        against the session's effective hostname (HOOKS_DAEMON_HOSTNAME, then
        CCY_HOST_HOSTNAME, then the system hostname), and without one the label
        is the exact hostname. The first per-host setting is `usage_ceiling`:
        `max_used_percent` (greater than 0, at most 100) applies to both the
        5-hour and 7-day windows, with optional `five_hour` and `seven_day`
        overrides. When several entries match, the lowest limit wins per
        window. Unknown keys and out-of-range percentages are config errors.
      example_yaml: |
        hosts:
          sdlc-runner:
            pattern: "cchd-sdlc-*"
            usage_ceiling:
              max_used_percent: 80
              five_hour: 85
              seven_day: 70
      migration_note: >-
        Optional and inert on its own. Declaring a usage_ceiling makes the
        usage-pause handlers pause a session on that host when a window
        reaches it.
    - key: handlers.pre_tool_use.bash_safe_mode
      recommended: true
      dormant: false
      description: >-
        DEFAULT CHANGED (owner ruling). `bash_safe_mode` now ships
        `enabled: true` and defaults to `mode: block` (it shipped
        `enabled: false` and warned first). A Bash command with two or more
        `;`- or newline-sequenced statements and no `set` safety prelude
        (errexit and pipefail by default) is now DENIED. A command that
        begins `set -euo pipefail` (or declares `set -e` and `set -o
        pipefail`), a single statement and a pure `&&` chain are never
        flagged. `only_with_mutator` stays false and `require` stays
        `[errexit, pipefail]`.
      example_yaml: |
        handlers:
          pre_tool_use:
            bash_safe_mode:
              enabled: true
              priority: 36
              options:
                mode: block
      migration_note: >-
        On by default. Two remedies for a denied command: put `set -euo
        pipefail` at the top, or chain the statements with `&&` only. A
        command that must run every statement regardless of failures (a
        diagnostic sweep, an exit-code observer) declares
        `MUST_SKIP_SAFE_MODE_BECAUSE="reason"; <command>`. To opt out, set
        handlers.pre_tool_use.bash_safe_mode.enabled: false, or keep the
        handler advisory with options.mode: warn. Gotcha: under `pipefail`
        a `producer | head` exits 141 (SIGPIPE) and `set -e` then aborts the
        command, so do not append `|| true`; read the file directly with
        `head -n N <file>` or capture with `bin/echd-capture N` instead.
    - key: handlers.post_tool_use.cron_record_keeper
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00470 Task 2.1). A silent PostToolUse recorder: every
        `CronCreate` is written to `cron-records.json` in the daemon's untracked
        directory (session id, cron id, schedule, a hash of the prompt, creation
        time; never the prompt text) and every `CronDelete` is forgotten.
        Recurring crons expire 7 days after creation and the Stop payload carries
        no creation time, so this is what lets `cron_stop_enforcer` know a job's
        age. Records older than 7 days, and a session's records its own
        `session_crons` no longer lists, are pruned. Never blocks, never speaks,
        and fails open.
      example_yaml: |
        handlers:
          post_tool_use:
            cron_record_keeper:
              enabled: true
              priority: 36
      migration_note: >-
        On by default; no project-side action needed. Add the entry to a project
        config that lists its PostToolUse handlers explicitly. Without it
        `cron_stop_enforcer` stamps every live job as first seen at its next Stop
        instead of at creation, so a refresh comes up to `refresh_after_days`
        late.
    - key: handlers.stop.cron_stop_enforcer.options.refresh_after_days
      recommended: false
      dormant: true
      description: >-
        NEW option (Plan 00470 Task 2.2, default 6; also read by
        `cron_subagent_stop_enforcer`). A live declared job older than this many
        days is denied a stop until it is refreshed: the reason names the
        `CronDelete <id>` and the `CronCreate` (schedule and prompt) to run, ahead
        of the 7-day expiry that would silently end every tick. A job with no
        record is stamped, never denied; a job paused with `hooks-daemon
        cron-pause` is not refreshed; a usage-paused session is not judged. A
        value that is not above 0 and below 7 is replaced by the default with a
        warning.
      example_yaml: |
        handlers:
          stop:
            cron_stop_enforcer:
              enabled: true
              priority: 7
              options:
                refresh_after_days: 6
      migration_note: >-
        Optional. The default applies when the option is absent. Lower it to
        refresh sooner; it cannot be raised to 7 or more.
  changed:
    - key: daemon.transport.timeout_seconds
      description: >-
        Now at most 45. hooks-relay waits this long for the daemon, then may
        spend up to 10s handing a failed PreToolUse call to the bash
        forwarder, and Claude Code cancels the hook at the 60s timeout the
        daemon registers. A larger value is lowered to 45 with a warning
        rather than refused.
      example_yaml: |
        daemon:
          transport:
            timeout_seconds: 45
      migration_note: >-
        Set daemon.transport.timeout_seconds to 45 or less in
        .claude/hooks-daemon.yaml. Until you do, the daemon uses 45 and warns
        at every start.
      recommended: true
      dormant: false
      maximum: 45
    # Plan 00483 N55 (owner-delegated ruling): an opt-in handler with NO block
    # under `handlers.<event>` no longer runs. Documentation-only entries (no
    # `recommended_value`): promoting every one would tell every project to
    # enable every one of the seventeen. A project that relied on the old behaviour names the
    # handler; naming it, even as a bare key, enables it.
    - key: handlers.pre_tool_use.lsp_enforcement
      description: &opt_in_description >-
        Opt-in handlers are no longer registered when their block is absent
        (Plan 00483 N55). A handler is opt-in when the class declares
        `default_enabled = False`; a block that is present, even a bare
        `key:`, enables it unless it says `enabled: false`. `init full`
        configs already carry `enabled: false` for each, so are unaffected.
      example_yaml: |
        handlers:
          pre_tool_use:
            lsp_enforcement:
              enabled: true
      migration_note: &opt_in_note >-
        Only a config that omits the handler AND relied on it running is
        affected: add the handler's block (`enabled: true`) to keep it.
