# Drafted by Plan 00533. The VERSION in the filename and the `version:` key are
# a target, not a decision; the release agent confirms or renames this file.
version: "3.71.0"
date: "2026-10-23"

breaking: false

config_changes:
  added:
    - key: daemon.chain.max_inflight
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00533, GitHub #124). How many handler chains the daemon runs
        at once, across every session it serves. Default 16, the value that
        was previously fixed. A chain beyond it waits
        `daemon.chain.slot_wait_seconds` for a slot, then is refused as
        "dispatch pool saturated", which denies a PreToolUse call holding a
        SAFETY+BLOCKING handler.
      example_yaml: |
        daemon:
          chain:
            max_inflight: 32
      migration_note: >-
        Raise it only on a host where many concurrent sessions share one
        daemon and the log shows "Dispatch pool saturated for Ns".
    - key: daemon.chain.slot_wait_seconds
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00533, GitHub #124). Seconds a chain that finds every slot
        taken waits for one before it is refused. Default 2, spent from the
        chain's own deadline. 0 refuses at once, the previous behaviour.
      example_yaml: |
        daemon:
          chain:
            slot_wait_seconds: 2.0
      migration_note: >-
        No action needed; the default applies.
    - key: handlers.session_start.relay_binary_checker
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00529, Plan 00474 N523, GitHub #131). At session start, when
        `daemon.transport.relay_enabled` is true but the relay binary is missing
        or not executable, prints one WARNING naming the binary path, saying
        relay-eligible hooks run on the fallback transport, and giving the fix
        `bin/hooks-daemon transport on`. Advisory only: it never builds the
        binary. Silent when the relay is disabled or the binary is executable.
      example_yaml: |
        handlers:
          session_start:
            relay_binary_checker:
              enabled: true
              priority: 72
      migration_note: >-
        On by default. When it fires, run `bin/hooks-daemon transport on` to
        provision the binary; set `enabled: false` to silence it.
    - key: daemon.transport.relay_source
      recommended: true
      dormant: false
      description: >-
        NEW VALUE `auto` (Plan 00529, GitHub #131). Builds the relay with
        `rustc` and the musl target when both are present, otherwise downloads
        the digest-verified release asset. Install and upgrade use it to put
        the binary in place when `relay_enabled` is true, and repeat a loud
        banner naming the fix when neither route works.
      example_yaml: |
        daemon:
          transport:
            relay_enabled: true
            relay_source: auto
      migration_note: >-
        New configs generated by `init-config` and the shipped example carry
        this value. Existing explicit values (`build`, `download`) are kept.
  changed:
    - key: daemon.transport.relay_enabled
      recommended: true
      recommended_value: true
      description: >-
        The example config and `init-config` now enable the relay
        (`relay_enabled: true`, `relay_source: auto`). The model default in
        code is unchanged (off). A config with no `transport` block picks the
        relay up at its next upgrade through the example merge (coordinator
        ruling, overturnable by the owner). An explicit `relay_enabled: false`
        is kept. A partial `transport` block, for example only `nc_enabled`,
        is kept whole, so the relay stays off unless the block names
        `relay_enabled`.
      migration_note: >-
        To opt out set `daemon.transport.relay_enabled: false`. To opt in on
        an existing partial block, add `relay_enabled: true` and
        `relay_source: auto`, then run `bin/hooks-daemon transport on`.
