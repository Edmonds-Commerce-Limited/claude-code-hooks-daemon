version: "3.63.0"
date: "2026-09-09"
breaking: false
config_changes:
  added:
    - key: handlers.pre_tool_use.tdd_enforcement.options.test_path_map[].mirror
      recommended: false
      dormant: true
      description: >-
        NEW optional boolean on each `test_path_map` entry (Plan 00362,
        default false). When true the source's directory path after the
        glob's literal root (`src` for `src/**`) is reproduced under
        `test_dir`, so `src/A/Foo.php` is expected at
        `<test_dir>/A/FooTest.php` instead of flat in `test_dir`. Every
        declared root is searched and listed in a deny. An entry without
        the key keeps the flat contract byte-for-byte.
      migration_note: >-
        No action needed. A project that disabled `tdd_enforcement` because
        its tests live in a nested mirror layout (`tests/Small/<mirror>`,
        `tests/Large/<mirror>`) can re-enable it and declare one mirror entry
        per root -- or list the same directories in `layout.test_dirs`, which
        now doubles as a mirror-root declaration for sources under `src/`.
    - key: daemon.chain.collect_all_violations
      recommended: false
      dormant: true
      description: >-
        NEW boolean (Plan 00242, default false). When true the handler chain
        keeps running after a deny, collects every deny and every advisory
        for the tool call, and returns ONE merged response: the first
        (highest-priority) deny leads and owns the `To disable:` footer, the
        other denies follow as bounded excerpts naming their handler, and the
        advisories are summarised in one table. Off, a terminal deny ends the
        chain as before. Independent of this flag, an ALLOW never ends the
        chain any more (the release-notes callout "an ALLOW never ends the
        chain"), so a terminal handler's advisory ALLOW cannot disable the
        handlers behind it.
      example_yaml: |
        daemon:
          chain:
            collect_all_violations: true
      migration_note: >-
        No action needed. Enable it if you would rather see all of a tool
        call's violations at once than one per retry; the blocked path then
        runs every matching handler (measured in the plan's MEASUREMENTS.md).
    - key: handlers.pre_tool_use.self_matching_process_probe
      recommended: true
      dormant: false
      description: >-
        NEW PreToolUse blocking handler (Plan 00363), ships enabled at
        priority 17. Denies a liveness probe whose LITERAL pattern matches
        the argv of the shell running it: `pgrep -f`, `pgrep -af`,
        `pkill -f`, and `ps … | grep` with no self-exclusion. The Bash tool
        runs every command through `bash -c "<command>"`, so the pattern
        being searched for is always on the searching shell's own command
        line -- the probe finds itself and reports "still running" for ever.
        A field report records a waiter that idled a whole night on exactly
        that shape while the job it waited for had finished hours earlier,
        and two hand-run checks with the same pattern each confirmed the
        wrong answer. Denied WHEREVER it appears, not only inside a loop:
        an advisory in a background waiter is read by nobody. The block
        message names the literal, explains the argv self-match, and gives
        the concrete bracket-trick rewrite for the pattern actually typed
        alongside every other remedy -- wait on an artefact
        (`until grep -q "PLAY RECAP" run.log; do sleep 10; done`), the
        harness's own run_in_background completion notification,
        `pgrep -x <name>`, a captured pid via `kill -0` / `ps -o pid= -p`,
        and `| grep -v grep`. Two ADVISORY rules ship with it and never
        block: `R-UNBOUNDED-LIVENESS-LOOP` for a `while`/`until` wait on a
        process with a sleep-only body and no cap (the Bash tool caps a
        foreground call at ten minutes; `run_in_background` has no cap at
        all), and `R-PGREP-UNRESOLVED-PATTERN` for a pattern built by
        expansion, which the daemon cannot read and so must never deny on.
        Detection applies the tools' own semantics rather than a pattern
        list: `pgrep -f` matches an extended regular expression against a
        command line, so the handler asks exactly that question. That one
        test explains every remedy without enumerating it -- `[p]rovision`
        no longer matches its own spelling, `run_0[3-9]` never did, and
        `pgrep -x` compares the whole line instead of searching within it.
      migration_note: >-
        On by default; no action needed to adopt. Denied commands have a
        mechanical fix the block message spells out for your exact pattern.
        There is deliberately NO agent-side MUST_..._BECAUSE escape hatch:
        a typed justification would not make the probe stop matching itself,
        and the failure mode is silent -- it looks exactly like patience. A
        project that genuinely cannot adopt it sets
        handlers.pre_tool_use.self_matching_process_probe.enabled to false.
        Note the guard judges the pattern, not the intent: `pkill -f` on a
        literal is refused even when killing really is what you meant, so
        reach for a captured pid there.
  renamed:
    - old_key: handlers.stop.hedging_language_detector
      new_key: pseudo_events.nitpick.handlers.hedging_language
      migration_note: >-
        Plan 00362 §2: a config carrying the old key silently ran neither
        detector, and `config-validate` called it valid. `upgrade.sh` /
        `upgrade_version.sh` now move the key (and its `enabled`/`priority`)
        for you; `hooks-daemon audit-handler-keys` finds a config that still
        carries the old key by hand.
    - old_key: handlers.stop.dismissive_language_detector
      new_key: pseudo_events.nitpick.handlers.dismissive_language
      migration_note: >-
        Plan 00362 §2: same silent-loss failure and the same automatic
        migration as `hedging_language_detector` above.
