# NOTE: filename must match the actual released version (see the sibling
# config-changes manifest).
version: "3.50.0"
truth_changes:
  - was: >
      A plan document may grow to whatever size the work requires; only its
      content is linted, never its length.
    now: >
      PLAN.md has enforced size tiers (v3.50.0): advisory above 18,000 bytes or
      350 lines, escalated warning above 25,000/500, and edits BLOCKED above
      35,000/900. Only an edit that GROWS the file can be blocked — shrinking is
      silent and a same-size edit such as ticking a checkbox only advises, so an
      oversized plan can always be updated and refactored down. The limits exist
      because a plan is re-read in full every session, so every kilobyte is a
      recurring context cost. Journals and the plan-index README.md are exempt
      at any size. Configure under plan_workflow.qa.plan_doc_size.

  - was: >
      When a plan gets too long, trim it — remove the older or less relevant
      sections so it stays readable.
    now: >
      Deletion is NOT a remedy (v3.50.0). Every size message names exactly two:
      RELOCATE the narrative into the plan's JOURNAL/ day-file, which is
      append-only and unbounded by design, or SPLIT the plan if the task tree
      itself is the bulk — an over-scoped plan is not fixed by better
      journalling. A commit that shrinks a PLAN.md by 2,000+ bytes without
      staging a journal entry is flagged by the new plan-shrink-without-journal
      check, because that shape usually means content was destroyed rather than
      moved.

  - was: >
      A project's plan docs may show PLAN.md carrying a dated progress log
      (a "## Notes & Updates" section), an "**Estimated Effort**" header, or a
      "## Timeline" with target-completion dates — the shipped templates and
      worked examples taught all three.
    now: >
      All three are removed from the shipped documentation (v3.50.0), because
      the daemon blocks them: plan_time_estimates denies effort estimates and
      target dates in plan documents, and dated narrative belongs in JOURNAL/.
      docs/PLAN_SYSTEM.md and CLAUDE/PlanWorkflow.md previously instructed
      agents to write plans their own handlers would reject. Plans use
      "## Delivery & Milestones" (curated milestones + commit hashes) and put
      the blow-by-blow in JOURNAL/. Existing plans are never rewritten.

  - was: >
      A file under a plan's JOURNAL/ is treated as journal content when its
      name matches the day-file grammar NNNNN-Journal-YY-MM-DD.md.
    now: >
      Journal territory is decided by LOCATION as well as by name (v3.50.0).
      Anything inside a JOURNAL/ directory, at any depth and whatever its
      filename, is exempt from plan-document rules. Previously a file in
      JOURNAL/ whose name did not parse — a typo'd date, or notes.md — still
      received plan rules: plan_time_estimates would block a recorded duration
      in it, and markdown_table_formatter would silently REWRITE it, violating
      the byte-stability the append-only check exists to protect. One shared
      classifier now answers this question for every handler and check, so a
      file can never be classified as both a plan document and a journal.
