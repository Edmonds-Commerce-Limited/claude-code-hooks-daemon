version: "UNRELEASED"
truth_changes:
  - was: >
      The daemon archives your conversation transcript before every
      compaction, into untracked/transcripts/. If you need the history of a
      session -- for debugging, for a bug report, for an audit trail -- that
      directory is where a preserved copy lives, and the retention settings
      (max_archives, max_archive_age_days) control how much of it is kept.
    now: >
      The transcript_archiver handler has been REMOVED (Plan 00233) and no
      archives are written. Nothing is lost, because the archives never
      preserved anything that was not already preserved: compaction does not
      delete the original transcript, and the original already sits on the
      same persistent storage the copies were written to. Nothing in the
      daemon ever read an archive either -- the only references were a
      disk-usage row, a retention entry, and a suggestion in the bug-report
      skill.
      If your project's notes, onboarding docs or runbooks tell someone to
      look in untracked/transcripts/, point them at Claude Code's own file
      instead: ~/.claude/projects/<project-slug>/<session-id>.jsonl. It is
      JSONL, one entry per line, so sample it with grep or "tail -n 200
      <file>" rather than opening a file that may be tens of megabytes.
      Your existing untracked/transcripts/ directory is not touched by the
      upgrade and is safe to delete. A leftover "transcript_archiver:" block
      in your config is also safe to leave -- retired handler names are
      tolerated by the validator and will not degrade the daemon.
  - was: >
      Secret terms from your block-words list are redacted out of the daemon's
      artefacts, including the PreCompact transcript archive. Scanning the
      daemon's output directories and finding nothing means a term has not
      leaked to disk.
    now: >
      The second sentence was never sound, and the removal of the transcript
      archiver makes it worth stating plainly. Redaction covers DAEMON-OWNED
      outputs -- deny reasons, daemon logs, payload capture, and (while it
      existed) the transcript archive. It has never covered Claude Code's own
      session transcripts, which are written by Claude Code and hold whatever
      was pasted into the conversation, verbatim.
      That boundary was drawn by enumerating code sites the daemon writes to,
      rather than by reasoning about which files on disk contain secrets, so a
      clean scan of the daemon's directories is not evidence that a term is
      absent from the machine. Practically: before pasting transcript content
      into a bug report or an issue, check it against your secret word list
      yourself. Redacting the originals is deliberately NOT attempted -- they
      have a live writer while a session is running, and rewriting another
      tool's live data files is a different class of act from reading them.
