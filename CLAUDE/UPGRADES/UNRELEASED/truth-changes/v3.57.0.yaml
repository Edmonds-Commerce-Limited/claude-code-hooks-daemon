version: "3.57.0"
truth_changes:
  - was: >
      Several handlers hardcoded `CLAUDE/` (agent docs), `docs/` (human docs)
      and `CLAUDE/Plan/` (plan directory) regardless of a project's
      `documentation.trees` / `plan_workflow.directory` config —
      markdown_organization, goal_injection, recovery_cron_advisor,
      plan_workflow, plan_number_helper, worktree_file_copy,
      same_commit_plan_doc, path_existence and british_english each
      re-declared the same truth independently. A project that configured a
      non-default tree or plan-directory name was treated inconsistently by
      those handlers — `markdown_organization` in particular would BLOCK a
      write to the project's own configured human/agent doc tree because it
      only recognised the defaults.
    now: >
      Plan 00288's `ProjectLayout` runtime facade fixes this: every handler
      named above now reads ONE composed API instead of a hardcoded literal.
      This changes behaviour ONLY for a project that has configured a
      NON-DEFAULT `documentation.trees.agent`/`human` or
      `plan_workflow.directory` value, and always IN THAT PROJECT'S FAVOUR —
      what was previously blocked or inconsistently applied is now treated
      correctly. A project using the defaults (`CLAUDE/`, `docs/`,
      `CLAUDE/Plan/`) sees no behaviour change.

      `tdd_enforcement` additionally now consults `layout.source_dirs`/
      `test_dirs` (when declared) BEFORE its existing per-language inference;
      `test_path_map` is unchanged and still the flat-placement override.
  - was: >
      Four independent, hand-maintained vendored/build-directory name sets
      existed across the codebase, silently drifted apart:
      `docs_qa.corpus.COMMON_VENDORED_BUILD_DIR_NAMES` (8 names),
      `strategies.lint.common.COMMON_SKIP_PATHS` (11, including a redundant
      `rust_strategy.py` duplicate of `target/`), `worktree_seed_suggestions`'s
      `_EXCLUDED_DIRECTORY_NAMES` (14), `validate_eslint_on_write`'s
      `SKIP_PATHS` (5, matched by unsafe bare substring), and 2 of
      `error_hiding_blocker`'s 5 default exclude globs. See
      `CLAUDE/Plan/00288-project-layout-config-ssot/MEASUREMENT-vendored-dirs.md`
      for the full cited before/after table.
    now: >
      All five now derive from one reviewed `CORE_VENDORED_BUILD_DIR_NAMES`
      constant (11 names: node_modules, vendor, third_party, dist, build,
      .build, target, .next, .venv, venv, coverage) plus each consumer's own
      documented domain extras. Each consumer newly skips the deltas
      measured as ACCEPT-eligible — e.g. the doc corpus now also excludes
      `.build`/`venv`/`coverage`; lint now also excludes `.next`/`third_party`
      (and drops the redundant `target/` duplicate); `error_hiding_blocker`'s
      default excludes grow from 2 to 11 vendored/build globs. NONE of the
      newly-skipped names exist in this repository, so this repo's own
      dogfood behaviour is unchanged; for a client with a `.next/`,
      `third_party/`, `.build/`, `venv/` or `coverage/` directory, content in
      it is no longer scanned/indexed/lint-checked where it previously was.

      `validate_eslint_on_write`'s matcher was ALSO fixed as a precondition
      of this swap: the old bare-substring check would have newly skipped
      first-party paths like `src/builder/x.ts` (contains "build") once
      `build`/`venv` joined its skip set. It now uses the same slash-bounded
      containment matcher `strategies.lint.common` already used, so growing
      the skip set no longer risks silently disabling ESLint on unrelated
      first-party files.
  - was: >
      `.claude/rules/` held only whatever a project hand-authored itself. No
      daemon-shipped rule pointed a directory role at its enforcement or
      convention.
    now: >
      On the FIRST daemon restart after upgrading past this version (Plan
      00288, D5), 7 new pointer files appear under a project's `.claude/rules/`
      — one per directory role (source dirs, test dirs, the human and agent
      doc trees, `.claude/skills/`, `.claude/agents/`, and the plan directory,
      the last one only when `plan_workflow.enabled` is true). Each is scoped
      by a `paths:` glob computed from the project's OWN configured layout at
      deploy time and routes to the daemon's `CLAUDE/DirectoryRoles.md`
      reference. This is a SMOOTH-UPGRADE addition, not an opt-in: it needs no
      config change, and hand-editing a deployed rule is a SUPPORTED
      customisation — the daemon detects a customised file and never touches
      it again, even across further upgrades or a project's own layout config
      changes (which otherwise refresh a pristine rule's `paths:` glob
      automatically).
  - was: >
      Every hook fired a fresh `bash` process that sourced `init.sh` and
      spawned a `python3 -c` transport for every single event — the only
      client-side transport that existed, and the daemon's own source tree
      was the client's entire auditable surface (no compiled artifact of any
      kind was ever installed into a project).
    now: >
      Plan 00290 adds an opt-in, EXPERIMENTAL fast path: a std-only static
      Rust relay binary (`relay/hooks_relay.rs`, zero crates) that a hook
      execs directly against a per-event Unix socket, falling back to the
      unchanged bash+python3 transport on any failure. It ships off by
      default (`daemon.transport.relay_enabled: false`), so a project that
      has not opted in sees no behaviour change at all. A project that DOES
      opt in also makes an explicit, SEPARATE choice for how the binary is
      provisioned (`daemon.transport.relay_source: build|download`, both
      null by default): `build` compiles from source with plain `rustc`
      (no cargo) and is the preferred, first-class route whenever a
      musl-capable toolchain is present; `download` fetches a
      sha256-digest-verified precompiled asset from the matching GitHub
      release as a convenience, never as the only option — the source
      always ships in the package either way. This is a considered,
      documented departure from "the source tree is the entire auditable
      surface" for projects that opt into it; digest verification and the
      always-shipped source are the stated mitigations. See
      `docs/guides/HANDLER_REFERENCE.md#transport-daemontransport` and
      `CLAUDE/Plan/00290-rust-socket-relay-forwarder/DESIGN-socket-relay.md`.
  - was: >
      Toggling the relay transport was a three-step MANUAL dance — edit
      `daemon.transport.relay_enabled` by hand, regenerate the deployed
      forwarders, restart the daemon — with no built-in verification.
      Every mis-sequenced step during the Plan 00290 dogfood smeared a
      broken window across live sessions, and nothing checked the result
      in the invocation context Claude Code actually uses.
    now: >
      Plan 00294 adds `bin/hooks-daemon transport on|off|status`: ONE
      command performing config flip (comment-preserving targeted line
      edit) -> forwarder regeneration -> daemon restart -> verification
      that invokes the deployed forwarders exactly as Claude Code does
      (socket stdin, real payload shapes: JSON decision object for a
      relay-eligible event, raw text for the status line, exit-code-2 for
      a blockable Stop, plus a per-event listener check). Any verification
      failure AUTO-REVERTS the previous state end-to-end and re-verifies
      it with the same probes, exiting non-zero with the failure named.
      Repeating the current state is a clean no-op; `transport status`
      reports the active rung, listener count, relay binary facts and the
      last toggle's persisted verification result. Hand-toggling still
      works but is no longer the supported route. See
      `docs/guides/HANDLER_REFERENCE.md#transport-daemontransport` and
      DESIGN-socket-relay.md §6.4.
  - was: >
      A tool the project never wanted (Artifact being the poster child) could
      only be fought at CALL time: artifact_publish_blocker denied each
      publish attempt, but the tool's schema — measured at ~6,000 tokens for
      Artifact — still loaded into EVERY session's context window, and no
      daemon surface could tell a project which tools its sessions never
      actually use.
    now: >
      Plan 00293 adds the disable-at-source story end to end. Research
      (RESEARCH-tool-disable.md) established that settings-level disables
      (`"enableArtifact": false`, bare tool names in `permissions.deny`,
      `--tools`) remove the schema from context while specifier/parameter
      deny rules are call-time refusal only. artifact_publish_blocker gained
      an opt-in `source_disable` option that keeps the project's
      `.claude/settings.json` at `"enableArtifact": false` (additive,
      idempotent, one-shot backup); `bin/hooks-daemon tool-report` scans the
      project's session transcripts (tool names and counts only — never
      content) and ranks tools by measured schema cost vs observed usage
      into never-want / never-used / low-use / keep tiers; a new opt-in
      `tool_disable_advisor` SessionStart handler checks declared
      `tool_policy.never_want` tools against project settings and names the
      exact missing change. Everything RECOMMENDS — nothing is ever disabled
      automatically, except where a project deliberately enables the
      blocker's own source_disable enforcement.
