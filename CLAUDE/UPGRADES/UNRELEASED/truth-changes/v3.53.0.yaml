version: "3.53.0"
truth_changes:
  - was: >
      When a PLAN.md grows past the size tiers there are exactly TWO remedies,
      and neither is deletion: RELOCATE the narrative into the plan's JOURNAL/
      day-file, or SPLIT the plan if the task tree itself is the bulk. If
      neither fits your content, the remaining option is to compress the prose
      until the file drops under the threshold.
    now: >
      There are THREE remedies, and the one that is correct most often was the
      one never named: EXTRACT durable detail -- research output, findings,
      decisions and their reasoning, drafts, evidence tables -- into a NAMED
      SUPPORTING DOCUMENT in the plan folder (RESEARCH-*.md, DECISIONS.md, a
      brief) and link to it from the task that needs it. PLAN.md is a task list
      plus instructions; almost anything making it big is detail that wants a
      name of its own. The justification is the same read-contract argument
      that already justifies JOURNAL/: a supporting doc is unbounded because it
      is only opened when its link is followed, so it costs nothing to the
      sessions that do not need it. This is the progressive-disclosure
      principle the markdown_organization handler already applies to
      .claude/rules/*.md -- the plan system simply was not applying its own
      rule. Concretely, three things changed: (1) the plan-doc-size remedy text
      now lists EXTRACT first, ahead of RELOCATE and SPLIT; (2) when the check
      fires on a plan folder containing no supporting documents, it appends a
      folder-shape hint saying so, since a PLAN.md over the threshold with no
      supporting docs is usually a plan being used as a notepad -- offered
      explicitly as a suggestion from folder shape and NOT as a diagnosis,
      because a plan can legitimately be large when its task tree genuinely is
      the bulk; and (3) the supporting-docs structure, which the daemon's own
      internal PlanWorkflow.md has always used, is now shipped to client
      projects instead of staying upstream.
      Correct your own docs if they assert the two-remedy version. The
      practical consequence of the old wording was measured in a client
      project: an agent hit the advisory repeatedly, found neither sanctioned
      remedy fitted content that was durable and CURRENT rather than
      historical, and so compressed prose five times -- deleting a decision
      table outright purely to clear a threshold. Applying the third remedy
      instead took that PLAN.md from 19,045 to 9,520 bytes with all 31 tasks
      intact, and the extracted material ended up FULLER than what had been
      compressed away, because it finally had a legitimate home.
  - was: >
      The plan-shrink-without-journal commit check distinguishes a relocation
      from a deletion by a single reliable signal: a relocation stages a
      JOURNAL/ entry and a deletion does not. So a commit that shrinks a
      PLAN.md by 2,000+ bytes without staging a journal entry has deleted
      narrative.
    now: >
      That premise is true for HISTORICAL narrative and false for DURABLE
      narrative. Extracting content into a supporting document is a
      textbook relocation that stages no journal entry at all, so the check
      previously reported the most correct possible action as a deletion --
      actively punishing the behaviour the guidance is now promoting. The
      check now also accepts a newly ADDED .md file staged in the same plan
      folder (excluding JOURNAL/) as evidence of relocation, exactly as it
      accepts a journal entry. If you have been journalling solely to keep
      this check quiet while extracting, you no longer need to.
  - was: >
      There are two supported ways to create a plan folder: run mkplan.bash, or
      create the NNNNN-name directory yourself with mkdir and then write its
      PLAN.md. Both end up in the same place, so the choice is a matter of
      convenience.
    now: >
      Hand-creating the folder is BLOCKED. `mkdir <plan-dir>/NNNNN-name` is
      denied by plan_number_helper whenever mkplan.bash is deployed, and the
      block names the exact scaffolder command to run instead. Correct any doc
      of yours that offers mkdir as an equivalent option. The two paths were
      never equivalent: mkplan.bash takes a lock and allocates atomically from
      hooksdaemon.latestPlanNumber, whereas mkdir claims a number the moment the
      folder appears but nothing records the claim until PLAN.md is written --
      so a second agent reading the counter in that window is handed the SAME
      number, and the collision surfaces only at the commit gate, once both
      folders exist. Until v3.53.0 the removed validate_plan_number handler hid
      this by advancing the counter on the mkdir itself; when Plan 00237 merged
      that handler away it ported the side effect to the PLAN.md write only, so
      the window widened silently. Closing it by redirecting to the scaffolder
      removes the unsynchronised path rather than adding bookkeeping to it. The
      block is narrow and deliberately so: an archive directory
      (<plan-dir>/Completed), a JOURNAL/ inside a plan that already exists, a
      `-p` re-create of a folder already on disk, a mkdir inside the body of a
      QUOTED-delimiter heredoc (content being written rather than run), and any
      path outside the workspace are all still allowed -- the last of those is
      what keeps plan-shaped test fixtures under /tmp working. If
      mkplan.bash is NOT deployed the handler stays silent, because denying the
      only available path would leave an agent unable to create a plan at all.
  - was: >
      Runtime files the daemon writes under its untracked directory are ordinary
      files with ordinary permissions, so the only thing you need to know about
      that directory is that it is git-ignored and safe to delete.
    now: >
      Until v3.53.0 every one of those files was created WORLD-WRITABLE (0666,
      directories 0777) and readable by every local user on the machine,
      including the verdict log (what every handler decided about every tool
      call, with the command strings), payload-capture/ (raw hook payloads,
      i.e. the full body of every Write and Edit, when capture is enabled), the
      stop-event log, the per-session sidecars, the PID file and the
      .socket-path discovery file. The cause was the textbook daemonise step
      os.umask(0), which clears the file-creation mask and is safe ONLY for a
      daemon that passes an explicit mode to every create -- this one did so at
      exactly 1 of 98 create sites. The daemon now applies umask 0o077, so new
      artefacts are owner-only, and the three known-sensitive ones additionally
      pass an explicit mode at the create site so the guarantee survives a
      future regression of the umask line. The socket is unaffected: it was
      always 0660 via an explicit post-bind chmod. Correct any doc of yours that
      describes the untracked directory as unremarkable, and note the important
      half: a umask governs CREATES and retro-fixes NOTHING, so every file your
      daemon has already written keeps its 0666 until you change it. Run
      `hooks-daemon check-permissions` to see them and `--fix` to tighten them;
      it exits 1 while findings remain, so it can gate CI. One behaviour change
      to expect: a second user account can no longer READ the daemon's runtime
      files (most visibly a container running the daemon as root over a
      bind-mounted project while you work on the host). That is the intended
      fix, and it does not break daemon sharing -- cross-UID sharing was never
      possible, because the socket is 0660 owned by the daemon's user and no
      code anywhere sets a shared group, so a second UID was already refused at
      connect().
  - was: >
      The daemon's own files live in .claude/hooks-daemon/. That directory is
      git-ignored by the installer, so excluding it -- which most projects get
      for free, since ruff and similar tools respect .gitignore -- keeps
      upstream code out of your quality gates. Everything else under .claude/
      is yours.
    now: >
      Four more paths are daemon-owned and are deliberately NOT git-ignored,
      because they only work when committed: .claude/init.sh, .claude/hooks/*
      (the forwarder scripts), .claude/skills/hooks-daemon/scripts/*.sh, and --
      where they apply -- CLAUDE/Plan/mkplan.bash and
      .claude/ccy/claude-supervise.py. All are rewritten on every install and
      upgrade, so a local edit is discarded, and all of them sit inside your
      linters' default scope. Correct any doc of yours that says the daemon is
      confined to .claude/hooks-daemon/, or that treats everything else under
      .claude/ as project-owned. The enumerated list, why each file cannot live
      in the vendor directory, and copy-pasteable ruff / shellcheck exclusions
      are now in CLAUDE/LLM-INSTALL.md under "Which Files Under .claude/ Are
      Yours?", generated from a manifest the daemon's test suite keeps in step
      with the code that performs each deploy. Every one of those files also
      now opens with a DAEMON-OWNED banner, so the file itself answers the
      question at the moment you open it. The contract is explicit: upstream
      guarantees each asset is clean under its language's DEFAULT rule set
      (ruff --isolated, shellcheck with no rc) and a CI check enforces it, so a
      finding under default rules is an upstream bug worth reporting; upstream
      cannot guarantee cleanliness under rules you choose, which is what the
      documented exclusions are for. This was reported from the field: a client
      repo linted 3,100 lines of the deployed PTY supervisor and hit three
      findings it could not fix (upgrades overwrite the file), could not
      silence (the qa_suppression handler denies an agent writing an inline
      directive), and had no reason to exclude.
