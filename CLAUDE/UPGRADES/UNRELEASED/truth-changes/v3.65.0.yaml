# Drafted by the release agent for v3.65.0. The VERSION in the filename and
# the `version:` key are a target, not a decision -- releases are human-gated
# in this project, and the release agent confirms or renames this file. Only
# the content is asserted here.
version: "3.65.0"
truth_changes:
  - topic: handler-development
    id: worktree-remove-can-block
    was: >
      A `WorktreeRemove` hook cannot block the removal. The vendored contract
      (`contracts/claude-code-hooks/WorktreeRemove.json`) recorded
      `block_mechanism: null` and `can_block: false`, and
      `constants/events.py`'s `EventID.WORKTREE_REMOVE.can_block` was `False`
      to match -- so a handler on this event was documented as report-only,
      with nothing it returned able to stop the removal.
    now: >
      A `WorktreeRemove` hook CAN block the removal, via a new `nonzero-exit`
      mechanism: any non-zero exit fails the removal, conditional on the
      worktree directory still existing afterward (a non-zero exit that
      nonetheless removed the directory is not a failure). This is not
      exit-2-specific like most blocking events. Claude Code discards this
      event's JSON output fields (`systemMessage`, `continue` and the rest),
      so a refusal cannot be expressed on the wire -- only the process exit
      code is read, and on failure the worktree stays on disk with the hook's
      command and stderr going to the debug log. `constants/events.py`'s
      `EventID.WORKTREE_REMOVE.can_block` is now `True` to match. This
      corrects a claim table refreshed against the vendored Claude Code hooks
      contract (Claude Code v2.1.272); the field has no runtime consumer
      outside this project's own QA checker, so nothing in shipped handler
      behaviour changed -- only what a handler AUTHOR should believe is
      possible changed.

  - topic: plan-qa
    id: header-body-coherence-completion-stage-move
    was: >
      The `header-body-coherence` check was registered at EDIT and SWEEP only,
      both at BLOCK, and its completion branch ("header says In Progress /
      Not Started but every box is ticked") denied the write at EDIT. It had
      no COMMIT registration, so a plan COMMITTED in that state reached
      history unchallenged and was reported only by the next session's sweep.
    now: >
      The completion branch is ADVISE at EDIT, and the check gains a COMMIT
      registration at BLOCK. The `Not Started`-with-boxes-ticked branch is
      unchanged and still BLOCKS at EDIT.

      This is a defect fix, not a policy relaxation (Plan 00419 N3). Closing a
      plan requires two changes to one PLAN.md -- tick the last Success
      Criterion, and flip the status header -- and the `Edit` tool replaces one
      contiguous span, which those two never share. Both orderings were denied:
      ticking first hit this check, and flipping first hit a
      completion-criteria gate. The only single-call move left was a whole-file
      `Write`, the operation `R-WRITE-CLOBBER` exists to discourage. The
      all-ticked-under-`In Progress` state is the MANDATORY intermediate on the
      legal close path, and a gate no legal sequence of moves can satisfy is a
      defect.

      Net effect on enforcement is a TIGHTENING: the invariant moves from a
      surface that sees a half-written document to the two that see a settled
      one, and the commit gate it gains is a surface it never had. An agent
      that ticks a plan's last box now gets an advisory instead of a denial;
      the very next `git commit` denies the same state, scoped by Plan 00343's
      rule so a commit is blamed only for incoherence it introduced, never for
      incoherence it inherited.

  - topic: docs-qa
    id: pointer-resolves-archive-aware
    was: >
      `pointer-resolves` judged a markdown link by its LITERAL path only, so
      archiving a plan made every `](../00NNN-y/PLAN.md)` it contained read as
      a dead link -- the folder had moved one level deeper, not vanished. A
      link that was NEW in the edit or commit was graded BLOCK, and the SWEEP
      half reported the rest at ADVISE. Docs QA also hardcoded the plan tree's
      shape (`CLAUDE/Plan`, `Completed`, `Cancelled`) when excluding the plan
      archive from its corpus, so a project that configured
      `plan_workflow.directory` or a renamed `qa.completed_dir` had its LIVE
      plans excluded and its real archive indexed.
    now: >
      When the literal path fails, a target naming a plan folder is re-resolved
      by plan NUMBER across the whole plan tree -- the active root and every
      configured archive directory -- exactly as `hooks-daemon find-plan`
      already resolves for humans. A link that resolves that way is never
      reported as missing and never BLOCK: the edit under judgement did not
      move the target. A link to a plan that never existed still reports dead.
      What replaces the false positive is source-sensitive and ADVISE-only: an
      ARCHIVED source and a `JOURNAL/` day-file say nothing at all (a record is
      not rewritten, and a journal is append-only so the repoint is
      structurally forbidden), a live `PLAN.md` defers to plan QA's new
      `plan-link-resolves`, and every other live document gets an advisory
      naming the path to repoint to. The plan tree's shape now travels with the
      `DocumentationPolicy`, read from `plan_workflow` config, so both the
      archive exclusion and the resolver honour a project's configured
      directory and archive names. No new config key is introduced.
  - topic: plan-qa
    id: plan-link-resolves-added
    was: >
      No plan QA check resolved links at all, so `plan-qa --sweep` reported a
      tree CLEAN with dead plan links in it -- verified twice on this
      repository's own tree the day plan 00413 was archived, over eight of
      them. `path-existence` looks only at inline-code spans, not links, and
      exempts archived plans by design.
    now: >
      A new check `plan-link-resolves` runs at SWEEP only, at ADVISE only. It
      reports a LIVE `PLAN.md` whose link names a plan that has since been
      archived -- with the repointed path in the remediation -- and a link
      whose target does not exist anywhere. Archived plans and journals are
      exempt, which is the doctrine this remedy rests on rather than an
      omission. It is deliberately NOT registered at EDIT or COMMIT: docs QA's
      `pointer-resolves` already blocks a link that is NEW in an edit or a
      commit, and a second blocking gate on the same fact is a double gate.
