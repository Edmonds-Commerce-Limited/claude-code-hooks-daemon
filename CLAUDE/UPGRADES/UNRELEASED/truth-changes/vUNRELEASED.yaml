version: "UNRELEASED"
truth_changes:
  - was: >
      When `sensitive_content` denied a write with "entry N of M in the
      secret word list", the documented remediation was to OPEN the secret
      word list file (if you have access) to see what matched. Reading a
      secret file's contents — the word list, a vault password file, key
      material — was an ordinary tool call nothing restricted.
    now: >
      Reading a protected file's CONTENTS is BLOCKED (Plan 00272). The new
      `secret_file_guard` PreToolUse handler denies Read/Write/Edit/
      NotebookEdit/Grep on a protected path and ANY Bash command mentioning
      one, with default globs covering "*.secret*" (including
      `.claude/block-words.secret`), vault-password shapes and SSH key
      names. The `sensitive_content` remediation is REVERSED: do not open
      the word list — ask the user what entry N covers. Presence and
      metadata remain available via `hooks-daemon secret-meta <path>`
      (existence, bucketed size, mtime, permissions, keyed digest — never
      content), and allowlisted consumers such as
      `ansible-playbook --vault-password-file <path>` keep working.

      IF YOUR PROJECT'S DOCS OR SKILLS TELL AN AGENT TO OPEN A SECRET FILE
      (the word list included), THOSE INSTRUCTIONS ARE NOW FALSE — rewrite
      them to use `secret-meta` or to ask the user. There is deliberately NO
      agent-side escape hatch; a HUMAN edits
      `handlers.pre_tool_use.secret_file_guard` to lift protection.
  - was: >
      Publishing an artefact is an ordinary step an agent can take on its own
      initiative. A project's own documentation and skills could instruct an
      agent to render a report as an artefact and hand the user the resulting
      link, and that instruction would simply work — nothing in the daemon
      inspected or restricted the `Artifact` tool, because no handler keyed on
      it at all.
    now: >
      Artefact publishing is BLOCKED by default (Plan 00259). The
      `artifact_publish_blocker` PreToolUse handler denies any `Artifact`
      publish or update: an absent `action` (which means publish),
      `action: "publish"`, or passing `url` to update an existing page. An
      unrecognised future action is treated as publishing rather than being
      waved through, so the default is fail-safe. Read-only `action: "list"`
      is never blocked, since enumerating discloses nothing new.

      The reasoning is disclosure, not content: publishing renders a local
      file to a page hosted on claude.ai and returns a URL. The page starts
      private, but it lives OUTSIDE the project — the repository cannot audit
      what left it, and deleting the artefact later does not un-share a link
      somebody has already opened. Whether content leaves is the user's call.
      Content scanning remains `sensitive_content`'s job and already happened
      when the file was written; this handler guards the ACT of publishing.

      IF YOUR PROJECT'S DOCS, SKILLS OR AGENT INSTRUCTIONS TELL AN AGENT TO
      PUBLISH AN ARTEFACT OR SHARE AN ARTEFACT LINK, THOSE INSTRUCTIONS ARE
      NOW FALSE and the agent will be denied when it follows them. Either
      rewrite them to write the file locally and give the user its path, or
      have a HUMAN set
      `handlers.pre_tool_use.artifact_publish_blocker.enabled: false`.

      Note there is deliberately NO agent-side `MUST_..._BECAUSE` escape
      hatch, unlike `git_stash` or `ancestry_preserving_merge`. Those hatches
      cover actions whose consequences stay inside the repository; publishing
      leaves it, so an agent able to type its own justification would have
      self-authorised disclosure — the same reason
      `delete-branch --allow-unproven` still demands an interactive human.

      This has no effect on a human publishing through the claude.ai UI. The
      daemon sees tool calls, not browser clicks — the same honest limitation
      `ancestry_preserving_merge` records about the GitHub merge button.
  - was: >
      `Write` is the tool for putting content into a file, and using it on an
      existing path simply replaces that file. A project's own docs, skills or
      agent instructions could tell an agent to "write the updated file" without
      qualification, and that instruction worked whether or not the agent had
      read what was already there.
    now: >
      A `Write` to a file that ALREADY EXISTS and that the session has not
      `Read` is BLOCKED (Plan 00261). `Write` replaces a file's entire
      contents, so writing blind destroys content the agent cannot describe --
      it could not report the loss even afterwards.

      Creating a NEW file is never blocked. Neither is rewriting a file the
      session already read or wrote, nor any `Edit`. The remedy is one call:
      `Read` the file and retry, or use `Edit`. There is deliberately no
      `MUST_..._BECAUSE` escape hatch, because a `Read` actually removes the
      hazard whereas a typed justification would only declare it acceptable.

      IF YOUR DOCS OR SKILLS INSTRUCT AN AGENT TO REGENERATE OR REWRITE A FILE
      WHOLESALE, add "read it first" to that instruction — otherwise the agent
      will be denied the first time it follows them on an existing file.

      Two things worth knowing about the reasoning, because they change what
      you should expect. First, this restores a contract the harness already
      DOCUMENTS: the `Write` tool states that overwriting an unread file will
      fail, and measured under `bypassPermissions` it does not. In other
      permission modes the approval prompt is a real net, so this closes a gap
      specific to unattended operation. Second, the guard tracks READS, not
      sizes — a byte-threshold rule would not have caught the incident that
      motivated it, because the clobbering write made the file BIGGER. The
      hazard is replacement without knowledge, not shrinkage.

      Not covered: Bash-mediated writes (`>`, `>>`, `tee`, heredoc). Those
      bypass every Write/Edit-keyed handler and are tracked separately.
  - was: >
      A file written through Bash was covered by the same guards as one written
      with `Write` or `Edit`. Handler guidance said so directly — eight sections
      opened with an unqualified "Writing X is blocked" — so a `>`, `>>`, `tee`
      or heredoc write that drew no complaint read as evidence that the content
      had been checked and passed.
    now: >
      It never was, and the guidance now says so (Plan 00260). Twenty-two
      handlers key on the `Write`/`Edit` TOOL NAMES, so a file reaching disk
      through Bash is seen by none of them: no block, no advisory, no record.
      The eight false claims are corrected in place, and the class-wide fact is
      stated once in the shared guidance intro.

      NOTHING ABOUT ENFORCEMENT CHANGED HERE — this entry exists because what
      you were TOLD changed. If your project treated a clean Bash write as
      evidence that a content guard approved it, that inference was always
      wrong. Nothing needs fixing in your config; what needs revisiting is any
      doc, skill or review checklist that relies on it.

      The intro deliberately also names the guards that are UNAFFECTED —
      destructive git, `sed`, pipes, permissions, `curl | sh` judge the Bash
      COMMAND and still cover you. A reader told only that Bash bypasses the
      content guards could conclude Bash is unguarded generally, which is false
      and more dangerous than the gap being described.

      This matters more than it used to because Claude Code injects a
      `system-reminder` under `bypassPermissions` directing agents to edit
      files "with `sed`, heredocs, or short scripts, rather than using the
      dedicated Read, Edit, or Write tools". The daemon cannot suppress that
      instruction, so for a project where `bypassPermissions` is permanent this
      is a standing condition of every session, not an edge case.
  - was: >
      With `allow_untracked_claude_memory: false`, the bash side-door to Claude
      auto-memory paths was closed. In practice only two spellings were
      detected — a `>`/`>>` redirect and the FIRST `tee` operand — so a command
      using any other route wrote the file and was allowed.
    now: >
      The memory-path rule now resolves write targets by tokenising the command
      (Plan 00260), so seven further spellings are DENIED that previously
      succeeded: `>|`, `&>`/`&>>`, `dd of=`, `cp`/`mv`/`install` destinations,
      every `tee` operand after the first, a quoted path containing a space, and
      a copy INTO a memory DIRECTORY (`cp note.md <memory-dir>` or
      `cp -t <memory-dir> note.md`), which is resolved to the file it really
      writes. Heredoc bodies are scanned too.

      IF YOUR PROJECT HAS A SCRIPT OR DOCUMENTED WORKFLOW THAT COPIES OR TEES A
      FILE INTO A MEMORY PATH, IT WILL NOW BE DENIED where it previously worked.
      This affects only projects that set `allow_untracked_claude_memory: false`;
      reads are still never blocked, so migrating existing memory out is
      unaffected.

      Still NOT detected, and stated so you do not over-trust it: a target the
      daemon cannot resolve exactly — a variable such as `> "$OUT"`, or a glob.
      These are declined deliberately rather than guessed, because naming the
      WRONG path would make a path-keyed guard judge a file that was never
      written, which is worse than naming none. One common variable spelling is
      still caught by a separate raw-string scan that was kept alongside the new
      resolver for exactly that reason.

      The wider resolver is available to other handlers as
      `get_bash_write_targets()`. The two linters now use it as well — see the
      next entry, which covers the denial surface that creates.
  - was: >
      A source file written through Bash was never linted. `cat > x.py <<'EOF'`
      put unparseable Python on disk in silence, while the identical content
      through `Write` was denied by `lint_on_edit` — so the route that appeared
      safest, because nothing complained, was the only unguarded one.
    now: >
      Both linters now check files a Bash command AUTHORS (Plan 00260 Task
      3.5). `lint_on_edit` covers Python, Shell, Go, PHP, Ruby, Rust, Swift,
      Kotlin and Dart; `validate_eslint_on_write` covers `.ts`/`.tsx`. The
      routes seen are the AUTHORING ones — `>`, `>>`, `>|`, `&>`, `tee`, and a
      heredoc — and a command that authors several files has each of them
      checked.

      THIS IS A NEW DENIAL SURFACE, BUT ONLY WHERE THESE HANDLERS ARE ALREADY
      ENABLED. Both ship `enabled: false` in the default client configuration,
      so a project that has not opted in sees NO change from this — verified in
      a real client install rather than inferred from this repository, which
      enables both and is therefore not representative.

      If your project HAS enabled either handler: both DENY on failure, and the
      write has ALREADY landed when they run, so the denial is a failure report
      to repair with `Edit`, never a rollback. A denial also cancels sibling
      tool calls batched in the same turn. Scripts or documented workflows that
      generate source files via heredoc or redirect will now be linted and can
      be denied where they previously passed unexamined.

      Opt out per handler without disabling it:
      `handlers.post_tool_use.lint_on_edit.options.lint_bash_writes: false` and
      `handlers.post_tool_use.validate_eslint_on_write.options.check_bash_writes:
      false`. Both leave `Write`/`Edit` linting exactly as it was.

      Two exclusions are deliberate, and both LIMIT the new denials. A file the
      command merely RELOCATES — `cp`, `mv`, `install`, `dd` — is never linted,
      because those bytes were already on disk: denying the copy would report a
      defect the command did not introduce and leave the agent repairing a file
      it never chose to write. And a predicted target that does not exist is
      never linted, since a command that failed leaves nothing to check.
      Heredoc BODIES are not scanned for nested targets either, because that
      mode yields occasional phantom paths from prose and a DENYING handler
      must never act on a file the command did not write.
  - was: >
      The Behaviour column in the generated `.claude/HOOKS-DAEMON.md` could be
      read as describing what a handler does, so a row saying ADVISORY or
      NON-TERMINAL meant that handler would warn rather than stop a tool call.
    now: >
      That column was never derived from behaviour — `_detect_behavior` renders
      a HAND-DECLARED tag, and nothing compared the tag to the code. Five
      handlers had drifted: `lint_on_edit`, `write_clobber_guard`,
      `plan_qa_edit`, `plan_time_estimates` and `plan_number_helper` all DENY,
      most of them unconditionally, while advertising themselves as ADVISORY or
      NON-TERMINAL. They are now tagged BLOCKING and the table states it
      (Plan 00260). `plan_number_helper` was the sharpest case: already
      `terminal=True`, but the advisory tag is checked FIRST and overrode it.

      NO HANDLER BEHAVIOUR CHANGED. Tags are documentation metadata and are
      never consulted in dispatch — verified against the front controller and
      event router — so nothing blocks that did not block before. What changes
      on upgrade is what the table SAYS about handlers that already blocked.

      Two consequences once you regenerate (`hooks-daemon generate-docs`).
      First, `check_doc_truth` uses that column as ground truth when judging
      whether prose claiming a handler "blocks" is a false claim, so an opt-in
      handler bullet in YOUR docs describing one of these five as advisory will
      now be flagged — correctly — where it previously passed. Second,
      `check_handler_reference` requires every BLOCKING handler to carry a
      section in `HANDLER_REFERENCE.md`; all five already do upstream.

      Three handlers deliberately KEEP an advisory label because their deny
      paths are config-conditional: `plan_qa_commit_gate` (ships
      `commit_gate_mode: warn`), plus `npm_command` and
      `validate_eslint_on_write` (both inert without `llm:` scripts in
      package.json). Calling those BLOCKING would overstate what a default
      installation does, which is the same untruth pointed the other way.
  - was: >
      A handler subclasses `Handler` and returns `HookResult`, one
      event-agnostic type shared by all 31 wired events. Nothing at the type
      level tied a handler to the decisions its event can actually deliver, so
      a `SessionStart` handler could construct a DENY and every checker stayed
      silent — the refusal was then dropped on the wire and the handler
      believed it had blocked.
    now: >
      Each event has a base class named after it —
      `SessionStartHandlerBase`, `PreToolUseHandlerBase`, `StopHandlerBase`,
      and so on, in `claude_code_hooks_daemon.core.handler_bases` (Plan
      00265). Each narrows `handle()` to the result type its event can carry:
      `GatingResult` (allow/continue/deny/ask), `BlockingResult`
      (allow/continue/deny) or `AdvisoryResult` (allow/continue). 82 of the 84
      built-in handlers now subclass their event's base; the two exceptions are
      the pseudo-event handlers, for the reason given at the end of this entry.

      SUBCLASSING `Handler` DIRECTLY STILL WORKS AND IS NOT DEPRECATED, so no
      existing project handler breaks. What changed is that a better option
      exists: if your project runs mypy, the event base turns a silent
      production misfire into a compile error, which is the only place the
      mistake can be caught before it ships. Build results through the tier —
      `AdvisoryResult.allow(...)`, `BlockingResult.deny(...)` — rather than
      `HookResult`.

      Two boundaries worth knowing. `AdvisoryResult.deny(...)` does NOT
      type-check: `deny` is inherited from `HookResult` and deliberately
      returns the wide type, so a handler declared `-> AdvisoryResult` is
      rejected for using it. And a PSEUDO-EVENT handler has no fixed tier —
      its decision is delivered under whichever real event triggered it, and
      triggers are per-project config — so those stay on plain `Handler` and
      are clamped at merge time instead.
  - was: >
      `hooks-daemon validate-project-handlers` reported a handler returning a
      decision its event cannot deliver. In practice it only recognised the
      decision written as `Decision.DENY`, so a handler refusing through the
      FACTORY — `HookResult.deny(...)`, which names neither the enum nor the
      member, and is how most handlers actually refuse — passed the check in
      silence.
    now: >
      The scan recognises `<Something>Result.allow|deny|ask(...)` as well
      (Plan 00265), matched by the `Result` suffix so your own `HookResult`
      subclass is covered too.

      YOUR PROJECT HANDLERS MAY NOW REPORT A WARNING THAT PREVIOUSLY PASSED
      CLEAN. Read it rather than working around it: it means that handler
      refuses on an event that cannot carry a refusal, so the block it thinks
      it performs has never happened. Fix the handler, or move it to an event
      that can refuse.

      Measured across this repository's own 84 handlers before the fix,
      exactly one refused invisibly — and it cost nothing only because it sits
      on `PreToolUse`, which can deny. The population this actually protects is
      project handlers, which no test in the daemon repository can see.
  - was: >
      `merge_pseudo_results(real, pseudo_results)` took two arguments and
      merged a pseudo-event's decision into the real chain result unchanged.
    now: >
      It takes a third, required argument: the wire name of the REAL event the
      response will be serialised under (Plan 00265). A pseudo-event has no
      response of its own, so what it may decide is decided by the TRIGGER; an
      unknown event name now raises rather than being guessed. A decision the
      trigger's event cannot carry is CLAMPED — not written — with its reason
      delivered as context instead and the clamp logged at ERROR.

      This is dispatch plumbing, not a documented extension point, so a
      project is unlikely to call it. It is recorded because the symbol is
      exported from `claude_code_hooks_daemon.core`: if you do call it, add the
      event name.
  - was: >
      `lint_on_edit` covered Python, Shell, Go, PHP, Ruby, Rust, Swift, Kotlin
      and Dart. A `.yml`/`.yaml` file was never linted on write, so an Ansible
      playbook that would not even LOAD — an unbalanced quote inside a
      `shell:` block aborts the whole play at parse time — reached disk in
      silence and was discovered only when the playbook ran.
    now: >
      Ansible YAML is a lint_on_edit language (Plan 00268). A `.yml`/`.yaml`
      file is linted when it is plausibly a playbook or role task file — by
      Ansible's own path conventions (`playbooks/`, `roles/`, `tasks/`,
      `handlers/`, `site.yml`, `play-*`, `playbook-*`) or by carrying a
      top-level `- hosts:` / `- import_playbook:` line wherever it sits. The
      cheap tier is `ansible-playbook --syntax-check`; full `ansible-lint`
      runs at the `extended` tier, and the linter runs from the nearest
      directory containing `ansible.cfg` because roles and collections resolve
      relative to it.

      DELIBERATELY LEFT ALONE, because they share the extension but are not
      plays: `.github/workflows/`, `docker-compose*`, `group_vars/`,
      `host_vars/`, inventories, and vault files (never read — encrypted).

      This changes behaviour only where `lint_on_edit` is enabled AND the
      Ansible tooling is installed — a linter that is not installed never
      blocks, it advises that the check was SKIPPED. Where both hold, a write
      that lands an unloadable play is now DENIED with the linter's own
      diagnosis (the write has already landed; repair with `Edit`). Opt a
      project out per language with `options.languages`, or reduce to the
      syntax check only with `command_overrides: {Ansible: {extended: null}}`
      — the extended tier is NOT opt-in and runs whenever ansible-lint is
      installed, as for every other language.
  - was: >
      Several documented Claude Code hook capabilities were inexpressible or
      wrongly claimed by the daemon (Plan 00271 audit): a project handler on
      UserPromptSubmit, PreCompact, UserPromptExpansion, PostToolUseFailure,
      PostToolBatch, TaskCreated, TaskCompleted, TeammateIdle or ConfigChange
      that returned DENY was silently dropped (or serialised as the undefined
      token `{"decision": "deny"}` and ignored); PermissionRequest claimed an
      `ask` outcome the contract does not define, and its deny reason was
      routed into an undocumented `additionalContext` field; PreToolUse could
      not express `updatedInput` or the documented `defer` decision;
      SessionStart advisory context travelled only as `systemMessage`.
    now: >
      The daemon's wire format matches the documented hooks contract
      (Plan 00271). A DENY on UserPromptSubmit, PreCompact, UserPromptExpansion,
      PostToolUseFailure, PostToolBatch, TaskCreated or ConfigChange now emits
      the documented top-level `decision: "block"` + `reason`; a DENY on
      TeammateIdle/TaskCompleted emits `continue: false` + `stopReason` — so a
      project handler's block on any of those events now actually blocks.
      Those events moved from the advisory to the blocking handler tier: a
      project handler on them should subclass its event's `<Event>HandlerBase`
      and return `BlockingResult`. PermissionRequest moved to the blocking
      tier too — its documented `decision.behavior` enum is allow|deny, so a
      handler returning ASK there is now reported as undeliverable by
      `validate-project-handlers` instead of silently ignored — and its deny
      reason now reaches Claude via the documented `decision.message` field.
      PreToolUse handlers can return `updatedInput` (rewrites the tool's input
      before execution) and `GatingResult.defer()`. SessionStart advisory
      context is emitted on BOTH the documented
      `hookSpecificOutput.additionalContext` channel and `systemMessage`.
      The contract itself is vendored under `contracts/claude-code-hooks/`
      and enforced by the `hook_contract` QA check; the `contract_staleness`
      SessionStart advisory flags when the installed Claude Code outruns the
      last-audited version.

      IF YOUR PROJECT HAS HANDLERS on the events above: re-run
      `validate-project-handlers`. A handler that inherited the old advisory
      base for these events should be updated to return `BlockingResult`
      (an `AdvisoryResult` return now fails the base's type contract).
