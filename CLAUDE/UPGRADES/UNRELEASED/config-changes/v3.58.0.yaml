version: "3.58.0"
date: "UNRELEASED"
breaking: true
upgrade_guide: null
config_changes:
  added:
    - key: projects[].layout
      recommended: false
      dormant: true
      description: >-
        NEW per-project field (Plan 00300 owner ruling): a declared
        `projects:` entry may now carry its own `layout:` block (same shape
        as the top-level `layout:`) governing ONLY that project's own
        source/test/config/vendor directory names. A declared project
        without one uses built-in defaults for its own root -- it never
        inherits the top-level `layout:` block, which is the ROOT project's
        layout only, never a global fallback (no leaking one project's
        layout into another's). `ProjectRegistry.layout_for(path)` resolves
        the owning project's layout for one file;
        `ProjectRegistry.iter_layouts()`/`all_source_dirs()` are the DRY
        aggregation helpers for a handler needing the union across every
        project.
      migration_note: >-
        No action needed. A repository with no `projects:` block (or
        `projects:` entries with no `layout:` of their own) behaves exactly
        as before -- pinned by tests. Add `layout:` to a `projects:` entry
        only if that sub-project's own source/test dir names differ from the
        root project's or from the built-in defaults.
    - key: "{REPO_ROOT} path token"
      recommended: false
      dormant: true
      description: >-
        NEW (Plan 00302 extension, owner ruling): the literal token
        `{REPO_ROOT}` is now accepted as a canonical, portable notation for
        "the repository root" in any repository-relative config path field
        (`projects[].root`, `plan_workflow.directory`, and the rest of the
        Plan 00303 hard-error surfaces) -- `{REPO_ROOT}/web` normalises
        identically to `web`, and a bare relative path stays valid without
        it. On the two path fields exempt from the repo-relative-only rule
        (`plugins.paths`/`plugins.plugins[].path`, `project_handlers.path`),
        the token expands against the project root at load time -- the
        portable alternative to a genuine machine-specific absolute path,
        which a leading `/` still means unchanged.
      migration_note: >-
        Purely additive -- no existing config changes meaning. Adopt the
        token in new/edited config where the "repository root" framing reads
        more clearly than a bare relative path, or where a plugin/project-
        handler path previously needed a machine-specific absolute value.
  renamed: []
  removed:
    - key: handlers.pre_tool_use.markdown_organization.options.monorepo_subproject_patterns
      description: >-
        Plan 00300 hard cutover: the regex-pattern sub-project alias is
        removed outright. Declared `projects:` config (Plan 00296) is now the
        ONLY sub-project resolution mechanism — there is no fallback and no
        override. A NON-EMPTY pattern list is real usage and is a hard
        config-validation error at startup; the error message prints the
        equivalent `projects:` block, derived mechanically for every literal
        (non-wildcard) pattern. Plan 00304 (real-repo canary fix): a null or
        empty value — the shape an OLDER daemon version's own default config
        template writes, with nothing actually configured — is now tolerated
        silently (an advisory log line only, no degraded mode) rather than
        hard-erroring on a key nobody set.
      migration_note: >-
        If your `monorepo_subproject_patterns` is null, empty, or absent: no
        action needed — it is auto-cleaned and never blocks startup. If it
        lists real patterns, load the daemon once and read the printed error
        — it is a paste-ready `projects:` block for every literal pattern. A
        pattern containing a regex wildcard (e.g. `packages/[^/]+`) cannot be
        auto-named: declare each real sub-project directory by hand as its
        own `projects:` entry. Staying on an older (pre-3.58.0) daemon
        version is the backward-compat path for real usage — there is no
        other way to keep the old alias working.
  changed:
    - key: plan_workflow.directory
      description: >-
        Plan 00303 owner ruling (zero absolute paths in config): now
        repository-relative only, reusing the same validator as
        `projects[].root` (Plan 00296). An absolute or home-relative value is
        a hard config-validation error at load. A trailing slash / leading
        `./` is normalised away (e.g. `plans/` -> `plans`).
      recommended: false
      migration_note: >-
        No action needed for the default (`CLAUDE/Plan`) or any existing
        relative value beyond the cosmetic trailing-slash normalisation. If
        your config sets an absolute `plan_workflow.directory`, change it to
        a path relative to the repository root.
    - key: plan_workflow.workflow_docs
      description: >-
        Plan 00303: same repository-relative rule and normalisation as
        `plan_workflow.directory` above -- same validator, same reason.
      recommended: false
      migration_note: >-
        No action needed unless the value is absolute; change it to a
        repository-root-relative path.
    - key: documentation.trees.agent
      description: >-
        Plan 00303: the agent-facing documentation tree root is now
        repository-relative only, same validator as `projects[].root`.
      recommended: false
      migration_note: >-
        No action needed for the default (`CLAUDE`) or an existing relative
        value; change an absolute value to a repository-relative path.
    - key: documentation.trees.human
      description: >-
        Plan 00303: same repository-relative rule as
        `documentation.trees.agent` above.
      recommended: false
      migration_note: >-
        No action needed for the default (`docs`) or an existing relative
        value; change an absolute value to a repository-relative path.
    - key: handlers.pre_tool_use.sensitive_content.options.secret_word_list_path
      description: >-
        Plan 00303: an absolute or home-relative value is no longer used
        verbatim. This surface's contract stays fail-open/advisory (matching
        its existing "missing file = no match" behaviour), so a rejected
        value is LOGGED and treated as unset -- the built-in default
        (`.claude/block-words.secret`, repository-relative) is used instead
        -- rather than raised as a hard error.
      recommended: false
      migration_note: >-
        No action needed for the default or an existing relative value.
        Change an absolute `secret_word_list_path` to a repository-relative
        path; if you relied on an absolute override, it is now silently
        ignored (check the daemon log for the warning) and the default
        applies -- verify that is not a behaviour change you needed.
    - key: daemon.payload_capture.dir
      description: >-
        Plan 00303: same fail-open degrade as `secret_word_list_path` above.
        An absolute `payload_capture.dir` is logged and treated as unset (the
        `<untracked>/payload-capture` default is used); a relative value is
        now explicitly joined against the daemon's untracked dir rather than
        left ambiguous.
      recommended: false
      migration_note: >-
        No action needed for the default or an existing relative value.
        Change an absolute override to a path relative to the daemon's
        untracked dir; if you relied on the absolute override, it is now
        silently ignored (check the daemon log) and the default applies.
    - key: handlers.session_start.model_fallback_detector.options.snapshot_dir
      description: >-
        Plan 00303: same fail-open degrade as `payload_capture.dir` above.
        An absolute `snapshot_dir` is logged and treated as unset (the
        built-in default, `untracked/reports`, is used instead).
      recommended: false
      migration_note: >-
        No action needed for the default or an existing relative value.
        Change an absolute override to a repository-relative path; if you
        relied on the absolute override, it is now silently ignored (check
        the daemon log) and the default applies.
    - key: handlers.pre_tool_use.tdd_enforcement.options.test_path_map
      description: >-
        Plan 00300 hard cutover: a relative `test_dir` entry now anchors
        against the source file's DECLARED WORKSPACE ONLY (via `projects:`,
        Plan 00296) — the extra project-root-anchored candidate that used to
        be searched second is gone. In a single-project repo (no `projects:`
        declared, or the file is outside every declared root) the workspace
        IS the repository root, so zero-config behaviour is byte-identical.
        Only a project that BOTH declares `projects:` AND relies on the
        project-root candidate being searched as a second location is
        affected.
      recommended: false
      migration_note: >-
        No action needed unless your project declares `projects:` AND has a
        `test_path_map` entry whose test file happened to live at the
        project-root-anchored path rather than the workspace-anchored one.
        Move the test file to `{declared project root}/{test_dir}/`, or split
        the `test_path_map` entry into one per declared project with its own
        `test_dir`.
