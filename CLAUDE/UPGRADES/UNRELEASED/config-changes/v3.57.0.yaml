version: "3.57.0"
date: "UNRELEASED"
breaking: false
config_changes:
  added:
    - key: handlers.user_prompt_submit.standing_authorisations.options.prompt_interval
      recommended: false
      dormant: false
      description: >-
        NEW cadence tunable (Plan 00283), default 5. standing_authorisations no
        longer injects the short-form authorisation text on EVERY prompt; it now
        delivers the FULL text once per session to establish it, then reinforces
        only on whichever comes first: this many HUMAN prompts, or
        interval_minutes elapsed since the last delivery. Automated turns
        (failsafe-recovery cron ticks, goal-injection lines, and the handler's
        own supervisor-typed reinforcement) neither advance the counter nor earn
        a reinforcement, so the reminder no longer rides every hourly cron tick.
      migration_note: >-
        No action needed. Lower it for more frequent reinforcement, raise it for
        less. The old every-prompt behaviour is intentionally gone (it was
        noisy); the bounded silence between reinforcements is at most this many
        prompts or interval_minutes.
    - key: handlers.user_prompt_submit.standing_authorisations.options.interval_minutes
      recommended: false
      dormant: false
      description: >-
        NEW cadence tunable (Plan 00283), default 15. The time half of the
        reinforcement trigger: a reinforcement is due once this many minutes have
        elapsed since the last delivery, even if prompt_interval has not been
        reached. Evaluated at each prompt (the handler runs only on
        UserPromptSubmit), so an idle session reinforces at most once per this
        window, on its next prompt.
      migration_note: >-
        No action needed. Works together with prompt_interval (whichever fires
        first).
    - key: handlers.user_prompt_submit.standing_authorisations.options.supervisor_channel_enabled
      recommended: false
      dormant: true
      description: >-
        NEW opt-in channel (Plan 00283), default FALSE. When enabled AND a ccy
        PTY supervisor is armed and live for the project, a due reinforcement is
        written as a <session>.standing-auth-intent signal that the supervisor
        types as a REAL user-role line (a stronger channel than folded
        hook-additional-context), guarded by a fail-closed verbatim machine-origin
        header so a forged signal cannot smuggle arbitrary text into a typed line.
        When off, or when no supervisor is armed, or on any failure, it FAILS OPEN
        to the existing folded hook-context — identical to the default behaviour.
        The first (establishing) delivery of a session is always hook-context.
      migration_note: >-
        Deliberately NOT promoted. Leave it OFF unless the DEPLOYED supervisor
        already supports the *.standing-auth-intent signal: a running supervisor
        only learns to consume it on a ccy RELAUNCH (not a daemon restart), so
        enabling it against an older supervisor would route reinforcements to a
        signal nothing reads and silently drop them. Enable it only after the
        supervisor has been redeployed and relaunched.
    - key: documentation.enabled
      recommended: true
      dormant: true
      description: >-
        NEW opt-in documentation-SSoT enforcement system (Plan 00284), default
        FALSE. When enabled, three surfaces keep a project's documentation
        corpus honest against a one-canonical-home-per-fact ruleset
        (CLAUDE/DocumentationStrategy.md): a PreToolUse edit-time lint
        (docs_qa_edit), a git-commit gate (docs_qa_commit_gate) and a
        SessionStart drift sweep (docs_qa_sweep), sharing one check catalogue —
        dead pointers, ssot-quote drift, pointer-only rules-file shape,
        hand-edited generated docs, at-import census, module-doc budgets, and
        advisory duplicate-block detection. The `hooks-daemon docs-qa` CLI
        (--sweep / --lint / --check-staged) always works regardless of this
        switch. Policy lives under documentation.qa (modes default to
        warn/advise; block is a per-check ratchet via check_modes); the two
        audience-tree names are configurable under documentation.trees.
      migration_note: >-
        Opt in deliberately: enable it, run `hooks-daemon docs-qa --sweep`,
        triage the initial findings (grandfather_allowlist exists for legacy
        docs), and only then consider promoting individual checks to block
        mode. Everything ships warn-first, so enabling is safe — it adds
        advisory context, not denials.
    - key: agents.docs_qa.enabled
      recommended: true
      dormant: true
      description: >-
        NEW opt-in deployable agent (Plan 00284), default FALSE. When enabled,
        `hooks-daemon agents install hooks-daemon-docs-qa` deploys a read-only
        documentation-SSoT auditor agent to .claude/agents/: it hunts the
        semantic half the deterministic checks cannot see — conflicting truths,
        paraphrase duplicates, stale derived facts, and verbose source-comment
        blocks acting as documentation — and reports file:line findings with
        remediations, never editing. A companion `docs-qa` skill (deployed with
        the daemon's skills) is the dispatch shim for it.
      migration_note: >-
        Pairs naturally with documentation.enabled — the agent leans on the
        deterministic `docs-qa` CLI output first and spends its judgement on
        what those checks cannot decide. Its first run doubles as a migration
        worklist for the project's existing doc drift.
