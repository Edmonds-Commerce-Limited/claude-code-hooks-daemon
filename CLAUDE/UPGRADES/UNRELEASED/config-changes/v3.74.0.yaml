version: "3.74.0"
date: "UNRELEASED"

breaking: false

config_changes:
  added:
    - key: branches.home
      description: >-
        Branches a main checkout lives on (list of names). The daemon writes
        and commits the CLAUDE.md block only while HEAD is attached to one of
        them. Empty (the default) means the repository's default branch; a
        configured list replaces that default. Set it when a checkout sits on
        an environment, release or production branch.
