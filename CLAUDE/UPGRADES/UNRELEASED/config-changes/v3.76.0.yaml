# Drafted by Plan 00619.
version: "3.76.0"
date: "UNRELEASED"

breaking: false

config_changes:
  added:
    - key: handlers.pre_tool_use.branch_reject_dispatch_gate
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00620). Admits a dispatch of the branch-reject reviewer agent
        only with the exact prompt `hooks-daemon branch-reject request` printed,
        once per nonce, on Opus or above, as a fresh agent of the shipped
        definition, and records the dispatch. Denies the reviewer type with any
        other prompt and a review prompt under any other type. Enabled by
        default; disabling it fails closed (no reviewer verdict can then unlock
        a removal).
      example_yaml: |
        handlers:
          pre_tool_use:
            branch_reject_dispatch_gate:
              enabled: true
              priority: 59
      migration_note: >-
        Keep it at priority 59, after every handler that can deny an Agent call:
        its allow records the dispatch, so a later deny would burn the nonce.
    - key: branches.wip.ladder
      recommended: false
      dormant: false
      description: >-
        The warning percentages of the open-work pool, measured against the
        point where creating a branch is refused (branches.wip.cap plus
        wip.creation_grace). warn, strong and very_strong default to 60, 80
        and 90 and must rise in that order. A pool whose mode is warn still
        gets the ladder, worded as a limit rather than a refusal.
      example_yaml: |
        branches:
          wip:
            ladder: {warn: 60, strong: 80, very_strong: 90}
    - key: branches.parked.ladder
      recommended: false
      dormant: false
      description: >-
        The same warning percentages for the parked pool, measured against
        branches.parked.cap. Defaults 60, 80 and 90; must rise in order.
      example_yaml: |
        branches:
          parked:
            ladder: {warn: 60, strong: 80, very_strong: 90}
    - key: branches.merged.ladder
      recommended: false
      dormant: false
      description: >-
        The same warning percentages for the merged pool, measured against
        branches.merged.cap. Defaults 60, 80 and 90; must rise in order.
      example_yaml: |
        branches:
          merged:
            ladder: {warn: 60, strong: 80, very_strong: 90}
    - key: handlers.pre_tool_use.branch_pool_pressure_advisor
      recommended: true
      dormant: false
      description: >-
        Warns on tool calls as a branch pool fills; at 90 percent of its block
        point it warns on every call until the pool drops below it. Context
        only: it never denies.
      example_yaml: |
        handlers:
          pre_tool_use:
            branch_pool_pressure_advisor: {enabled: true, priority: 20}
    - key: handlers.user_prompt_submit.branch_pool_pressure_prompt
      recommended: true
      dormant: false
      description: >-
        The same branch pool warning ladder on every prompt at 90 percent.
        Context only: it never holds a prompt.
      example_yaml: |
        handlers:
          user_prompt_submit:
            branch_pool_pressure_prompt: {enabled: true, priority: 44}
