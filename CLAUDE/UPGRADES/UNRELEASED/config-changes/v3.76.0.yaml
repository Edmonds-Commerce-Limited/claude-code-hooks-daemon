# Drafted by Plan 00619.
version: "3.76.0"
date: "UNRELEASED"

breaking: false

config_changes:
  added:
    - key: branches.wip.ladder
      recommended: false
      dormant: false
      description: >-
        The warning percentages of the open-work pool, measured against the
        point where creating a branch is refused (branches.wip.cap plus
        wip.creation_grace). warn, strong and very_strong default to 60, 80
        and 90 and must rise in that order. A pool whose mode is warn still
        gets the ladder, worded as a limit rather than a refusal.
      example_yaml: |
        branches:
          wip:
            ladder: {warn: 60, strong: 80, very_strong: 90}
    - key: branches.parked.ladder
      recommended: false
      dormant: false
      description: >-
        The same warning percentages for the parked pool, measured against
        branches.parked.cap. Defaults 60, 80 and 90; must rise in order.
      example_yaml: |
        branches:
          parked:
            ladder: {warn: 60, strong: 80, very_strong: 90}
    - key: branches.merged.ladder
      recommended: false
      dormant: false
      description: >-
        The same warning percentages for the merged pool, measured against
        branches.merged.cap. Defaults 60, 80 and 90; must rise in order.
      example_yaml: |
        branches:
          merged:
            ladder: {warn: 60, strong: 80, very_strong: 90}
    - key: handlers.pre_tool_use.branch_pool_pressure_advisor
      recommended: true
      dormant: false
      description: >-
        Warns on tool calls as a branch pool fills; at 90 percent of its block
        point it warns on every call until the pool drops below it. Context
        only: it never denies.
      example_yaml: |
        handlers:
          pre_tool_use:
            branch_pool_pressure_advisor: {enabled: true, priority: 20}
    - key: handlers.user_prompt_submit.branch_pool_pressure_prompt
      recommended: true
      dormant: false
      description: >-
        The same branch pool warning ladder on every prompt at 90 percent.
        Context only: it never holds a prompt.
      example_yaml: |
        handlers:
          user_prompt_submit:
            branch_pool_pressure_prompt: {enabled: true, priority: 44}
    - key: handlers.user_prompt_submit.standing_authorisations.options.authorisations.daemon-auto-upgrade
      recommended: false
      dormant: false
      description: >-
        NEW built-in standing authorisation (Plan 00625), and the only one that
        is ON BY DEFAULT, at the daemon owner's request: with no entry for it in
        the project config, the agent is told it may upgrade the hooks daemon
        to the latest published release without asking, running the
        hooks-daemon skill's upgrade with --unattended when the session-start
        version check finds a newer release. The injected text says it is the
        shipped default, not a request the project recorded. Unattended mode
        only adds refusals: never across a MAJOR version, past READ THIS FIRST,
        while untracked/release-state.json exists, with a dirty tree, or to a
        version whose unattended attempt failed; it rolls back when the new
        daemon does not start or fails validation. Tag signatures are not
        verified.
      migration_note: >-
        This default reaches existing installs on this upgrade. To keep
        upgrades human-triggered, add {id: daemon-auto-upgrade, enabled: false}
        to the authorisations list. Every upgrade and provision sync also now
        takes an upgrade lock at <git common dir>/hooks-daemon-upgrade.lock;
        nothing to configure.
      example_yaml: |
        handlers:
          user_prompt_submit:
            standing_authorisations:
              options:
                authorisations:
                  - id: daemon-auto-upgrade
                    enabled: false
