# Drafted by Plan 00554. The VERSION in the filename and the `version:` key are
# a target, not a decision; the release agent confirms or renames this file.
version: "3.72.0"
date: "UNRELEASED"

breaking: false

config_changes:
  changed:
    - key: daemon.transport.relay_enabled
      recommended: false
      dormant: false
      description: >-
        The model default is now true (it was false), so the Rust relay is the
        default hook transport. A config with no `relay_enabled` key follows the
        new default, including a partial `transport` block that names only
        `nc_enabled`. An explicit `false` or `null` is kept. The legacy
        bash and python3 transport is the opt-in.
      migration_note: >-
        To keep the legacy transport set `daemon.transport.relay_enabled: false`
        or run `bin/hooks-daemon transport off`.
    - key: daemon.transport.relay_source
      recommended: false
      dormant: false
      description: >-
        The model default is now `auto` (it was `null`): install and upgrade
        build the relay when a musl rustc is present and otherwise download it.
        Provisioning failure never aborts the install; the forwarder falls back
        to the legacy transport until a binary is present.
      migration_note: >-
        Set `relay_source: null` to stop install and upgrade provisioning the
        binary.
