# Drafted by Plan 00554. The VERSION in the filename and the `version:` key are
# a target, not a decision; the release agent confirms or renames this file.
version: "3.72.0"
date: "UNRELEASED"

breaking: false

config_changes:
  added:
    # Plan 00558: the top-level `branches:` block (branch WIP limit and hygiene).
    - key: branches.integration_lines
      recommended: true
      dormant: false
      description: >-
        Globs naming integration lines (e.g. `release/*`, `epic/*`): merge
        targets that are never counted toward the WIP cap and never deleted
        remotely by an agent. A project with release branches must declare
        them before the branch guards fire, or they are counted as work.
      example_yaml: |
        branches:
          integration_lines: ["release/*"]
    - key: branches.exempt
      recommended: true
      dormant: false
      description: >-
        Globs naming branches never counted, judged or deleted by an agent
        (human-owned branches such as `users/*`, or `gh-pages`). Declare them
        before the branch guards fire.
      example_yaml: |
        branches:
          exempt: ["users/*", "gh-pages"]
    - key: branches.dormancy.preset
      dormant: false
      description: >-
        Dormancy stages for an idle unmerged branch. `standard` (the default)
        advises at 7 days, repeats in every session at 14 and blocks new
        branches at 30; `strict` warns from 3 days and blocks at 7.
        `advisory_days`, `noisy_days` and `block_days` override one stage each.
    - key: branches.default
      description: >-
        The default branch: `auto` (origin/HEAD, then local main, then master)
        or a name. `delete-branch --protected-ref` and `worktree-reap
        --base-branch` now default to it.
    - key: branches.remote
      description: The remote whose refs count and whose deletes are judged (default origin).
    - key: branches.protected_names
      description: >-
        Branch names no delete command removes (default main, master, develop,
        trunk); the resolved default branch is always added.
    - key: branches.wip
      description: >-
        The repository-wide cap on open work branches (`cap` 10, `mode` block,
        `count_remote` true).
    - key: branches.duplicates
      description: The duplicate-stem warning on a new branch name (`mode` warn).
    - key: branches.stop_guard
      description: The Stop and SubagentStop guard over touched branches.
    - key: branches.force_removal
      description: >-
        Lossless `worktree remove [--force]` and `branch -D` (`mode` block | off).
        `off` trusts only remote-tracking refs for a forced branch delete and
        leaves worktree removal unjudged.
    - key: branches.evacuation
      description: >-
        The evacuate-then-destroy shape (`mode` block | warn | off): one command
        that writes a worktree's or branch's work to an untracked file and then
        destroys that worktree or branch.
    - key: branches.cleanup_after_merge
      description: What happens to a work branch once merged (`mode` advise).
    - key: branches.cleanup_after_merge.regenerable
      description: >-
        Worktree-relative globs naming the ignored stores `branch-sweep --clean`
        may lose when it removes a linked worktree, read by `branch-sweep --clean`
        and the WorktreeRemove cleanup (venvs, QA output, caches, logs,
        `untracked/repair.log`/`repair.txt`, `untracked/.python-cmd-cache`,
        `untracked/context-sidecar/`, `untracked/acceptance/`, `.coverage`,
        `.CLAUDE.md.pre-inject`, `.claude/hooks-daemon/`, `*.egg-info/`). Any
        other ignored path blocks the removal; an empty directory never does, and
        a `store/` glob also covers a symlink of that name. `untracked/scratch/`
        with any file in it always blocks: a list covering it fails the config load.
    - key: branches.sweep
      description: >-
        The inventory pass's wall-clock `budget_ms` (3000) and the
        `behind_threshold` (50) at which a branch is reported far behind.
    - key: handlers.post_tool_use.cleanup_after_merge
      description: >-
        The PostToolUse handler that, after a `git merge` into the default
        branch or an integration line, deletes or advises deleting the merged
        local branch per `branches.cleanup_after_merge.mode` (priority 39;
        `mode` defaults to advise).
    - key: handlers.pre_tool_use.branch_creation_guard
      description: >-
        The PreToolUse handler that denies a git command or an isolated Agent
        dispatch creating a branch while the open work branches are at
        `branches.wip.cap` (`wip.mode` warn only warns), and warns when the new
        name looks like an existing branch's work (`branches.duplicates.mode`).
        WorktreeCreate applies the same verdict before its `worktree add`
        (priority 40).
    - key: handlers.post_tool_use.branch_touch_recorder
      description: >-
        The PostToolUse handler that writes a new branch's creator record
        (`branch.<name>.hooksDaemonCreator`, `hooksDaemonCreated`,
        `hooksDaemonRoute`) and adds each session and agent that changes a
        branch to its `hooksDaemonTouchedBy` record, in git config
        (priority 40).
    - key: handlers.stop.branch_stop_guard
      description: >-
        The Stop handler that denies a stop (at most three times) leaving a
        dirty worktree, commits no remote holds, or a merged branch not deleted,
        and adds an hourly line naming branches at the noisy dormancy stage
        (priority 9; `branches.stop_guard.mode`).
    - key: handlers.subagent_stop.branch_subagent_stop_guard
      description: >-
        The SubagentStop twin of `branch_stop_guard`, judging the branches the
        sub-agent touched; `branches.stop_guard.unpushed_subagent` sets how its
        unpushed commits are treated (priority 12).

  renamed:
    - old_key: handlers.session_start.branch_count_advisor.options.max_open_branches
      new_key: branches.wip.cap
      migration_note: >-
        The old option is still read while `branches.wip.cap` is unset; move
        the value to `branches.wip.cap`.
    - old_key: handlers.session_start.branch_count_advisor.options.behind_main_threshold
      new_key: branches.sweep.behind_threshold
      migration_note: >-
        The old option is still read while `branches.sweep.behind_threshold`
        is unset; move the value to `branches.sweep.behind_threshold`.

  changed:
    - key: daemon.transport.relay_enabled
      recommended: false
      dormant: false
      description: >-
        The model default is now true on hosts that can run the static relay
        (Linux x86_64 and aarch64) and false elsewhere (it was false everywhere),
        so the Rust relay is the default hook transport where it can run. A
        config with no `relay_enabled` key follows the new default, including a
        partial `transport` block that names only `nc_enabled`. An explicit
        `false` is kept; an explicit `null` is rejected as invalid config. The
        legacy bash and python3 transport is the opt-in.
      migration_note: >-
        To keep the legacy transport set `daemon.transport.relay_enabled: false`
        or run `bin/hooks-daemon transport off`.
    - key: daemon.transport.relay_source
      recommended: false
      dormant: false
      description: >-
        The model default is now `auto` (it was `null`): install and upgrade
        build the relay when a musl rustc is present and otherwise download it.
        Provisioning failure never aborts the install; the forwarder falls back
        to the legacy transport until a binary is present.
      migration_note: >-
        Set `relay_source: null` to stop install and upgrade provisioning the
        binary.
    - key: handlers.session_start.branch_count_advisor
      recommended: false
      dormant: false
      description: >-
        Replaced by the `branch_sweep` SessionStart handler, which summarises the
        branch inventory: branches whose commits no remote ref holds (every
        session start), merged branches not yet deleted, dormant branches and the
        open-work count against `branches.wip.cap` (new sessions). It counts
        every non-exempt branch, not only `worktree-*` and `agent-*`, and is
        silent when there is nothing to report. The old key is an alias: an
        existing `enabled: false` still silences the new summary, and its
        `max_open_branches` / `behind_main_threshold` options are read for one
        release while the `branches.*` keys are unset.
      migration_note: >-
        Rename the key to `handlers.session_start.branch_sweep` and move the two
        options to `branches.wip.cap` and `branches.sweep.behind_threshold`;
        while they stay, the summary prints a deprecation line. Run
        `bin/hooks-daemon branch-sweep` for the full report.
