# Drafted by Plan 00620 (branches.reject, branch_reject_* handlers), Plan 00627 (scratch), Plan 00594 (branches.wip.stack_max_depth), Plan 00631 (team_seat) and Plan 00636 (owner_wait_stop_guard).
version: "3.77.0"
date: "UNRELEASED"

breaking: false

config_changes:
  added:
    - key: branches.reject
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00620). The no-value removal route of delete-branch: how long
        a reviewer verdict stays valid, the rolling window removals are counted
        over, the counts after which two reviewers are required and after which
        the route refuses, and where the removal ledger, recovery bundles and
        review state live. The defaults need no change.
      example_yaml: |
        branches:
          reject:
            verdict_lifetime_hours: 24
            window_days: 7
            two_reviewer_after: 3
            refuse_after: 10
            ledger_path: .claude/branch-removals.jsonl
            bundle_dir: untracked/branch-rejects
            state_dir: untracked/branch-reject-state
    - key: handlers.pre_tool_use.branch_reject_dispatch_gate
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00620). Admits a dispatch of the branch-reject reviewer agent
        only with the exact prompt `hooks-daemon branch-reject request` printed,
        once per nonce, on Opus or above, as a fresh agent of the shipped
        definition, and records the dispatch. Denies the reviewer type with any
        other prompt and a review prompt under any other type. Enabled by
        default; disabling it fails closed (no reviewer verdict can then unlock
        a removal).
      example_yaml: |
        handlers:
          pre_tool_use:
            branch_reject_dispatch_gate:
              enabled: true
              priority: 59
      migration_note: >-
        Keep it at priority 59, after every handler that can deny an Agent call:
        its allow records the dispatch, so a later deny would burn the nonce.
    - key: handlers.post_tool_use.branch_reject_agent_binder
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00620). Silent PostToolUse sensor: fills the agent id of a
        branch-reject reviewer dispatch record from the Agent call's agentId,
        only when the record is unbound and the session and tool_use_id match.
        Never blocks. Disabling it fails closed (an unbound dispatch chains no
        verdict, so no removal can be unlocked).
      example_yaml: |
        handlers:
          post_tool_use:
            branch_reject_agent_binder:
              enabled: true
              priority: 33
    - key: handlers.subagent_stop.branch_reject_verdict_recorder
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00620). Silent SubagentStop sensor: turns the branch-reject
        reviewer's final, clean stop into a verdict (and a keep record on keep).
        A second stop of the same review, or a stop-hook re-entry, withdraws the
        verdict. Never blocks. Disabling it fails closed (no verdict is recorded,
        so no removal can be unlocked).
      example_yaml: |
        handlers:
          subagent_stop:
            branch_reject_verdict_recorder:
              enabled: true
              priority: 13
      migration_note: >-
        Keep it below the terminal subagent_report_size_blocker (15); a handler
        after a terminal one never runs.
    - key: branches.wip.stack_max_depth
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00594 Task 4.6). A stack of dependent branches (each tip a
        strict ancestor of the next, local or remote-tracking) counts 1 against
        branches.wip.cap up to this many links; each link past it counts 1
        more. Default 5, minimum 1. A fork ends the chain; parked, merged,
        park-carried and foreign branches never join a stack.
      example_yaml: |
        branches:
          wip:
            stack_max_depth: 5
    - key: scratch
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00627). The scratch management block: TTLs, the sweep's
        listing bound, archive retention, the keep bound, the filing size
        limit and the caps. `hooks-daemon scratch-sweep` reports by default
        and, with --apply behind a human's typed confirmation at a terminal,
        archives then removes due entries; the caps guard writes into
        scratch. Each sub-key has its own entry below.
      example_yaml: |
        scratch:
          untracked_ttl:
            repos: "*"
            scratch: 24h
          untracked_default_ttl: "*"
          max_ttl_hours: 72
          max_lifetime_hours: 168
          min_age_minutes: 30
          sweep: {max_listed: 50, unowned_entry: advise}
    - key: scratch.untracked_ttl
      recommended: false
      dormant: false
      description: >-
        TTL per directory directly under untracked/: "<N>h", "<N>d" or "*"
        (never cleared; quote it, unquoted * is YAML alias syntax). Merged over
        the built-ins repos: "*" and scratch: 24h. A malformed value never
        stops the config loading and is never read as "*": it falls back to
        that key's built-in default with a logged warning. untracked/repos,
        every reference_repos root and the archive store are never swept,
        whatever this map says.
      example_yaml: |
        scratch:
          untracked_ttl:
            scratch: 7d
            briefs: 36h
    - key: scratch.untracked_default_ttl
      recommended: false
      dormant: false
      description: >-
        TTL of an untracked/ directory the map does not name. Default "*"
        (never swept): in self-install mode the daemon's own runtime stores
        (venvs, logs, worktrees) live directly under untracked/, so a finite
        default would make each of them a sweep root. Set it only when every
        unnamed untracked/ directory is agent-written and disposable.
      example_yaml: |
        scratch:
          untracked_default_ttl: 36h
    - key: scratch.caps
      recommended: false
      dormant: false
      description: >-
        Size limits on untracked/scratch/ that warn, then block, before the
        link index overflows: directories (10000/25000), bytes (1 GiB/4 GiB),
        entries (500/2000), project_directories as a percentage of the link
        index's directory cap (50/75), pressure_idle_minutes (30) and mode
        (block, advise or off; default block). warn must be below block.
        Past a block figure, a command creating a directory tree under
        scratch is denied as R-SCRATCH-CAP; a file write never is.
      example_yaml: |
        scratch:
          caps:
            entries:
              warn: 300
              block: 1000
            mode: advise
    - key: scratch.sweep.unowned_entry
      recommended: false
      dormant: false
      description: >-
        What happens when a new file or directory is made directly in a
        scratch root rather than inside a session directory: advise
        (default), block or off.
      example_yaml: |
        scratch:
          sweep:
            unowned_entry: block
    - key: scratch.archive
      recommended: false
      dormant: false
      description: >-
        How long `scratch-sweep --apply` holds a packed entry in the archive
        store before it expires, by verdict: disposable_hours (12) and
        uncertain_hours (168). `scratch-sweep restore ID` brings one back
        while it is held.
      example_yaml: |
        scratch:
          archive:
            uncertain_hours: 336
    - key: scratch.keep
      recommended: false
      dormant: false
      description: >-
        Bounds on `scratch-sweep keep ID --reason R`: max_hours (168), the
        longest one keep may last, and max_keeps (4), how many keeps one
        archive may carry.
      example_yaml: |
        scratch:
          keep:
            max_hours: 72
    - key: scratch.filing
      recommended: false
      dormant: false
      description: >-
        max_bytes (262144): the largest file the sweep proposes filing into
        tracked history; a larger one is never proposed.
      example_yaml: |
        scratch:
          filing:
            max_bytes: 65536
    - key: team_seat
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00631). The teamchat role probe: detection (auto runs the
        kit's whoami when the session carries TEAMCHAT_RUNTIME; off never runs
        it and reads every session as in no team) and resolve_ttl_seconds
        (60, 1 to 3600; a role change takes effect within one TTL). A session
        outside a teamchat team is unaffected either way; the defaults need no
        change.
      example_yaml: |
        team_seat:
          detection: auto
          resolve_ttl_seconds: 60
    - key: handlers.stop.owner_wait_stop_guard
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00636). Refuses a coordinator seat's stop that waits on a
        human until every open owner-facing thread the seat asked or owns got
        a notifying bus post from it, with a real body, within window_minutes.
        Applies only per team where the role probe says this seat is
        coordinator; a worker, an unknown role or no team is untouched. A
        re-entered stop is always allowed. Never terminal.
      example_yaml: |
        handlers:
          stop:
            owner_wait_stop_guard:
              enabled: true
              priority: 3
      migration_note: >-
        Keep it at priority 3, before auto_continue_stop (the terminal Stop
        handler) so it is not shadowed.
    - key: handlers.stop.owner_wait_stop_guard.options.window_minutes
      recommended: false
      dormant: false
      description: >-
        window_minutes (30, integer 1 to 1440): a notifying post older than
        this does not count. An invalid value falls back to 30 with a WARNING.
      example_yaml: |
        handlers:
          stop:
            owner_wait_stop_guard:
              options:
                window_minutes: 30
    - key: handlers.stop.owner_wait_stop_guard.options.on_unreadable_bus
      recommended: false
      dormant: false
      description: >-
        on_unreadable_bus (auto | refuse | allow, default auto): what a
        waiting coordinator stop gets when the bus cannot confirm the
        notifying posts. auto refuses once (saying why) where the adapter
        reports the notify flag and thread relation readable, and otherwise
        allows with an advisory naming the team and the unchecked thread
        classes. On pingbus v1 the adapter cannot read the notify flag, so
        auto allows with the advisory, which costs one extra continue turn
        per waiting coordinator stop. refuse always refuses an unconfirmed
        wait once (on v1, every waiting coordinator stop); allow fails open
        with a WARNING. An invalid value falls back to auto, with a WARNING.
      example_yaml: |
        handlers:
          stop:
            owner_wait_stop_guard:
              options:
                on_unreadable_bus: auto
  removed:
    - key: handlers.user_prompt_submit.idle_housekeeping_advisory.options.stale_scratch_days
      description: >-
        RETIRED (Plan 00627). The idle housekeeping advisory no longer walks
        untracked/scratch/ for files older than N days and no longer prints a
        `find ... -delete`: removal on age alone is gone. It now reads the
        scratch sweep's cached inventory and names the entries due by verdict
        with the `scratch-sweep` dry run. The option is no longer read or
        validated.
      migration_note: >-
        Delete the key. How long scratch may sit is now scratch.untracked_ttl
        (scratch: 24h by default); report_stale_scratch still turns the
        section off.
