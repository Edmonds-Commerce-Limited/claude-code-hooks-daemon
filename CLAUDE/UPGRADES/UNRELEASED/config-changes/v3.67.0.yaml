# Drafted by Plan 00461. The VERSION in the filename and the `version:` key are
# a target, not a decision — releases are human-gated in this project, and the
# release agent confirms or renames this file. Only the content is asserted here.
version: "3.67.0"
date: "UNRELEASED"

breaking: false

config_changes:
  added:
    - key: handlers.pre_tool_use.plan_journal_guard
      description: >-
        Denies a plan journal entry written by hand. `mkplan.bash --journal
        <plan-number> <category> <body-file>` reads the real UTC clock and
        writes the entry heading itself; hand-typed stamps have landed 40
        minutes in the future, and an append-only journal cannot correct one
        until the clock passes it. Denied, in every checkout including git
        worktrees: an Edit/Write that adds any line to a JOURNAL/ day-file or
        creates one, and a Bash command that writes into one by any route
        (redirect, tee, heredoc, cp/mv/install/dd/ln/rsync/sponge, an in-place
        editor, a patch, an interpreter program inline or on a heredoc or
        behind a wrapper, or a name the shell builds at run time). Allowed:
        mkplan.bash itself, git, reads, and an Edit that adds no line. The
        deny prints the exact command for that plan, with absolute paths into
        that checkout. Active only when the plan workflow and journalling are
        enabled, the journal directory keeps its default JOURNAL name, and the
        checkout's plan directory holds _JOURNAL_TEMPLATE_.md and a mkplan.bash
        that offers --journal; otherwise it is inert and logs why, once.
      example_yaml: |
        handlers:
          pre_tool_use:
            plan_journal_guard:
              enabled: true
              priority: 31
      migration_note: >-
        On by default and inert in a project without the plan workflow. Where
        it is active, write each entry body to a fresh file under
        untracked/scratch/ and append it with `mkplan.bash --journal`; update
        any agent brief that says to append with Edit and `date -u`. Disable
        with handlers.pre_tool_use.plan_journal_guard.enabled: false.
      recommended: true
      dormant: false

    - key: handlers.pre_tool_use.plan_status_snapshot
      description: >-
        Records a PLAN.md's pre-write status and the SHA-256 hash of its
        PREDICTED post-write text (applying the same Write/Edit forward)
        immediately before it lands, keyed by tool_use_id. `goal_injection`
        (PostToolUse) consumes it as ground truth in place of inferring the
        pre-write status from old_string/new_string or git HEAD, removing
        collisions a bare status value could have with a table cell or a
        plan title, and git HEAD's own lag behind an uncommitted flip.
        Sensor only: never blocks, never denies, never surfaces advisory
        text. `matches()` is gated on goal_injection's own resolved config
        state (RV6-m1/RV7-m1: the same predicate `register_all` itself
        uses to decide whether goal_injection is registered), so it only
        pays the read/parse/hash cost on a matching write when
        goal_injection is actually enabled.
      example_yaml: |
        handlers:
          pre_tool_use:
            plan_status_snapshot:
              enabled: true
              priority: 30
      migration_note: >-
        On by default (opt-out), so goal_injection users get ground-truth
        snapshots automatically. Disable with
        handlers.pre_tool_use.plan_status_snapshot.enabled: false.
      recommended: true
      dormant: false

    - key: handlers.session_start.failsafe_cron_session_advisor
      description: >-
        The failsafe recovery cron's SessionStart counterpart (Plan 00394). A
        session used to be told to create the failsafe cron only at its first
        plan write, so a session that stalled before one had no recovery net.
        At the start of every NEW session this gives the same CronList-first
        reconcile and canonical prompt as recovery_cron_advisor. Silent on a
        resumed session, when recovery_cron_advisor is disabled (its switch
        covers both), and when the failsafe cron is declared under an enabled
        persistent_crons, where persistent_cron_assertor states it instead.
      example_yaml: |
        handlers:
          session_start:
            failsafe_cron_session_advisor:
              enabled: true
              priority: 70
      migration_note: >-
        On by default, advisory only, never blocks. To turn the failsafe cron's
        advice off everywhere, disable recovery_cron_advisor; this handler
        follows it.
      recommended: true
      dormant: false

  renamed: []

  removed: []

  changed:
    # Ledger 00422 N1: the init template now ships each handler's Priority
    # constant. Documentation-only (no recommended_value): a project that set
    # its own priority chose it, and must not be told to change it.
    - key: handlers.status_line.git_repo_name.priority
      description: >-
        The init template now ships 3 (was 5), matching Priority.GIT_REPO_NAME.
        At 5 the unlisted environment_indicator (4) rendered before the
        repository name instead of after it.
      migration_note: >-
        Set 3 if your config still holds the old shipped value of 5 and you
        want the environment indicator after the repository name.
    - key: handlers.status_line.account_display.priority
      description: >-
        The init template now ships 5 (was 6), matching
        Priority.ACCOUNT_DISPLAY. Relative order is unchanged.
    - key: handlers.status_line.host_hostname.priority
      description: >-
        The init template now ships 6 (was 7), matching Priority.HOST_HOSTNAME.
        Relative order is unchanged.
    - key: handlers.pre_tool_use.security_antipattern.priority
      description: >-
        The init template now ships 14 (was 15), matching
        Priority.SECURITY_ANTIPATTERN and the band shared by sensitive_content,
        secret_file_guard and project_containment. It now runs before
        tdd_enforcement and pipe_blocker (15), so when one tool call trips
        both and the chain stops at the first deny, the security deny is the
        one reported.
    # Ledger 00466 RV6-M1/RV7-m4: goal_injection must run BEFORE
    # markdown_table_formatter in the real PostToolUse chain -- its RV5-M2
    # freshness check hashes the file it reads at Post time against a
    # PREDICTED post-image computed from the tool's OWN write, never against
    # anything a LATER handler rewrites the file into. Reversed, every write
    # whose markdown was not already mdformat's canonical form went STALE and
    # fell back to conservative inference. The other four moved only to stay
    # adjacent in the PostToolUse band; their relative order is unchanged.
    - key: handlers.post_tool_use.goal_injection.priority
      description: >-
        The init template now ships 30 (was 31), matching
        Priority.GOAL_INJECTION. Now runs BEFORE markdown_table_formatter.
      migration_note: >-
        If you set your own priorities for goal_injection and
        markdown_table_formatter, keep goal_injection's BELOW
        markdown_table_formatter's -- reversed, the formatter's rewrite of
        PLAN.md before goal_injection reads it makes every non-canonical
        write go STALE and fall back to inference.
    - key: handlers.post_tool_use.markdown_table_formatter.priority
      description: >-
        The init template now ships 31 (was 26), matching
        Priority.MARKDOWN_TABLE_FORMATTER. Now runs AFTER goal_injection.
      migration_note: >-
        If you set your own priorities for goal_injection and
        markdown_table_formatter, keep markdown_table_formatter's ABOVE
        goal_injection's -- see that key's own migration_note for why.
    - key: handlers.post_tool_use.git_hooks_executable_fixer.priority
      description: >-
        The init template now ships 26 (was 27), matching
        Priority.GIT_HOOKS_EXECUTABLE_FIXER. Relative order among the four
        PostToolUse advisories below goal_injection is unchanged.
    - key: handlers.post_tool_use.background_process_tracker.priority
      description: >-
        The init template now ships 27 (was 28), matching
        Priority.BACKGROUND_PROCESS_TRACKER. Relative order unchanged.
    - key: handlers.post_tool_use.command_hints.priority
      description: >-
        The init template now ships 28 (was 29), matching
        Priority.COMMAND_HINTS. Relative order unchanged.
    - key: handlers.post_tool_use.recovery_cron_advisor.priority
      description: >-
        The init template now ships 29 (was 30), matching
        Priority.RECOVERY_CRON_ADVISOR. Relative order unchanged.
