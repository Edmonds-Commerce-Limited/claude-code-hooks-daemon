# Drafted by Plan 00461. The VERSION in the filename and the `version:` key are
# a target, not a decision — releases are human-gated in this project, and the
# release agent confirms or renames this file. Only the content is asserted here.
version: "3.67.0"
date: "UNRELEASED"

breaking: false

config_changes:
  added:
    - key: handlers.pre_tool_use.plan_journal_guard
      description: >-
        Denies a plan journal entry written by hand. `mkplan.bash --journal
        <plan-number> <category> <body-file>` reads the real UTC clock and
        writes the entry heading itself; hand-typed stamps have landed 40
        minutes in the future, and an append-only journal cannot correct one
        until the clock passes it. Denied, in every checkout including git
        worktrees: an Edit/Write that adds any line to a JOURNAL/ day-file or
        creates one, and a Bash command that writes into one by any route
        (redirect, tee, heredoc, cp/mv/install/dd/ln/rsync/sponge, an in-place
        editor, a patch, an interpreter program inline or on a heredoc or
        behind a wrapper, or a name the shell builds at run time). Allowed:
        mkplan.bash itself, git, reads, and an Edit that adds no line. The
        deny prints the exact command for that plan, with absolute paths into
        that checkout. Active only when the plan workflow and journalling are
        enabled, the journal directory keeps its default JOURNAL name, and the
        checkout's plan directory holds _JOURNAL_TEMPLATE_.md and a mkplan.bash
        that offers --journal; otherwise it is inert and logs why, once.
      example_yaml: |
        handlers:
          pre_tool_use:
            plan_journal_guard:
              enabled: true
              priority: 31
      migration_note: >-
        On by default and inert in a project without the plan workflow. Where
        it is active, write each entry body to a fresh file under
        untracked/scratch/ and append it with `mkplan.bash --journal`; update
        any agent brief that says to append with Edit and `date -u`. Disable
        with handlers.pre_tool_use.plan_journal_guard.enabled: false.
      recommended: true
      dormant: false

    - key: handlers.pre_tool_use.upgrade_approval_guard
      description: >-
        Denies an agent action that grants or bypasses the project owner's
        one-shot upgrade approval (Plan 00376, review finding MAJOR 4). The
        pre-deploy upgrade gate's escalation path is the owner's step --
        `hooks-daemon approve-upgrade <version> --from <previous>` needs an
        interactive TTY and a typed confirmation phrase, run in the owner's
        own terminal. Denied: running `approve-upgrade` (or the standalone
        gate's own `approve` subcommand) itself; writing or touching the
        `<version>.approved` marker under an `upgrade-approvals/` directory by
        any Bash route or with Write/Edit/NotebookEdit; assigning, exporting
        or env-setting HOOKS_DAEMON_UPGRADE_HANDOFF, which impersonates the
        upgrade's Layer 1; on a command that runs an upgrade entry point,
        setting a variable that picks its interpreter, venv, flags, pass
        state, git view or code (HOOKS_DAEMON_PYTHON, HOOKS_DAEMON_VENV_PATH,
        PATH, HOSTNAME, HOOKS_DAEMON_CLONE_URL, HOOKS_DAEMON_UPGRADE_BASE_URL,
        HOOKS_DAEMON_UPGRADE_PREVIOUS_VERSION, HOOKS_DAEMON_UPGRADE_SECOND_PASS,
        UPGRADE_FLAGS, GIT_*); forging a venv's `.daemon-version`
        stamp. Never denied: reading (ls/cat/stat/grep/find -print/test -f),
        merely reading the env var, a git commit message, non-executing
        echo/printf prose, a grep search, or a quoted-delimiter heredoc body
        written to a file.
      example_yaml: |
        handlers:
          pre_tool_use:
            upgrade_approval_guard:
              enabled: true
              priority: 20
      migration_note: >-
        On by default; no project-side action needed. If this handler ever
        blocks a call, report the gate's reasons to the user and stop -- the
        owner runs `hooks-daemon approve-upgrade <version> --from <previous>`
        themselves. Disable with
        handlers.pre_tool_use.upgrade_approval_guard.enabled: false.
      recommended: true
      dormant: false

    - key: handlers.session_start.failsafe_cron_session_advisor
      description: >-
        The failsafe recovery cron's SessionStart counterpart (Plan 00394). A
        session used to be told to create the failsafe cron only at its first
        plan write, so a session that stalled before one had no recovery net.
        At the start of every NEW session this gives the same CronList-first
        reconcile and canonical prompt as recovery_cron_advisor. Silent on a
        resumed session, when recovery_cron_advisor is disabled (its switch
        covers both), and when the failsafe cron is declared under an enabled
        persistent_crons, where persistent_cron_assertor states it instead.
      example_yaml: |
        handlers:
          session_start:
            failsafe_cron_session_advisor:
              enabled: true
              priority: 70
      migration_note: >-
        On by default, advisory only, never blocks. To turn the failsafe cron's
        advice off everywhere, disable recovery_cron_advisor; this handler
        follows it.
      recommended: true
      dormant: false

  renamed: []

  removed: []

  changed:
    # Ledger 00422 N1: the init template now ships each handler's Priority
    # constant. Documentation-only (no recommended_value): a project that set
    # its own priority chose it, and must not be told to change it.
    - key: handlers.status_line.git_repo_name.priority
      description: >-
        The init template now ships 3 (was 5), matching Priority.GIT_REPO_NAME.
        At 5 the unlisted environment_indicator (4) rendered before the
        repository name instead of after it.
      migration_note: >-
        Set 3 if your config still holds the old shipped value of 5 and you
        want the environment indicator after the repository name.
    - key: handlers.status_line.account_display.priority
      description: >-
        The init template now ships 5 (was 6), matching
        Priority.ACCOUNT_DISPLAY. Relative order is unchanged.
    - key: handlers.status_line.host_hostname.priority
      description: >-
        The init template now ships 6 (was 7), matching Priority.HOST_HOSTNAME.
        Relative order is unchanged.
    - key: handlers.pre_tool_use.security_antipattern.priority
      description: >-
        The init template now ships 14 (was 15), matching
        Priority.SECURITY_ANTIPATTERN and the band shared by sensitive_content,
        secret_file_guard and project_containment. It now runs before
        tdd_enforcement and pipe_blocker (15), so when one tool call trips
        both and the chain stops at the first deny, the security deny is the
        one reported.
