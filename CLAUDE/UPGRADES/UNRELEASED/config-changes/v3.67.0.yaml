# Drafted by Plans 00461 and 00463. The VERSION in the filename and the `version:` key are
# a target, not a decision — releases are human-gated in this project, and the
# release agent confirms or renames this file. Only the content is asserted here.
version: "3.67.0"
date: "UNRELEASED"

breaking: false

config_changes:
  added:
    - key: handlers.pre_tool_use.subagent_full_qa_blocker
      description: >-
        Denies a sub-agent's full-suite QA run, so the full gate stays with the
        coordinator. Measured in this project: five whole-suite runs at once,
        one per worktree, each re-run after every fix round and run again by
        the coordinator before merging. With this handler, a sub-agent runs
        targeted QA and hands over a commit, and the coordinator runs the full
        gate once over every ready branch merged together. `scope: SUB`, so the main
        thread's own run draws nothing. Commands are parsed and resolved to the
        program they run, through wrappers, interpreters and `bash -c`, so a
        commit message, `grep` or `echo` that mentions a full-QA command is
        never denied. The deny lists the project's declared targeted commands.
      example_yaml: |
        pre_tool_use:
          subagent_full_qa_blocker:
            enabled: true
            priority: 32
            options:
              full_qa_patterns:
                - id: pytest-whole-suite
                  command: pytest
                  full_args: [tests, .]
                  bare_is_full: true
                  option_grammar: pytest
                  read_only_flags: [--collect-only]
              targeted_qa_commands:
                - "pytest <explicit test files or directories>"
      migration_note: >-
        Opt-in, and inert until you declare `full_qa_patterns`: a project's
        full-suite commands cannot be known in advance, so nothing ships by
        default. Enabled with no usable patterns, `hooks-daemon check` reports
        it as unable to fire. Worth enabling where several agents share one
        host. Declare every command that runs your whole suite, including
        wrapper scripts. Have the coordinator merge every ready branch into one
        integration worktree and run the full gate once there, before the main
        branch moves. Keep `scope` at its default, SUB: any other scope
        denies the coordinator's own run, and `check` reports it.
      recommended: false
      dormant: true
    - key: handlers.pre_tool_use.plan_journal_guard
      description: >-
        Denies a plan journal entry written by hand. `mkplan.bash --journal
        <plan-number> <category> <body-file>` reads the real UTC clock and
        writes the entry heading itself; hand-typed stamps have landed 40
        minutes in the future, and an append-only journal cannot correct one
        until the clock passes it. Denied, in every checkout including git
        worktrees: an Edit/Write that adds any line to a JOURNAL/ day-file or
        creates one, and a Bash command that writes into one by any route
        (redirect, tee, heredoc, cp/mv/install/dd/ln/rsync/sponge, an in-place
        editor, a patch, an interpreter program inline or on a heredoc or
        behind a wrapper, or a name the shell builds at run time). Allowed:
        mkplan.bash itself, git, reads, and an Edit that adds no line. The
        deny prints the exact command for that plan, with absolute paths into
        that checkout. Active only when the plan workflow and journalling are
        enabled, the journal directory keeps its default JOURNAL name, and the
        checkout's plan directory holds _JOURNAL_TEMPLATE_.md and a mkplan.bash
        that offers --journal; otherwise it is inert and logs why, once.
      example_yaml: |
        handlers:
          pre_tool_use:
            plan_journal_guard:
              enabled: true
              priority: 31
      migration_note: >-
        On by default and inert in a project without the plan workflow. Where
        it is active, write each entry body to a fresh file under
        untracked/scratch/ and append it with `mkplan.bash --journal`; update
        any agent brief that says to append with Edit and `date -u`. Disable
        with handlers.pre_tool_use.plan_journal_guard.enabled: false.
      recommended: true
      dormant: false

  renamed: []

  removed: []

  changed: []
