version: "UNRELEASED"
breaking: false
config_changes:
  added: []
  renamed: []
  removed:
    - key: handlers.pre_compact.transcript_archiver
      recommended: true
      description: >-
        REMOVED (Plan 00233). This handler copied the full session transcript
        into untracked/transcripts/ before every compaction. It protected
        nothing, and the investigation that removed it established why on all
        three counts. Compaction never deletes the original transcript -- it
        shrinks the model's context, not the file on disk. The original
        already lives on the same persistent storage as the copies: Claude
        Code writes it under ~/.claude/projects/, which in a containerised
        setup is commonly a mount into the project itself, so the copy offered
        no additional durability. And nothing ever read an archive: the only
        three references in the entire codebase were a disk-usage row, a
        retention entry bounding a directory that existed solely to be
        bounded, and a line in the bug-report skill suggesting an agent could
        read them. No code parsed one, in any release.
        Left running, it accumulated real cost -- one full copy per
        compaction, and because transcripts only ever append, each archive was
        a strict PREFIX of the next. In the daemon's own repository this
        reached 422 MB of archives guarding 302 MB of originals, including
        five copies of a single session written in one day.
      migration_note: >-
        NO ACTION REQUIRED. A leftover "transcript_archiver:" block in your
        .claude/hooks-daemon.yaml is explicitly tolerated -- the daemon carries
        a registry of retired handler names, so an unedited config validates
        cleanly and will NOT put the daemon into degraded mode. Removing a
        handler is our decision, not a mistake in your config, so it must not
        be reported to you as a configuration error.
        Two optional tidy-ups when convenient: delete the
        "transcript_archiver:" block from your config, and delete
        untracked/transcripts/ to reclaim the disk. Those archives are copies
        of transcripts you still have -- deleting them loses nothing.
        One thing to know before you delete them: the archives were REDACTED
        against your secret word list, and Claude Code's original transcripts
        are NOT redacted by anything. So this removes redacted duplicates and
        leaves unredacted originals in place. That is an argument for
        attending to the originals, not for keeping duplicates of them, but
        you should know which artefact is which before you reach for rm.
  changed: []
