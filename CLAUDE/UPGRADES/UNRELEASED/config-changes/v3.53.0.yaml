version: "3.53.0"
date: "UNRELEASED"
breaking: false
config_changes:
  added:
    - key: handlers.pre_tool_use.git_message_backtick
      recommended: true
      dormant: false
      description: >-
        NEW PreToolUse blocking handler (Plan 00219). Denies an unescaped
        backtick inside a DOUBLE-quoted -m/--message value on git commit or
        git tag. Bash performs command substitution inside double quotes, so
        the backticked span is EXECUTED and its stdout replaces the text --
        and because the commit still succeeds, the loss is silent. This is
        not hypothetical: a commit in the daemon's own history lost a phrase
        from its body exactly this way, and the stray fatal: on the terminal
        read as git rejecting the commit rather than as bash running a
        command nobody asked for. Single-quoted messages, backslash-escaped
        backticks and the -F file form are never matched -- none of them
        substitutes. $(...) is deliberately NOT matched: unlike a backtick it
        has a legitimate deliberate use in a message. Ships default-ON, and
        the blocking choice is measured rather than assumed -- of 1,736
        commit messages in the daemon's own history, the 120 containing
        backticks are all evidence of SAFE authoring (a double-quoted one
        would have had the span consumed before git saw it), so the rule
        would have fired on none of them.
      migration_note: >-
        On by default; no action needed to adopt. If a commit is denied, use
        single quotes (git commit -m 'text with `backticks` stays literal')
        or a message file (git commit -F <file>). Note the EXECUTION half of
        this hazard -- a dangerous command inside the backticks -- was
        already covered by full-command-string matching in destructive_git
        and friends; this handler closes the silent-corruption half only.
        Disable with handlers.pre_tool_use.git_message_backtick.enabled:
        false.

    - key: handlers.post_tool_use.command_hints
      recommended: true
      dormant: false
      description: >-
        NEW PostToolUse advisory handler (Plan 00212). ONE handler driven by
        a config object mapping Bash command patterns to reminder text --
        not a handler per hinted command. Ships default-ON with a single
        built-in hint: running agent-browser reminds the agent to close the
        browser session when finished. A pattern only fires at the START of
        a shell segment (reusing utils/shell_segmentation.py and
        utils/command_evasion.py rather than a hand-rolled check), so it
        never fires on the configured word appearing as an unrelated
        argument (grep agent-browser notes.md) or inside a commit message,
        and it recognises path-qualified / env-prefixed invocation
        respellings. Each hint is rate-limited via a ttl_seconds cooldown
        tracked per (session_id, hint_id) in a bounded in-memory map, with
        an optional min_calls_between secondary count-based gate. Never
        blocks (terminal: false).
      migration_note: >-
        On by default with its one built-in hint active; no action needed
        to adopt. Configure handlers.post_tool_use.command_hints.options:
        options.mode is additive (default -- your options.hints list is
        appended to the built-in set, and an entry whose id matches a
        built-in one overrides it) or replace (discards the built-in set
        entirely, using only your list). Disable entirely with
        handlers.post_tool_use.command_hints.enabled: false. See
        docs/guides/HANDLER_REFERENCE.md#command_hints for the full hint
        schema.
    - key: handlers.pre_tool_use.comment_changelog
      recommended: true
      dormant: true
      description: >-
        NEW PreToolUse blocking handler (Plan 00208). Denies a Write/Edit
        whose COMMENT SPANS contain historical narrative -- a changelog
        belongs in git, in CHANGELOG.md, or in a plan's JOURNAL/, not in a
        code comment, which should describe CURRENT STATE. Two
        high-precision signals block: "Prior <version>:" /
        "Previously <version>:" phrasing, and a date-prefixed entry. Both
        were measured at ZERO false positives across this project's own
        ~1,080 source and test files before being made blocking. Four
        weaker signals were DEMOTED to advisory after that same self-scan
        caught each firing on legitimate code -- a version-transition
        arrow, a changelog verb naming a version, two or more distinct
        versioned/dated entries in one comment (options.max_history_entries,
        default 1), and retrospective phrasing -- because version-processing
        utilities legitimately cite several versions in their own
        docstrings. History as RATIONALE is deliberately NOT flagged: the
        separating test is that an entry keyed by a RELEASE NUMBER is a
        changelog, while an entry keyed by a FAILURE MODE (a plan number, a
        bug description) is the reason the code looks the way it does. Only
        comment spans are scanned, never code; .md files are skipped
        entirely; and on Edit only the ADDED text is checked, so REMOVING
        changelog content is never blocked. Deliberately has NO
        MUST_..._BECAUSE escape hatch -- changelog content should be MOVED,
        never exempted in place.
      migration_note: >-
        Ships disabled. Enable with
        handlers.pre_tool_use.comment_changelog.enabled: true. Tune with
        options.max_history_entries (advisory threshold) and options.mode
        (block | warn). Vendor, build and fixture directories are excluded
        by default; add more via options.exclude_paths or the project-wide
        daemon.exclude_paths. Expect the first enablement to surface
        existing comments -- a write-time guard does not see what is
        already on disk, so an oversized backlog is normal and is cleared
        by editing, not by disabling.
    - key: handlers.pre_tool_use.comment_size
      recommended: true
      dormant: true
      description: >-
        NEW PreToolUse blocking handler (Plan 00208). Caps over-long
        comments using the SAME grow/shrink/same-size tiering as
        plan-doc-size, with two independent limits, either of which trips
        it: a single comment line longer than options.max_comment_line_chars
        (default 400), or a contiguous comment block longer than
        options.max_comment_block_lines (default 40). The tiering is what
        makes it safe to adopt on a legacy codebase: SHRINKING an
        over-limit comment is silent and always allowed, a SAME-SIZE edit
        only advises, and only an edit that GROWS an already-over-limit
        comment is denied. So an over-commented file is never trapped --
        it stays editable and can always be refactored down. Docstrings
        and JSDoc are treated as API documentation rather than comments
        and are exempt entirely (they remain subject to
        comment_changelog).
      migration_note: >-
        Ships disabled. Enable with
        handlers.pre_tool_use.comment_size.enabled: true. Tune
        options.max_comment_line_chars, options.max_comment_block_lines and
        options.mode (block | warn). For a genuinely unavoidable long
        comment -- verbatim upstream licence text that must not be
        reflowed, say -- declare it in the content itself with a
        "MUST_EXCEED_COMMENT_SIZE_BECAUSE: <reason>" line rather than
        disabling the handler.
    - key: handlers.pre_tool_use.ancestry_preserving_merge
      recommended: true
      dormant: false
      description: >-
        NEW PreToolUse blocking handler (Plan 00207). Blocks merge
        integrations that sever ancestry: git merge --squash,
        gh pr merge --squash and gh pr merge --rebase. A squash merge
        collapses every commit into one new commit on the target, and a
        rebase merge replays them as new commits with new shas -- either
        way the branch's original commits never become ancestors of the
        target, so git branch -d (the safe, battle-tested delete) refuses
        the branch FOREVER even though its content is fully upstream. Only
        a --no-ff merge commit preserves ancestry. git merge,
        git merge --no-ff, gh pr merge --merge and a LOCAL git rebase
        <branch> stay allowed -- it is the rebase MERGE integration button
        that severs ancestry, not local rebasing. Built on the shared
        command_evasion GIT_INVOCATION grammar so git -C <path> merge
        --squash and a line-continued command cannot bypass it. Does NOT
        cover a squash/rebase merge performed through the GitHub web UI --
        the daemon sees tool calls, not browser clicks.
      migration_note: >-
        Ships enabled (block mode) by default -- no action needed to
        adopt. Mirrors git_stash: options.mode is block (default, hard
        blocks) or warn (advisory only). A MUST_SQUASH_BECAUSE="reason"
        prefix bypasses the block for platforms that mandate squash-only
        or rebase-only merging. Disable entirely with
        handlers.pre_tool_use.ancestry_preserving_merge.enabled: false.
        See docs/guides/HANDLER_REFERENCE.md#ancestry_preserving_merge.
    - key: plan_workflow.scripts
      recommended: false
      dormant: true
      description: >-
        NEW nested config seam (Plan 00213 Phase 2), adopting the
        externally-proposed planlib bash library. When
        plan_workflow.scripts.enabled is true (and plan_workflow.enabled
        is also true), the daemon deploys _planlib.inc.bash -- a sourced
        library of safety-critical primitives for plan-folder orchestrator
        scripts an OPERATOR runs from their own terminal (deploy/verify/
        triage scripts filed inside a plan folder): script-relative
        boundary-bounded repo-root resolution (fixes the
        git rev-parse --show-toplevel cwd bug -- a script run by path from
        a different checkout silently wrote its report into the WRONG
        repository and still exited zero), a tee'd run log with a
        deterministic drain (a process-substitution >(tee ...) cannot be
        waited on, so the final buffered chunk -- the lines written as the
        run died -- is lost), ssh-agent key loading, and the state-change
        gate (gates on whether a run CHANGES state, never on target name).
        Deployed through the SAME idempotent seam that deploys mkplan.bash;
        daemon-owned, overwritten on every (re)deploy. The library is
        SOURCED, never executed, so it ships 0644, not the executable 0755
        mkplan.bash gets. Independently re-verified before landing:
        bash -n with asserted-empty stderr, shellcheck -x -S style clean,
        24/24 functions cross-referenced with zero dangling/unused
        references, plus a 47-case pytest behavioural suite exercising the
        library as real bash via subprocess (root resolution incl. the
        nested-checkout boundary refusal, the change gate, leg
        mode-mismatch guards, the BASH_SUBSHELL misuse guard, ordering
        enforcement, no-TTY paths). This daemon's own repo has no
        plan-folder orchestrator scripts to run the library against -- it
        is a pure software project, not an infrastructure/ops repo -- so
        only the deployment mechanism itself is dogfooded here (mirroring
        the existing ccy.deploy_supervisor precedent), not the library's
        runtime primitives. root_marker has NO default and enabling
        without one is a config-validation error: a wrong default
        silently resolves to the wrong repository, which is exactly the
        incident class the library exists to prevent. plan_script_qa -- a
        companion QA handler enforcing that orchestrators are built on
        this library -- was proposed alongside it but deliberately NOT
        built: this repo has zero orchestrator scripts to gate, so its 16
        rules would be validated only against unit tests written from the
        same specification that produced them, with no independent signal.
      migration_note: >-
        Ships disabled, with no default root_marker (a project must
        supply one to enable). Not recommended for every project -- this
        is for a project whose CLAUDE/Plan/ folders contain operator-run
        deploy/verify/triage scripts against live infrastructure
        (Ansible, Kubernetes, bespoke ops tooling); a pure
        software-development project has nothing to point it at. Enable
        with plan_workflow.scripts.enabled: true and
        plan_workflow.scripts.root_marker: "<file marking your repo
        root>" (never .git -- that is the walk's BOUNDARY, not the
        marker). Optional: delegate (a project command runner legs call
        through), check_flag, force_color_var, scrubber,
        track_run_logs. See
        CLAUDE/Plan/00213-planlib-plan-folder-orchestrator-tooling/PLAN.md.
    - key: handlers.user_prompt_submit.standing_authorisations
      recommended: true
      dormant: true
      description: >-
        NEW UserPromptSubmit advisory handler (Plan 00223). Gives a project a
        DURABLE place to record a standing request it has genuinely made.
        Several system-prompt instructions are conditional on the user having
        asked ("do not call the Agent tool unless the user requested it"), and
        those instructions are not wrong -- the gap is that a request made in
        conversation is gone by the next session, while the restriction is
        restated on every subsequent request. This handler replays recorded
        authorisations so the condition stays satisfied. It is a filing
        cabinet, not a countermand, and that is enforced by a test: no entry's
        text may contain ignore/disregard/override/bypass, and every entry
        must attribute the request to the project and name the config key
        holding it, so it can be audited and revoked. Delivered on
        UserPromptSubmit rather than SessionStart, and that choice is measured
        rather than assumed -- against a real 37,475-record transcript
        spanning 18 compactions, SessionStart proved to be a DIFFERENT
        transport (hook_system_message, appearing zero times in
        hook_additional_context) whose full payload was delivered exactly
        ONCE, because the prevailing is_resume_session gate is a
        transcript-size heuristic that is True for every post-compaction
        session; UserPromptSubmit delivered 198 times, one per prompt. Since
        the restriction lives in a system prompt re-sent on EVERY request,
        only a per-prompt channel keeps pace -- anything delivered once loses
        on arithmetic, not on wording. Two built-in ids ship
        (subagent-delegation, workflow-orchestration) because the prompt
        carries two SEPARATE restrictions and authorising delegation says
        nothing about authorising workflow orchestration.
      migration_note: >-
        The HANDLER ships enabled but EVERY authorisation ships disabled, so
        it is completely inert until you opt in -- nothing changes on upgrade.
        That asymmetry is deliberate: every other default-on handler in this
        daemon ADDS a restriction, whereas this one relaxes one, and shipping
        that active would have the daemon fabricate the very consent its own
        injected text claims. Enabling is therefore a deliberate act by
        whoever owns the repository. To adopt, add under
        handlers.user_prompt_submit.standing_authorisations.options:
        authorisations: [{id: subagent-delegation, enabled: true}]. Remove the
        entry to withdraw the authorisation. Note this only makes a RECORDED
        request visible to the agent; it does not and cannot change what the
        agent is permitted to do.

    - key: daemon.verdict_log
      recommended: true
      dormant: false
      description: >-
        NEW config block (Plan 00209 Phase 2), shipping default-ON. The
        daemon makes hundreds of handler decisions per session and
        previously persisted NONE of them, so "which handlers earn their
        keep?" and "what is this handler's real false-positive rate?" were
        answerable only by anecdote. When enabled, every matched handler's
        decision is appended to verdicts.jsonl in the daemon's untracked
        dir -- {ts, session, event, tool, handler, verdict, rule, mode,
        overridden} -- written once in the daemon controller, so no
        per-handler opt-in is needed. Read it with the new
        `hooks-daemon verdicts` command (add --json for machine-readable
        output). Default-ON deliberately, and the distinction from
        payload_capture is the reason: this log records handler/rule/
        verdict METADATA ONLY and never tool payloads or file contents, so
        there is no privacy argument for shipping it dormant, whereas
        payload_capture DOES record raw payloads and stays default-off.
        The write is fail-open by design -- a logging failure must never
        break hook dispatch, which carries safety-critical handlers -- and
        catches only RuntimeError (no ProjectContext) and OSError
        (unwritable dir), both logged at warning level rather than
        swallowed.
      migration_note: >-
        On by default; no action needed to adopt. A new verdicts.jsonl
        will begin appearing in your daemon untracked dir after upgrade --
        this is expected, not a leak: it is metadata-only and is a BOUNDED
        ROLLING SAMPLE, capped like every other daemon JSONL log (oldest
        half trimmed at daemon.verdict_log.max_bytes), NOT a durable
        lifetime counter. The `hooks-daemon verdicts` report is explicit
        that its figures describe the retained window, so do not read them
        as lifetime totals -- a handler that fired long ago and was since
        trimmed will not appear. Tune retention with
        daemon.verdict_log.max_bytes, or turn it off entirely with
        daemon.verdict_log.enabled: false. See docs/guides/VERDICT_LOG.md.

    - key: daemon.verdict_log.record_status_events
      recommended: false
      dormant: true
      description: >-
        NEW sub-key (Plan 00234/00236), default FALSE: Status (status-line)
        renders are NOT written to verdicts.jsonl. A status handler RENDERS
        and can only ever return allow, so its records carry no information
        -- yet they arrive at the status line's refresh rate. Measured on
        this daemon's own log, 43,929 of 44,180 retained records were status
        renders (99.43%), filling the 10 MiB cap in 65 MINUTES: a log built
        to answer "which handlers earn their keep?" could see one hour of one
        session. Excluding them stretches the same cap to roughly 8 days.
        The filter is on the EVENT, not on a status-* name prefix, because
        what makes these records worthless is the event they serve -- a name
        test would both miss a renamed handler and catch an unrelated one.
        The `hooks-daemon verdicts` report was changed in step: status
        handlers are omitted from the never-fired roster (otherwise excluding
        their records would have turned 14 renderers into false "never fired"
        entries -- trading one misleading signal for another), and the
        report's caveat now also states the anti-inference rule, that "never
        fired" is NOT evidence a handler is pointless, since a guard on a
        rare catastrophic operation is SUPPOSED to sit silent.
      migration_note: >-
        No action needed. If you were relying on verdicts.jsonl to debug the
        STATUS LINE itself, set daemon.verdict_log.record_status_events: true
        to opt back in -- and expect the retained window to shrink to about
        an hour again while it is on.
  renamed: []
  removed:
    - key: handlers.pre_compact.transcript_archiver
      recommended: true
      description: >-
        REMOVED (Plan 00233). This handler copied the full session transcript
        into untracked/transcripts/ before every compaction. It protected
        nothing, and the investigation that removed it established why on all
        three counts. Compaction never deletes the original transcript -- it
        shrinks the model's context, not the file on disk. The original
        already lives on the same persistent storage as the copies: Claude
        Code writes it under ~/.claude/projects/, which in a containerised
        setup is commonly a mount into the project itself, so the copy offered
        no additional durability. And nothing ever read an archive: the only
        three references in the entire codebase were a disk-usage row, a
        retention entry bounding a directory that existed solely to be
        bounded, and a line in the bug-report skill suggesting an agent could
        read them. No code parsed one, in any release.
        Left running, it accumulated real cost -- one full copy per
        compaction, and because transcripts only ever append, each archive was
        a strict PREFIX of the next. In the daemon's own repository this
        reached 422 MB of archives guarding 302 MB of originals, including
        five copies of a single session written in one day.
      migration_note: >-
        NO ACTION REQUIRED. A leftover "transcript_archiver:" block in your
        .claude/hooks-daemon.yaml is explicitly tolerated -- the daemon carries
        a registry of retired handler names, so an unedited config validates
        cleanly and will NOT put the daemon into degraded mode. Removing a
        handler is our decision, not a mistake in your config, so it must not
        be reported to you as a configuration error.
        Two optional tidy-ups when convenient: delete the
        "transcript_archiver:" block from your config, and delete
        untracked/transcripts/ to reclaim the disk. Those archives are copies
        of transcripts you still have -- deleting them loses nothing.
        One thing to know before you delete them: the archives were REDACTED
        against your secret word list, and Claude Code's original transcripts
        are NOT redacted by anything. So this removes redacted duplicates and
        leaves unredacted originals in place. That is an argument for
        attending to the originals, not for keeping duplicates of them, but
        you should know which artefact is which before you reach for rm.
    - key: handlers.status_line.usage_tracking
      recommended: true
      description: >-
        REMOVED (Plan 00237). A status-line segment whose matches() had
        returned a hardcoded False since commit 71593163, behind a
        "DISABLED: needs architectural rework" comment, pending a rework that
        never came. It rendered nothing in any install while its config said
        enabled: true -- the daemon's own verdict log confirms it at 0 of
        44,180 retained records. Its per-model token-limit table was doubly
        stale on top of that.
      migration_note: >-
        NO ACTION REQUIRED -- nothing was being rendered, so nothing changes
        on screen. A leftover "usage_tracking:" block validates cleanly (the
        daemon carries a registry of retired handler names). Delete the block
        when convenient. Daily/weekly usage percentages remain available from
        Claude Code itself.
    - key: handlers.session_end.cleanup
      recommended: true
      description: >-
        REMOVED (Plan 00237). This SessionEnd handler deleted files from the
        daemon's untracked temp/hooks/ directory -- a directory nothing in the
        codebase has ever written, and which does not exist on disk. A reaper
        with no producer, the same shape as transcript_archiver above.
        SessionEnd remains a registered, dispatchable event; it simply ships
        no handlers today, so the "session_end:" section is now empty rather
        than absent.
      migration_note: >-
        NO ACTION REQUIRED. Nothing it deleted was ever created, so removing
        it frees no disk and loses no cleanup. Delete the "cleanup:" block
        when convenient. A project-level SessionEnd handler can still be
        registered under "session_end" in the usual way.
    - key: handlers.session_start.yolo_container_detection
      recommended: true
      description: >-
        REMOVED (Plan 00237). Its SessionStart banner was already turned OFF
        by default in Plan 00128, on the grounds that a container is surfaced
        better by the status-line icon (environment_indicator) and by
        `hooks-daemon check`. What remained was a handler whose nested
        show_on_session_start flag defaulted False INDEPENDENTLY of
        enabled: true, so it was silent in every default install. This
        completes the earlier decision rather than making a new one.
      migration_note: >-
        NO ACTION REQUIRED for a default install -- the banner was already
        off. If you had deliberately set show_on_session_start: true you lose
        that one-off banner; the status-line container icon shows the same
        thing continuously. Delete the "yolo_container_detection:" block when
        convenient.
    - key: handlers.notification.notification_logger
      recommended: true
      description: >-
        REMOVED (Plan 00237). It appended every Notification event to
        notifications.jsonl -- a file no code in the codebase has ever read
        and no documented diagnostic step ever names. A writer with no reader.
        The Stop-event log survived the same audit precisely because
        documented workflows do tell you to read it; this one had no such
        consumer in any release. Notification remains a registered,
        dispatchable event; it simply ships no handlers today, so the
        "notification:" section is now empty rather than absent.
      migration_note: >-
        NO ACTION REQUIRED. Delete the "notification_logger:" block when
        convenient, and delete notifications.jsonl from your daemon untracked
        dir to reclaim the disk -- nothing reads it. If you want an audit
        trail of handler DECISIONS, that is what daemon.verdict_log and
        `hooks-daemon verdicts` provide.
    - key: handlers.subagent_stop.subagent_completion_logger
      recommended: true
      description: >-
        REMOVED (Plan 00237). The same shape as notification_logger above: it
        appended every subagent completion to a JSONL file that nothing reads,
        growing without bound (3.4 MB live in the daemon's own repository).
        Handler-decision auditing is served instead by the verdict log, which
        has a real reader in `hooks-daemon verdicts`.
      migration_note: >-
        NO ACTION REQUIRED. Delete the "subagent_completion_logger:" block
        when convenient, and delete subagent_completions.jsonl from your
        daemon untracked dir to reclaim the disk.
    - key: handlers.post_tool_use.bash_error_detector
      recommended: true
      description: >-
        REMOVED (Plan 00237). It substring-matched seven common words --
        error, failed, failure, fatal, warning, warn, deprecated -- in the
        combined stdout+stderr of every Bash call, echoed the whole command
        back into context, and asked the agent to "review the output
        carefully to ensure the command succeeded". The output in question is
        output the agent requested one line earlier and can already see, and
        the command's real exit status is already in front of it.
        Measured rather than asserted: on the daemon's own verdict log it was
        the single most active behavioural handler at 274 fires -- 45% of ALL
        behavioural handler activity, 2.7x the next -- with allow=274. It
        never once restricted anything. Substring rather than word matching
        meant an ordinary `ls` listing a file whose NAME contains "error"
        tripped it.
      migration_note: >-
        NO ACTION REQUIRED. Nothing it did was load-bearing: it never blocked,
        and a failing command already surfaces its own exit status and stderr.
        Delete the "bash_error_detector:" block from your config when
        convenient. If you want a real signal on command failure, that is what
        the exit code and stderr are -- this handler added noise on top of
        them, not information.
    - key: handlers.pre_tool_use.task_tdd_advisor
      recommended: true
      description: >-
        REMOVED (Plan 00237). A 30-line TDD reminder injected whenever a Task
        prompt matched implement|create.*handler|build|develop|... Two
        problems, both verified in the daemon's own repository. Its stated
        references were already resident: it pointed at two documents that
        this project eagerly @-imports into CLAUDE.md, so their full text was
        in context before the handler said anything. And its final
        instruction told the agent to run a QA script that this project's own
        handler DENIES, so following the advice produced a block.
      migration_note: >-
        NO ACTION REQUIRED. Delete the "task_tdd_advisor:" block when
        convenient. If you want TDD guidance in front of the agent, put it in
        CLAUDE.md (or a .claude/rules/*.md with a paths: glob) where it is
        read once per session rather than re-injected on every matching Task
        call -- and where it is somewhere you will notice when it goes stale.
        Note tdd_enforcement, the handler that actually BLOCKS a source file
        written before its test, is unaffected and still enabled.
    - key: handlers.stop.task_completion_checker
      recommended: true
      description: >-
        REMOVED (Plan 00237). A static Stop-time checklist ("all tasks
        complete? tests passing? files committed?") with matches() == True.
        It was registered at priority 20, behind auto_continue_stop (priority
        10, terminal=True), which matches nearly every Stop event and breaks
        the handler chain the moment it matches -- so on an ordinary stop this
        handler never ran at all. Confirmed by live dispatch against the
        daemon (a Stop with a valid explanation returns an empty response) and
        corroborated by the verdict log, where it fired 3 times in the whole
        retained window. What it reminded you to do, auto_continue_stop
        actually enforces.
      migration_note: >-
        NO ACTION REQUIRED -- on an ordinary stop it was already producing
        nothing. Delete the "task_completion_checker:" block when convenient.
        Worth knowing generally: ANY Stop handler you register above priority
        10 is shadowed by auto_continue_stop in the same way. If you have
        custom Stop handlers, that is the thing to check.
    - key: handlers.subagent_stop.remind_prompt_library
      recommended: true
      description: >-
        REMOVED (Plan 00237). matches() was an unconditional True, so after
        EVERY sub-agent completion it advised running
        `npm run llm:prompts -- add --from-json <prompt-file>` and reading
        `CLAUDE/PromptLibrary/README.md`. In the daemon's own repository
        neither exists -- there is no package.json at all and no
        PromptLibrary directory -- and the handler had no existence gating of
        any kind, so every one of its 15 fires in the retained verdict window
        pointed at a command that could not be run and a file that could not
        be read. An advisory nobody re-reads decays into confidently wrong
        instructions, and nothing notices, because a WRONG advisory still
        returns allow and still looks healthy in every log.
      migration_note: >-
        NO ACTION REQUIRED unless you had actually built the prompt library it
        described -- if you did, that workflow is yours to keep and belongs in
        a project-level handler under .claude/project-handlers/subagent_stop/,
        where it sits next to the npm script it names. Delete the
        "remind_prompt_library:" block from your config when convenient. This
        empties SubagentStop, so that section is now "subagent_stop: {}"
        rather than absent -- the event stays registered and dispatchable.
    - key: handlers.user_prompt_submit.post_clear_auto_execute
      recommended: true
      description: >-
        REMOVED (Plan 00237). It injected "you have just started a fresh
        session (likely after /clear), execute the instruction immediately" on
        the first prompt of each session -- but implemented "first" with a
        single _last_session_id slot on the handler instance. Parallel
        sessions with the same (hostname, project root) deliberately SHARE one
        daemon, so two concurrent sessions flip that slot on every prompt and
        both are told they are fresh when neither is. A one-slot cache cannot
        express per-session state in a multi-session process. Its originating
        plan had already been cancelled as unachievable.
      migration_note: >-
        NO ACTION REQUIRED. Delete the "post_clear_auto_execute:" block when
        convenient. The behaviour it was reaching for -- act on the first
        instruction rather than acknowledging it -- is better served by a
        standing line in CLAUDE.md, which is resident for every session and
        cannot go stale per-session.
