version: "3.53.0"
date: "UNRELEASED"
breaking: false
config_changes:
  added:
    - key: handlers.pre_tool_use.git_message_backtick
      recommended: true
      dormant: false
      description: >-
        NEW PreToolUse blocking handler (Plan 00219). Denies an unescaped
        backtick inside a DOUBLE-quoted -m/--message value on git commit or
        git tag. Bash performs command substitution inside double quotes, so
        the backticked span is EXECUTED and its stdout replaces the text --
        and because the commit still succeeds, the loss is silent. This is
        not hypothetical: a commit in the daemon's own history lost a phrase
        from its body exactly this way, and the stray fatal: on the terminal
        read as git rejecting the commit rather than as bash running a
        command nobody asked for. Single-quoted messages, backslash-escaped
        backticks and the -F file form are never matched -- none of them
        substitutes. $(...) is deliberately NOT matched: unlike a backtick it
        has a legitimate deliberate use in a message. Ships default-ON, and
        the blocking choice is measured rather than assumed -- of 1,736
        commit messages in the daemon's own history, the 120 containing
        backticks are all evidence of SAFE authoring (a double-quoted one
        would have had the span consumed before git saw it), so the rule
        would have fired on none of them.
      migration_note: >-
        On by default; no action needed to adopt. If a commit is denied, use
        single quotes (git commit -m 'text with `backticks` stays literal')
        or a message file (git commit -F <file>). Note the EXECUTION half of
        this hazard -- a dangerous command inside the backticks -- was
        already covered by full-command-string matching in destructive_git
        and friends; this handler closes the silent-corruption half only.
        Disable with handlers.pre_tool_use.git_message_backtick.enabled:
        false.

    - key: handlers.post_tool_use.command_hints
      recommended: true
      dormant: false
      description: >-
        NEW PostToolUse advisory handler (Plan 00212). ONE handler driven by
        a config object mapping Bash command patterns to reminder text --
        not a handler per hinted command. Ships default-ON with a single
        built-in hint: running agent-browser reminds the agent to close the
        browser session when finished. A pattern only fires at the START of
        a shell segment (reusing utils/shell_segmentation.py and
        utils/command_evasion.py rather than a hand-rolled check), so it
        never fires on the configured word appearing as an unrelated
        argument (grep agent-browser notes.md) or inside a commit message,
        and it recognises path-qualified / env-prefixed invocation
        respellings. Each hint is rate-limited via a ttl_seconds cooldown
        tracked per (session_id, hint_id) in a bounded in-memory map, with
        an optional min_calls_between secondary count-based gate. Never
        blocks (terminal: false).
      migration_note: >-
        On by default with its one built-in hint active; no action needed
        to adopt. Configure handlers.post_tool_use.command_hints.options:
        options.mode is additive (default -- your options.hints list is
        appended to the built-in set, and an entry whose id matches a
        built-in one overrides it) or replace (discards the built-in set
        entirely, using only your list). Disable entirely with
        handlers.post_tool_use.command_hints.enabled: false. See
        docs/guides/HANDLER_REFERENCE.md#command_hints for the full hint
        schema.
    - key: handlers.pre_tool_use.comment_changelog
      recommended: true
      dormant: true
      description: >-
        NEW PreToolUse blocking handler (Plan 00208). Denies a Write/Edit
        whose COMMENT SPANS contain historical narrative -- a changelog
        belongs in git, in CHANGELOG.md, or in a plan's JOURNAL/, not in a
        code comment, which should describe CURRENT STATE. Two
        high-precision signals block: "Prior <version>:" /
        "Previously <version>:" phrasing, and a date-prefixed entry. Both
        were measured at ZERO false positives across this project's own
        ~1,080 source and test files before being made blocking. Four
        weaker signals were DEMOTED to advisory after that same self-scan
        caught each firing on legitimate code -- a version-transition
        arrow, a changelog verb naming a version, two or more distinct
        versioned/dated entries in one comment (options.max_history_entries,
        default 1), and retrospective phrasing -- because version-processing
        utilities legitimately cite several versions in their own
        docstrings. History as RATIONALE is deliberately NOT flagged: the
        separating test is that an entry keyed by a RELEASE NUMBER is a
        changelog, while an entry keyed by a FAILURE MODE (a plan number, a
        bug description) is the reason the code looks the way it does. Only
        comment spans are scanned, never code; .md files are skipped
        entirely; and on Edit only the ADDED text is checked, so REMOVING
        changelog content is never blocked. Deliberately has NO
        MUST_..._BECAUSE escape hatch -- changelog content should be MOVED,
        never exempted in place.
      migration_note: >-
        Ships disabled. Enable with
        handlers.pre_tool_use.comment_changelog.enabled: true. Tune with
        options.max_history_entries (advisory threshold) and options.mode
        (block | warn). Vendor, build and fixture directories are excluded
        by default; add more via options.exclude_paths or the project-wide
        daemon.exclude_paths. Expect the first enablement to surface
        existing comments -- a write-time guard does not see what is
        already on disk, so an oversized backlog is normal and is cleared
        by editing, not by disabling.
    - key: handlers.pre_tool_use.comment_size
      recommended: true
      dormant: true
      description: >-
        NEW PreToolUse blocking handler (Plan 00208). Caps over-long
        comments using the SAME grow/shrink/same-size tiering as
        plan-doc-size, with two independent limits, either of which trips
        it: a single comment line longer than options.max_comment_line_chars
        (default 400), or a contiguous comment block longer than
        options.max_comment_block_lines (default 40). The tiering is what
        makes it safe to adopt on a legacy codebase: SHRINKING an
        over-limit comment is silent and always allowed, a SAME-SIZE edit
        only advises, and only an edit that GROWS an already-over-limit
        comment is denied. So an over-commented file is never trapped --
        it stays editable and can always be refactored down. Docstrings
        and JSDoc are treated as API documentation rather than comments
        and are exempt entirely (they remain subject to
        comment_changelog).
      migration_note: >-
        Ships disabled. Enable with
        handlers.pre_tool_use.comment_size.enabled: true. Tune
        options.max_comment_line_chars, options.max_comment_block_lines and
        options.mode (block | warn). For a genuinely unavoidable long
        comment -- verbatim upstream licence text that must not be
        reflowed, say -- declare it in the content itself with a
        "MUST_EXCEED_COMMENT_SIZE_BECAUSE: <reason>" line rather than
        disabling the handler.
    - key: handlers.pre_tool_use.ancestry_preserving_merge
      recommended: true
      dormant: false
      description: >-
        NEW PreToolUse blocking handler (Plan 00207). Blocks merge
        integrations that sever ancestry: git merge --squash,
        gh pr merge --squash and gh pr merge --rebase. A squash merge
        collapses every commit into one new commit on the target, and a
        rebase merge replays them as new commits with new shas -- either
        way the branch's original commits never become ancestors of the
        target, so git branch -d (the safe, battle-tested delete) refuses
        the branch FOREVER even though its content is fully upstream. Only
        a --no-ff merge commit preserves ancestry. git merge,
        git merge --no-ff, gh pr merge --merge and a LOCAL git rebase
        <branch> stay allowed -- it is the rebase MERGE integration button
        that severs ancestry, not local rebasing. Built on the shared
        command_evasion GIT_INVOCATION grammar so git -C <path> merge
        --squash and a line-continued command cannot bypass it. Does NOT
        cover a squash/rebase merge performed through the GitHub web UI --
        the daemon sees tool calls, not browser clicks.
      migration_note: >-
        Ships enabled (block mode) by default -- no action needed to
        adopt. Mirrors git_stash: options.mode is block (default, hard
        blocks) or warn (advisory only). A MUST_SQUASH_BECAUSE="reason"
        prefix bypasses the block for platforms that mandate squash-only
        or rebase-only merging. Disable entirely with
        handlers.pre_tool_use.ancestry_preserving_merge.enabled: false.
        See docs/guides/HANDLER_REFERENCE.md#ancestry_preserving_merge.
    - key: plan_workflow.scripts
      recommended: false
      dormant: true
      description: >-
        NEW nested config seam (Plan 00213 Phase 2), adopting the
        externally-proposed planlib bash library. When
        plan_workflow.scripts.enabled is true (and plan_workflow.enabled
        is also true), the daemon deploys _planlib.inc.bash -- a sourced
        library of safety-critical primitives for plan-folder orchestrator
        scripts an OPERATOR runs from their own terminal (deploy/verify/
        triage scripts filed inside a plan folder): script-relative
        boundary-bounded repo-root resolution (fixes the
        git rev-parse --show-toplevel cwd bug -- a script run by path from
        a different checkout silently wrote its report into the WRONG
        repository and still exited zero), a tee'd run log with a
        deterministic drain (a process-substitution >(tee ...) cannot be
        waited on, so the final buffered chunk -- the lines written as the
        run died -- is lost), ssh-agent key loading, and the state-change
        gate (gates on whether a run CHANGES state, never on target name).
        Deployed through the SAME idempotent seam that deploys mkplan.bash;
        daemon-owned, overwritten on every (re)deploy. The library is
        SOURCED, never executed, so it ships 0644, not the executable 0755
        mkplan.bash gets. Independently re-verified before landing:
        bash -n with asserted-empty stderr, shellcheck -x -S style clean,
        24/24 functions cross-referenced with zero dangling/unused
        references, plus a 47-case pytest behavioural suite exercising the
        library as real bash via subprocess (root resolution incl. the
        nested-checkout boundary refusal, the change gate, leg
        mode-mismatch guards, the BASH_SUBSHELL misuse guard, ordering
        enforcement, no-TTY paths). This daemon's own repo has no
        plan-folder orchestrator scripts to run the library against -- it
        is a pure software project, not an infrastructure/ops repo -- so
        only the deployment mechanism itself is dogfooded here (mirroring
        the existing ccy.deploy_supervisor precedent), not the library's
        runtime primitives. root_marker has NO default and enabling
        without one is a config-validation error: a wrong default
        silently resolves to the wrong repository, which is exactly the
        incident class the library exists to prevent. plan_script_qa -- a
        companion QA handler enforcing that orchestrators are built on
        this library -- was proposed alongside it but deliberately NOT
        built: this repo has zero orchestrator scripts to gate, so its 16
        rules would be validated only against unit tests written from the
        same specification that produced them, with no independent signal.
      migration_note: >-
        Ships disabled, with no default root_marker (a project must
        supply one to enable). Not recommended for every project -- this
        is for a project whose CLAUDE/Plan/ folders contain operator-run
        deploy/verify/triage scripts against live infrastructure
        (Ansible, Kubernetes, bespoke ops tooling); a pure
        software-development project has nothing to point it at. Enable
        with plan_workflow.scripts.enabled: true and
        plan_workflow.scripts.root_marker: "<file marking your repo
        root>" (never .git -- that is the walk's BOUNDARY, not the
        marker). Optional: delegate (a project command runner legs call
        through), check_flag, force_color_var, scrubber,
        track_run_logs. See
        CLAUDE/Plan/00213-planlib-plan-folder-orchestrator-tooling/PLAN.md.
    - key: daemon.verdict_log
      recommended: true
      dormant: false
      description: >-
        NEW config block (Plan 00209 Phase 2), shipping default-ON. The
        daemon makes hundreds of handler decisions per session and
        previously persisted NONE of them, so "which handlers earn their
        keep?" and "what is this handler's real false-positive rate?" were
        answerable only by anecdote. When enabled, every matched handler's
        decision is appended to verdicts.jsonl in the daemon's untracked
        dir -- {ts, session, event, tool, handler, verdict, rule, mode,
        overridden} -- written once in the daemon controller, so no
        per-handler opt-in is needed. Read it with the new
        `hooks-daemon verdicts` command (add --json for machine-readable
        output). Default-ON deliberately, and the distinction from
        payload_capture is the reason: this log records handler/rule/
        verdict METADATA ONLY and never tool payloads or file contents, so
        there is no privacy argument for shipping it dormant, whereas
        payload_capture DOES record raw payloads and stays default-off.
        The write is fail-open by design -- a logging failure must never
        break hook dispatch, which carries safety-critical handlers -- and
        catches only RuntimeError (no ProjectContext) and OSError
        (unwritable dir), both logged at warning level rather than
        swallowed.
      migration_note: >-
        On by default; no action needed to adopt. A new verdicts.jsonl
        will begin appearing in your daemon untracked dir after upgrade --
        this is expected, not a leak: it is metadata-only and is a BOUNDED
        ROLLING SAMPLE, capped like every other daemon JSONL log (oldest
        half trimmed at daemon.verdict_log.max_bytes), NOT a durable
        lifetime counter. The `hooks-daemon verdicts` report is explicit
        that its figures describe the retained window, so do not read them
        as lifetime totals -- a handler that fired long ago and was since
        trimmed will not appear. Tune retention with
        daemon.verdict_log.max_bytes, or turn it off entirely with
        daemon.verdict_log.enabled: false. See docs/guides/VERDICT_LOG.md.
  renamed: []
  removed: []
  changed: []
