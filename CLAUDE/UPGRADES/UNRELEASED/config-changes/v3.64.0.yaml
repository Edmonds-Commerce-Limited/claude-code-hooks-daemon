version: "3.64.0"
date: "UNRELEASED"
breaking: false
config_changes:
  added:
    - key: handlers.session_start.lsp_noise_checker
      recommended: true
      dormant: false
      description: >-
        NEW SessionStart advisory handler (Plan 00368), ships enabled at
        priority 69, one Strategy Pattern check per supported language
        present (Python, TypeScript/JavaScript, Go, Rust, PHP -- a
        root-level toolchain marker for at least one), silent otherwise
        and on a resumed session. Claude Code injects a language server's
        diagnostics after every edit, and a stream carrying noise --
        other checkouts' half-built branches under the daemon's runtime
        directory, archived plan probes, vendored and build output, the
        vendored remote-docs tree -- trains the agent to skim it, which
        is the same as having no LSP at all. Two checks per language,
        each printing that language's exact fix: `R-LSP-CONFIG-EXCLUDE`
        when its server isn't told to exclude a tree the daemon KNOWS is
        not project code (the runtime dir, `plan_workflow.directory`, the
        reviewed vendored/build names at any depth,
        `documentation.trees.remote` -- derived, never typed), and
        `R-LSP-SERVER-STALE` when a matching language-server process
        started before that check's anchor file was last written (names
        the pid and the command that ends it; the harness respawns a
        fresh server on the next LSP use). Verified against Claude Code's
        own marketplace plugin configs, not assumed: Python/TypeScript
        read a real project exclude file; Go/Rust have no exclude list
        (Go checks module-boundary membership, Rust's fix is `Cargo.toml`
        `[workspace] exclude`); PHP (intelephense) reads no project file
        at all, so its fix is a project-scope LSP plugin override.
      example_yaml: |
        handlers:
          session_start:
            lsp_noise_checker:
              enabled: true
              priority: 69
      migration_note: >-
        On by default; no action needed to adopt. The first new session in
        a project using any supported language whose server isn't told to
        exclude the daemon's runtime directory prints that language's exact
        fix -- apply it, then end the language server as the advisory says.
        A project using none of the five supported languages never hears
        from it. Disable with
        handlers.session_start.lsp_noise_checker.enabled: false.
    - key: plan_workflow.close_requires_human_approval
      recommended: false
      dormant: true
      description: >-
        NEW boolean (Plan 00367, default false). When true, an agent's
        Write/Edit that flips a PLAN.md `**Status**:` to Complete, Cancelled
        or Superseded is denied by the `plan_close_approval` handler with a
        reason naming this key and the human's route: edit the header
        themselves outside Claude, or run
        `hooks-daemon approve-plan-close NNNNN`, which records a one-shot
        marker under the daemon's untracked directory that the very next
        terminal flip of that plan consumes. Only the flip is gated; a plan
        a human already closed stays editable. False (the default) changes
        nothing: a fully completed plan is closed by the agent that
        completed it, which is the owner's ruling -- a mandatory sign-off
        "is just going to lead to lots of plans kept open for no good
        reason". The deployed PlanWorkflow core document now says exactly
        that and cites this key as the opt-in gate, so the document and the
        daemon agree (the `unenforced-approval-gate` docs-QA check keeps
        them agreeing).
      example_yaml: |
        plan_workflow:
          enabled: true
          close_requires_human_approval: true
      migration_note: >-
        No action needed. Turn it on only if you want a human in the loop
        for every plan closure; the `plan_close_approval` handler must also
        be enabled (it ships enabled at priority 43 in a fresh config and is
        inert while the key is false).
    - key: handlers.pre_tool_use.plan_close_approval
      recommended: false
      dormant: true
      description: >-
        NEW PreToolUse blocking handler (Plan 00367), priority 43, PLANNING
        tagged. Enforces `plan_workflow.close_requires_human_approval`
        above; never matches while that key is false, so enabling the
        handler alone changes nothing.
      migration_note: >-
        Add `plan_close_approval: {enabled: true, priority: 43}` under
        `handlers.pre_tool_use` if you intend to turn the key on. A config
        without the handler is still valid.
    - key: worktree.merge_to_main_requires_human_approval
      recommended: false
      dormant: true
      description: >-
        NEW boolean (Plan 00367 Phase 4, default false). When true, a
        `git merge <branch>` (or `gh pr merge`) run in the MAIN checkout
        while it is on the default branch is denied by the
        `merge_to_main_approval` handler with a reason naming this key and
        the human's route: run `hooks-daemon approve-merge <branch>`, which
        records a one-shot marker under the daemon's untracked directory
        that the very next merge of that branch consumes. A merge run
        inside a linked worktree (child into parent) is never gated either
        way. False (the default) changes nothing: the parent-to-main merge
        happens once verification passes, which is the owner's ruling for
        plan closure applied the same way here. The deployed Worktree core
        document now describes the toggle instead of prescribing an
        unenforced "ask a human" step (the `unenforced-approval-gate`
        docs-QA check keeps them agreeing).
      example_yaml: |
        worktree:
          merge_to_main_requires_human_approval: true
      migration_note: >-
        No action needed. Turn it on only if you want a human in the loop
        for every parent-to-main merge; the `merge_to_main_approval`
        handler must also be enabled (it ships enabled at priority 20 in a
        fresh config and is inert while the key is false).
    - key: handlers.pre_tool_use.merge_to_main_approval
      recommended: false
      dormant: true
      description: >-
        NEW PreToolUse blocking handler (Plan 00367 Phase 4), priority 20,
        GIT tagged. Enforces `worktree.merge_to_main_requires_human_approval`
        above; never matches while that key is false, so enabling the
        handler alone changes nothing.
      migration_note: >-
        Add `merge_to_main_approval: {enabled: true, priority: 20}` under
        `handlers.pre_tool_use` if you intend to turn the key on. A config
        without the handler is still valid.
  renamed: []
  removed:
    - key: handlers.pre_tool_use.daemon_restart_verifier
      description: >-
        REMOVED (Plan 00370). This handler's `matches()` only ever fired
        inside the hooks-daemon repository itself, so it never did anything
        for a client project. It is now a project-level handler in the
        hooks-daemon repository's own `.claude/project-handlers/
        pre_tool_use/`, dogfooding the project-handler surface instead of
        shipping pure self-checks in the shared library. The key is
        registered in `RETIRED_HANDLERS`, so a leftover
        `daemon_restart_verifier:` entry in your config validates cleanly
        (accepted silently) rather than degrading the daemon.
      migration_note: >-
        Safe to delete this key from your config; it never mattered outside
        the hooks-daemon repository's own checkout.
  changed: []
