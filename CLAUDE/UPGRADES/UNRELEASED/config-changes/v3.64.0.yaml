version: "3.64.0"
date: "UNRELEASED"
breaking: false
config_changes:
  added:
    - key: handlers.session_start.lsp_noise_checker
      recommended: true
      dormant: false
      description: >-
        NEW SessionStart advisory handler (Plan 00368), ships enabled at
        priority 69, one Strategy Pattern check per supported language
        present (Python, TypeScript/JavaScript, Go, Rust, PHP -- a
        root-level toolchain marker for at least one), silent otherwise
        and on a resumed session. Claude Code injects a language server's
        diagnostics after every edit, and a stream carrying noise --
        other checkouts' half-built branches under the daemon's runtime
        directory, archived plan probes, vendored and build output, the
        vendored remote-docs tree -- trains the agent to skim it, which
        is the same as having no LSP at all. Two checks per language,
        each printing that language's exact fix: `R-LSP-CONFIG-EXCLUDE`
        when its server isn't told to exclude a tree the daemon KNOWS is
        not project code (the runtime dir, `plan_workflow.directory`, the
        reviewed vendored/build names at any depth,
        `documentation.trees.remote` -- derived, never typed), and
        `R-LSP-SERVER-STALE` when a matching language-server process
        started before that check's anchor file was last written (names
        the pid and the command that ends it; the harness respawns a
        fresh server on the next LSP use). Verified against Claude Code's
        own marketplace plugin configs, not assumed: Python/TypeScript
        read a real project exclude file; Go/Rust have no exclude list
        (Go checks module-boundary membership, Rust's fix is `Cargo.toml`
        `[workspace] exclude`); PHP (intelephense) reads no project file
        at all, so its fix is a project-scope LSP plugin override.
      example_yaml: |
        handlers:
          session_start:
            lsp_noise_checker:
              enabled: true
              priority: 69
      migration_note: >-
        On by default; no action needed to adopt. The first new session in
        a project using any supported language whose server isn't told to
        exclude the daemon's runtime directory prints that language's exact
        fix -- apply it, then end the language server as the advisory says.
        A project using none of the five supported languages never hears
        from it. Disable with
        handlers.session_start.lsp_noise_checker.enabled: false.
    - key: plan_workflow.close_requires_human_approval
      recommended: false
      dormant: true
      description: >-
        NEW boolean (Plan 00367, default false). When true, an agent's
        Write/Edit that flips a PLAN.md `**Status**:` to Complete, Cancelled
        or Superseded is denied by the `plan_close_approval` handler with a
        reason naming this key and the human's route: edit the header
        themselves outside Claude, or run
        `hooks-daemon approve-plan-close NNNNN`, which records a one-shot
        marker under the daemon's untracked directory that the very next
        terminal flip of that plan consumes. Only the flip is gated; a plan
        a human already closed stays editable. False (the default) changes
        nothing: a fully completed plan is closed by the agent that
        completed it, which is the owner's ruling -- a mandatory sign-off
        "is just going to lead to lots of plans kept open for no good
        reason". The deployed PlanWorkflow core document now says exactly
        that and cites this key as the opt-in gate, so the document and the
        daemon agree (the `unenforced-approval-gate` docs-QA check keeps
        them agreeing).
      example_yaml: |
        plan_workflow:
          enabled: true
          close_requires_human_approval: true
      migration_note: >-
        No action needed. Turn it on only if you want a human in the loop
        for every plan closure; the `plan_close_approval` handler must also
        be enabled (it ships enabled at priority 43 in a fresh config and is
        inert while the key is false).
    - key: handlers.pre_tool_use.plan_close_approval
      recommended: false
      dormant: true
      description: >-
        NEW PreToolUse blocking handler (Plan 00367), priority 43, PLANNING
        tagged. Enforces `plan_workflow.close_requires_human_approval`
        above; never matches while that key is false, so enabling the
        handler alone changes nothing.
      migration_note: >-
        Add `plan_close_approval: {enabled: true, priority: 43}` under
        `handlers.pre_tool_use` if you intend to turn the key on. A config
        without the handler is still valid.
    - key: worktree.merge_to_main_requires_human_approval
      recommended: false
      dormant: true
      description: >-
        NEW boolean (Plan 00367 Phase 4, default false). When true, a
        `git merge <branch>` (or `gh pr merge`) run in the MAIN checkout
        while it is on the default branch is denied by the
        `merge_to_main_approval` handler with a reason naming this key and
        the human's route: run `hooks-daemon approve-merge <branch>`, which
        records a one-shot marker under the daemon's untracked directory
        that the very next merge of that branch consumes. A merge run
        inside a linked worktree (child into parent) is never gated either
        way. False (the default) changes nothing: the parent-to-main merge
        happens once verification passes, which is the owner's ruling for
        plan closure applied the same way here. The deployed Worktree core
        document now describes the toggle instead of prescribing an
        unenforced "ask a human" step (the `unenforced-approval-gate`
        docs-QA check keeps them agreeing).
      example_yaml: |
        worktree:
          merge_to_main_requires_human_approval: true
      migration_note: >-
        No action needed. Turn it on only if you want a human in the loop
        for every parent-to-main merge; the `merge_to_main_approval`
        handler must also be enabled (it ships enabled at priority 20 in a
        fresh config and is inert while the key is false).
    - key: handlers.pre_tool_use.merge_to_main_approval
      recommended: false
      dormant: true
      description: >-
        NEW PreToolUse blocking handler (Plan 00367 Phase 4), priority 20,
        GIT tagged. Enforces `worktree.merge_to_main_requires_human_approval`
        above; never matches while that key is false, so enabling the
        handler alone changes nothing.
      migration_note: >-
        Add `merge_to_main_approval: {enabled: true, priority: 20}` under
        `handlers.pre_tool_use` if you intend to turn the key on. A config
        without the handler is still valid.
    - key: handlers.post_tool_use.merge_qa_report
      recommended: true
      dormant: false
      description: >-
        NEW PostToolUse advisory handler (Plan 00373 Phase 3), ships enabled
        at priority 34, PLANNING and DOCUMENTATION tagged. Every commit-time
        gate -- `plan_qa_commit_gate`, `docs_qa_commit_gate`,
        `staged_lint_gate` -- keys on a `git commit` command, and a
        `git merge`, `git pull` or `git rebase` creates a commit without ever
        invoking one, so none of them sees it. Measured live: a merge
        resurrected an archived plan folder and four plan-QA findings reached
        the default branch unreported. This handler runs AFTER such an
        operation, reads `git diff --name-only ORIG_HEAD HEAD`, and reports
        only the plan-QA and docs-QA sweep findings attributable to what that
        operation actually introduced -- silent when nothing moved and when
        nothing is attributable, so pre-existing drift is never re-surfaced
        on every merge. It never blocks: the merge has already landed, so
        this is a report to repair from, in the same idiom as `lint_on_edit`.
        Inert in a project with plan QA and docs QA both off.
      example_yaml: |
        handlers:
          post_tool_use:
            merge_qa_report:
              enabled: true
              priority: 34
      migration_note: >-
        On by default; no action needed to adopt. Disable with
        handlers.post_tool_use.merge_qa_report.enabled: false.
    - key: handlers.post_tool_use.daemon_sync_after_merge
      recommended: true
      dormant: false
      description: >-
        NEW PostToolUse advisory handler (Plan 00389), ships enabled at
        priority 35, ADVISORY / NON_TERMINAL / GIT tagged. The daemon reads
        its config once at startup and imports every handler module once at
        `initialise()` -- it never hot-reloads. So a `git pull` that brings
        in someone else's `hooks-daemon.yaml` or project-handler code leaves
        the project believing it is protected by a config that is committed
        but not loaded, and nothing said so. The same pull can also move the
        daemon VERSION recorded in the tracked `.claude/HOOKS-DAEMON.md`
        marker while the gitignored `.claude/hooks-daemon/` clone stays put;
        the first symptom of that is the daemon refusing to start, with every
        safety handler inactive. This handler shares
        `merge_qa_report`'s trigger (`git merge|pull|rebase`, attributed via
        `git diff --name-only ORIG_HEAD HEAD`), so it reports only what THIS
        operation introduced. It ADVISES and never acts -- it names the exact
        restart or upgrade command and both version numbers, and runs
        nothing itself, because the daemon serves this hook in-process and a
        self-restart would kill the process still owing a response. Silent
        when the operation touched nothing the daemon cares about, which is
        the common case.
      example_yaml: |
        handlers:
          post_tool_use:
            daemon_sync_after_merge:
              enabled: true
              priority: 35
              options:
                watch_paths:
                  - ".claude/project-handlers"
      migration_note: >-
        On by default; no action needed to adopt. SET `options.watch_paths`
        if your project overrides `project_handlers.path` -- that value is
        not injected here, so the default would watch the wrong directory
        and a pull changing your handler code would go unreported. The
        config file itself is always watched and is resolved from the
        running daemon, so it needs no entry. Disable with
        handlers.post_tool_use.daemon_sync_after_merge.enabled: false.
    - key: handlers.user_prompt_submit.daemon_upgrade_detector
      recommended: true
      dormant: false
      description: >-
        NEW UserPromptSubmit advisory handler (Plan 00395), ships enabled at
        priority 58, ADVISORY / NON_TERMINAL tagged. The daemon loads its code
        once at startup and never hot-reloads, so when a DIFFERENT session or
        process on the same filesystem upgrades this project's installed
        daemon, the running one keeps serving what it loaded -- every safety
        handler in it the old version -- and nothing reported it. The existing
        checks all key on something happening IN this session
        (`check-source-fresh` during a QA sweep, `daemon_restart_verifier` on a
        source edit, `daemon_sync_after_merge` on a pull), so an upgrade run
        from a second terminal is invisible to all of them. This handler
        compares the version THIS process imported
        (`claude_code_hooks_daemon.version.__version__`) against the installed
        one in the venv's `.daemon-metadata.json`, and is SILENT when they
        match -- an advisory every turn for a fact that changes at most once
        per upgrade would be worse than the defect. It re-RESOLVES the venv on
        every check rather than remembering a path: the venv directory is
        fingerprint-keyed, so an upgrade that changes the fingerprint inputs
        creates a NEW venv directory, and a remembered path (or `sys.prefix`,
        which still points at the OLD venv inside the running process) would
        read untouched metadata and report fresh forever. It ADVISES and never
        acts -- it names both versions and the restart command and runs
        nothing, because it executes INSIDE the daemon serving the very hook
        that triggered it and a self-restart would drop the response that
        session is waiting on. Fail-open throughout: missing, unreadable,
        malformed or unparseable metadata all mean "cannot tell" and allow the
        hook through. Reports `is_dormant()` when `daemon.self_install_mode` is
        true, so a self-install checkout does not announce it as policy.
      example_yaml: |
        handlers:
          user_prompt_submit:
            daemon_upgrade_detector:
              enabled: true
              priority: 58
      migration_note: >-
        On by default; no action needed to adopt. Relevant only to a CLIENT
        project with an installed `.claude/hooks-daemon/` clone -- in a
        self-install checkout the daemon runs from `src/` in the repository
        itself, there is nothing deployed for another session to replace, and
        the handler is dormant. Disable with
        handlers.user_prompt_submit.daemon_upgrade_detector.enabled: false.
    - key: reference_repos
      recommended: true
      dormant: false
      description: >-
        NEW top-level block (Plan 00401) governing freshness of reference
        clones kept under `untracked/repos/` -- a convention where read-only
        clones of upstream repositories are tracked so an agent consults real
        source instead of recalling it. The reported failure is that agents
        read such a clone WITHOUT pulling, reason from a checkout weeks behind,
        and produce conclusions that carry no error and no failing test: stale
        reasoning is indistinguishable from correct reasoning at the point it
        is produced, which is why nothing caught it. One checker feeds three
        surfaces -- a SessionStart sweep that does the network work, a
        PreToolUse backstop that reads only the cache, and the
        `hooks-daemon reference-repos` CLI -- so they cannot drift apart about
        what "stale" means. `enabled` ships true and that is safe because
        discovery finds nothing when the root does not exist, so a project that
        never adopted the convention gets silence with no config at all;
        shipping it OFF would mean every project that DOES adopt it must first
        discover a switch before the protection does anything, which is exactly
        the reported failure. `roots` are repository-relative and may not
        resolve to the repository root -- a root of `.` would govern the
        project's own repository, which Plans 00178/00179 already handle.
        `auto_pull` fast-forwards only what is provably safe (clean tree, no
        local commits, fast-forward only) and reports everything else
        untouched: the one real clone measured while designing this was `ahead
        1` with uncommitted changes, where a blind pull would conflict or
        destroy work. `cache_ttl_minutes` bounds how long a reading stays
        trustworthy -- past it a read is NOT VERIFIED rather than assumed
        fresh, because "nobody has checked this" and "this is stale" are
        different facts and collapsing them either cries wolf or gives false
        comfort.
      example_yaml: |
        reference_repos:
          enabled: true
          roots: ["untracked/repos"]
          exclude: []
          mode: block_once      # block_once | block | advise | off
          auto_pull: true
          cache_ttl_minutes: 15
      migration_note: >-
        On by default and inert unless `untracked/repos/` (or a configured
        root) actually contains git checkouts, so no action is needed to adopt.
        Set `mode: advise` to report without denying, or `enabled: false` to
        switch the whole subsystem off. Note the default branch is resolved
        from `origin/HEAD` rather than assumed to be `main`, and a clone whose
        origin cannot be reached -- deliberately, as with a remote replaced by
        an invalid URL so a push cannot happen by accident -- reads as
        UNCONFIRMED rather than stale, so it is never locked out of being read.
    - key: handlers.pre_tool_use.reference_repo_freshness
      recommended: true
      dormant: false
      description: >-
        NEW PreToolUse handler (Plan 00401), ships enabled at priority 39,
        denying a READ of a governed reference clone that is stale or off its
        default branch. It performs NO network I/O, and that is forced by
        measurement rather than preferred: a fetch and pull inside a hook can
        consume the entire 30s socket budget for ONE repo and a project can
        have several, reproducing the `socket_timeout` failure the daemon
        already has dedicated error text for. It therefore reads only the
        cached reading written by the SessionStart sweep. Git is never
        intercepted -- `git` at the head of any segment in a command chain is
        exempt anywhere -- because the remedy the denial prints is
        `git -C <clone> pull --ff-only`, and a gate that blocked the fix it
        recommends would be unusable. Two rule IDs, deliberately distinct:
        `R-REFERENCE-REPO-STALE` for a clone that is behind or off-branch, and
        `R-REFERENCE-REPO-NOT-VERIFIED` for one with no in-date reading. Scope,
        enforcement posture and auto-pull live in the TOP-LEVEL
        `reference_repos:` block rather than here, so the sweep, this backstop
        and the CLI cannot disagree.
      example_yaml: |
        handlers:
          pre_tool_use:
            reference_repo_freshness:
              enabled: true
              priority: 39
      migration_note: >-
        On by default; no action needed to adopt. Enforcement posture is
        `reference_repos.mode`, not a handler option. Disable with
        handlers.pre_tool_use.reference_repo_freshness.enabled: false.
    - key: handlers.session_start.reference_repo_sweep
      recommended: true
      dormant: false
      description: >-
        NEW SessionStart handler (Plan 00401), ships enabled at priority 71 --
        last, because it is the only SessionStart handler that may fetch for
        several repositories. It fetches every governed clone, fast-forwards
        the ones it can prove are safe, and writes the cached reading the
        PreToolUse backstop later reads. Silent when every governed clone is
        current, and silent when there are none.
      example_yaml: |
        handlers:
          session_start:
            reference_repo_sweep:
              enabled: true
              priority: 71
      migration_note: >-
        On by default; no action needed to adopt. This is where the network
        work happens, so disabling it while leaving the PreToolUse backstop on
        leaves every clone reading NOT VERIFIED once the cache expires.
  renamed: []
  removed:
    - key: handlers.pre_tool_use.daemon_restart_verifier
      description: >-
        REMOVED (Plan 00370). This handler's `matches()` only ever fired
        inside the hooks-daemon repository itself, so it never did anything
        for a client project. It is now a project-level handler in the
        hooks-daemon repository's own `.claude/project-handlers/
        pre_tool_use/`, dogfooding the project-handler surface instead of
        shipping pure self-checks in the shared library. The key is
        registered in `RETIRED_HANDLERS`, so a leftover
        `daemon_restart_verifier:` entry in your config validates cleanly
        (accepted silently) rather than degrading the daemon.
      migration_note: >-
        Safe to delete this key from your config; it never mattered outside
        the hooks-daemon repository's own checkout.
  changed: []
