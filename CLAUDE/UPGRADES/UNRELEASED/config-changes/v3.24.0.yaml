version: "3.24.0"
date: "2026-06-22"
breaking: false
upgrade_guide: "CLAUDE/UPGRADES/v3/v3.23.0-to-v3.24.0/"
config_changes:
  added: []
  renamed: []
  removed: []
  changed:
    - key: handlers.pre_tool_use.markdown_organization.options.allow_untracked_claude_memory
      description: >-
        Default flipped to false — the daemon now BLOCKS untracked Claude memory
        writes (~/.claude/projects/*/memory/*.md) by default and routes durable
        knowledge into tracked project docs (CLAUDE.md / .claude/rules / thin
        skills). Reads are always allowed so existing memory can be migrated. Set
        to true to restore the previous always-allow behaviour.
      recommended: true
      recommended_value: false
      migration_note: >-
        Before keeping the new default, migrate any existing untracked Claude
        memory into tracked project docs — see the post-upgrade task
        migrate-untracked-claude-memory in
        CLAUDE/UPGRADES/v3/v3.23.0-to-v3.24.0/post-upgrade-tasks/. Existing memory
        files are left untouched (inert); deletion is your call.
