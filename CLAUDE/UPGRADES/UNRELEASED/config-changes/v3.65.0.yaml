# Drafted by Plan 00413. The VERSION in the filename and the `version:` key are
# a target, not a decision — releases are human-gated in this project, and the
# release agent confirms or renames this file. Only the content is asserted here.
version: "3.65.0"
date: "UNRELEASED"

breaking: false

config_changes:
  added:
    - key: handlers.pre_tool_use.ask_user_question_blocker.options.mode
      description: >-
        Declares whether a human is watching this session. Claude Code's own
        "nobody is watching" mechanisms are launcher flags, so they cannot reach
        a cron job firing into a live interactive session — a session that is
        only SOMETIMES unattended previously had no way to say so. Set to
        `unattended` and a question that would otherwise wait forever for an
        answer is refused, with the agent told to choose the option it would
        have recommended and continue.
      example_yaml: |
        ask_user_question_blocker:
          enabled: true
          options:
            mode: unattended
      migration_note: >-
        Leave unset for an ordinary interactive session; the default behaviour
        is unchanged. Set `unattended` for a session driven by crons, a
        supervisor, or any other automation where no human will answer.
      recommended: false
      dormant: true

    - key: handlers.stop.cron_stop_enforcer
      description: >-
        Blocks a stop while a job declared under `persistent_crons` is VERIFIED
        missing from the session. The SessionStart advisory could only declare
        what the project wanted and ask for a `CronList` reconcile — the
        `session_crons` field it would need to check is not delivered to that
        event. It IS delivered to `Stop`, so this handler compares declared
        against actual and denies the stop naming the exact `CronCreate` (id,
        schedule and full prompt) for anything absent. An absent `session_crons`
        field means "no information", never "no crons exist", and never blocks.
      example_yaml: |
        stop:
          cron_stop_enforcer:
            enabled: true
            priority: 7
      migration_note: >-
        Silent unless `persistent_crons` is enabled with at least one declared
        job, so a project that declares no crons needs no action. Keep
        `priority` below `auto_continue_stop`'s 10 — a Stop handler placed above
        it never runs on the common stop.
      recommended: true
      dormant: false

    - key: handlers.subagent_stop.cron_subagent_stop_enforcer
      description: >-
        The `SubagentStop` twin of `handlers.stop.cron_stop_enforcer`, applying
        the same declared-versus-actual comparison when a subagent stops.
      example_yaml: |
        subagent_stop:
          cron_subagent_stop_enforcer:
            enabled: true
            priority: 7
      migration_note: >-
        Same conditions as the Stop twin. Keep `priority` below
        `subagent_report_size_blocker`'s 15 so it is not shadowed.
      recommended: true
      dormant: false

    - key: handlers.session_start.session_actions_directive
      description: >-
        Delivers the ACTION_REQUIRED list as a TURN instead of as session-start
        context. When a session starts with one or more items whose verifier is
        failing, the daemon writes a `<session>.session-actions` signal and the
        ccy supervisor types one short directive naming the count. The signal
        carries a positive integer and nothing else — the supervisor composes
        every word from a fixed template it owns, so the channel has no text to
        forge. Adds nothing to the session-start block itself.
      example_yaml: |
        session_start:
          session_actions_directive:
            enabled: true
            priority: 72
      migration_note: >-
        Opt-in, because it types a line into your terminal. Useful only where
        an armed ccy supervisor is live to read the signal — without one the
        handler stands down and writes nothing. Keep `priority` last among
        SessionStart handlers: it counts what is STILL ACTION_REQUIRED after
        every other handler has run, and `hook_registration_checker` self-heals
        inside its own handler.
      recommended: false
      dormant: true

  renamed: []

  removed: []

  changed: []
