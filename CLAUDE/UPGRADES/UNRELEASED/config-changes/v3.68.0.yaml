# Drafted by Plan 00376. The VERSION in the filename and the `version:` key are
# a target, not a decision; the release agent confirms or renames this file.
version: "3.68.0"
date: "UNRELEASED"

breaking: false

config_changes:
  added:
    - key: daemon.expected_version
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00477). The daemon version this project expects, strictly
        X.Y.Z. `install` and `upgrade` write it after the deploy, so the
        tracked config names the version a fresh checkout is provisioned at:
        `bash .claude/provision.sh` fetches exactly this tag, never `main`.
        Distinct from the top-level `version`, which is the config SCHEMA
        version. A project that predates the key falls back to the
        `.claude/HOOKS-DAEMON.md` header.
      example_yaml: |
        daemon:
          expected_version: "3.68.0"
      migration_note: >-
        Nothing to do: the next upgrade records it. Commit the changed
        `.claude/hooks-daemon.yaml` and the new `.claude/provision.sh`.
    - key: daemon.unprovisioned_mode
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00477). What the hooks do in a fresh clone that has the
        tracked assets but no daemon: `warn` (the default) says so loudly to
        the human (`systemMessage`) and the agent (`additionalContext`) at
        SessionStart and on every prompt, and on the status line, and blocks
        nothing; `block` also denies every tool call except the provision
        command itself (`bash .claude/provision.sh`) and the hooks-daemon
        provision skill call. Read by `init.sh` in bash, since no daemon
        exists yet to read it. A project with `ci_enabled: true` keeps its own
        blocking behaviour whatever this says.
      example_yaml: |
        daemon:
          unprovisioned_mode: block
      migration_note: >-
        Nothing to do: the default is `warn`. Set `block` if a fresh checkout
        must not do any work before it is provisioned.
    - key: handlers.pre_tool_use.upgrade_approval_guard
      description: >-
        Denies an agent action that grants or bypasses the project owner's
        one-shot upgrade approval (Plan 00376, review finding MAJOR 4). The
        pre-deploy upgrade gate's escalation path is the owner's step --
        `hooks-daemon approve-upgrade <version> --from <previous>` needs an
        interactive TTY and a typed confirmation phrase, run in the owner's
        own terminal. Denied: running `approve-upgrade` (or the standalone
        gate's own `approve` subcommand) itself; writing or touching the
        `<version>.approved` marker under an `upgrade-approvals/` directory by
        any Bash route or with Write/Edit/NotebookEdit; assigning, exporting
        or env-setting HOOKS_DAEMON_UPGRADE_HANDOFF, which impersonates the
        upgrade's Layer 1; on a command that runs the upgrade, setting a
        variable that picks its interpreter, venv, tools, flags, pass state,
        git view or code (HOOKS_DAEMON_PYTHON, HOOKS_DAEMON_VENV_PATH, PATH,
        HOSTNAME, HOME, TMPDIR, HOOKS_DAEMON_CLONE_URL,
        HOOKS_DAEMON_UPGRADE_BASE_URL, HOOKS_DAEMON_UPGRADE_PREVIOUS_VERSION,
        HOOKS_DAEMON_UPGRADE_SECOND_PASS, UPGRADE_FLAGS, GIT_*, BASH_ENV, ENV,
        BASH_FUNC_*, SHELLOPTS, BASHOPTS, LD_*, DYLD_*, PYTHON*,
        HOOKS_DAEMON_OLD_DEFAULT_*, the uv index/find-links/config/python
        variables, CA bundles and proxies) by any spelling (NAME=, read or
        printf -v into it, an indirect name, an x-flagged declare/typeset/local,
        a computed export; and set -a, eval or sourcing another file) or
        exporting a shell function -- the upgrade recognised by name, by Layer 1's
        --skip-reading-confirmation, by a script carrying
        HOOKS_DAEMON_UPGRADE_HANDOFF, or by an unreadable script (`bash
        "$tmp"`, stdin) run with --project-root or the daemon clone as an
        argument; forging a venv's `.daemon-version` stamp; moving the
        `.claude/hooks-daemon` clone to another ref by hand (checkout, switch,
        pull, merge, rebase, reset, cherry-pick, am, revert) or writing into
        its .git/. Never denied: reading (ls/cat/stat/grep/find -print/test -f),
        merely reading the env var, fetching, showing or logging the daemon
        clone, a git commit message, non-executing
        echo/printf prose, a grep search, or a quoted-delimiter heredoc body
        written to a file.
      example_yaml: |
        handlers:
          pre_tool_use:
            upgrade_approval_guard:
              enabled: true
              priority: 20
      migration_note: >-
        On by default; no project-side action needed. If this handler ever
        blocks a call, report the gate's reasons to the user and stop -- the
        owner runs `hooks-daemon approve-upgrade <version> --from <previous>`
        themselves. Disable with
        handlers.pre_tool_use.upgrade_approval_guard.enabled: false.
      recommended: true
      dormant: false
    - key: persistent_crons.jobs[].runs_while_awaiting_human
      recommended: false
      dormant: true
      description: >-
        NEW per-job boolean (Plan 00470 Task 5.1, default false). A stop that
        declares `[awaiting-human]` normally drops every declared job's tick
        (R-DECLARED-CRON-SUPPRESSED) as well as the failsafe's. A job that sets
        this to true is delivered while the marker is live, because its work
        does not depend on the pending question. The failsafe and every job
        without the option are still dropped, so a project that adds nothing
        sees no change.
      example_yaml: |
        persistent_crons:
          enabled: true
          jobs:
            - id: issue-sdlc
              schedule: "23 * * * *"
              runs_while_awaiting_human: true
              prompt: |
                Invoke the `issue-sdlc` skill and follow it exactly.
      migration_note: >-
        Optional. Set `runs_while_awaiting_human: true` on a declared job whose
        work is independent of a human answer; leave it off for anything that
        resumes interrupted work.
    - key: persistent_crons.jobs[].hosts
      recommended: false
      dormant: true
      description: >-
        NEW per-job list of strings (Plan 00470 Task 6.1, default unset). A job
        without it is global, as before. A job with it is declared only where
        the session's effective hostname matches an entry (exact name or
        fnmatch glob: `*`, `?`, `[...]`): the first non-empty of the
        HOOKS_DAEMON_HOSTNAME and CCY_HOST_HOSTNAME environment variables, then
        the system hostname. Everywhere else the job is neither listed at
        session start nor demanded at Stop. An empty list is a config error.
      example_yaml: |
        persistent_crons:
          enabled: true
          jobs:
            - id: issue-sdlc
              schedule: "23 * * * *"
              hosts: [cchd-sdlc-runner]
              prompt: |
                Invoke the `issue-sdlc` skill and follow it exactly.
      migration_note: >-
        Optional. Add `hosts:` to a job that only one machine or role should
        run, then export HOOKS_DAEMON_HOSTNAME=<name> before launching the
        session that should take the role. Leave it off for a job every
        session needs.
