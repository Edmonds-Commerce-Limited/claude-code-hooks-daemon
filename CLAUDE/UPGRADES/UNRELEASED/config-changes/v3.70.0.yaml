# Drafted by Plan 00499. The VERSION in the filename and the `version:` key are
# a target, not a decision; the release agent confirms or renames this file.
version: "3.70.0"
date: "UNRELEASED"

breaking: false

config_changes:
  added:
    - key: handlers.pre_tool_use.write_protected_paths
      recommended: false
      dormant: true
      description: >-
        NEW (Plan 00499, GitHub #88). Keeps listed paths read-only for agents:
        `Write`, `Edit` and `NotebookEdit` on a listed path, and a Bash command
        that writes it (redirect, `tee`, heredoc, `sed -i`, `dd of=`), copies,
        moves, installs or links onto it, or deletes or truncates it (`rm`,
        `truncate`, `: >`), are denied. Reading is never denied. Off by default
        and inert without `options.paths`.
      example_yaml: |
        handlers:
          pre_tool_use:
            write_protected_paths:
              enabled: true
              priority: 18
      migration_note: >-
        Opt in for files that infrastructure-as-code or a human maintains and
        an agent must only read.
    - key: handlers.pre_tool_use.write_protected_paths.options.paths
      recommended: false
      dormant: true
      description: >-
        NEW (Plan 00499). Repository-relative globs (`*`, `?`, `**`) the
        handler protects. Absolute paths and `..` are refused. The default is
        an empty list, which protects nothing.
      example_yaml: |
        handlers:
          pre_tool_use:
            write_protected_paths:
              options:
                paths:
                  - .claude/ccy/ccy.env.local
    - key: handlers.pre_tool_use.subagent_full_qa_blocker.options.exempt_agent_types
      recommended: false
      dormant: true
      description: >-
        NEW (Plan 00518). Exact agent definition-type names whose sub-agents may
        run a declared full-suite QA command, one run at a time (the host-wide
        full-QA lock; a second concurrent exempt run is denied and a dead
        holder never blocks). The allow carries an advisory naming the matching
        entry. Default empty, which exempts nobody.
      example_yaml: |
        handlers:
          pre_tool_use:
            subagent_full_qa_blocker:
              options:
                exempt_agent_types:
                  - qa-full-runner
      migration_note: >-
        Opt in if a dedicated agent runs your full QA gate, instead of leaving
        the handler off. Needs `agent_dispatch_recorder` enabled for agents
        dispatched with a `name`.
    - key: handlers.pre_tool_use.agent_dispatch_recorder
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00518). A silent PreToolUse handler that records
        `name -> subagent_type` for every named Agent/Task dispatch under the
        daemon untracked dir, so `exempt_agent_types` can tell a named
        teammate's definition type (its payload `agent_type` is the name).
        Never blocks and emits nothing.
      example_yaml: |
        handlers:
          pre_tool_use:
            agent_dispatch_recorder:
              enabled: true
              priority: 46
      migration_note: >-
        Enabled by the shipped config; keep it on if you set
        `exempt_agent_types`. Without it a named agent's type cannot be read
        and it is not exempt.
    - key: handlers.session_start.unproven_venv_advisor
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00517 Task 4.2). At session start, lists each
        `untracked/venv-*` the code cannot prove stale (missing or unreadable
        `.daemon-metadata.json`, or another checkout view's slug) with the
        processes using it, its interpreter and version, its age, its slug and
        the view it belongs to, plus the exact `prune-venvs --unproven <path>
        --force` command. Advisory only: it never removes a venv. Silent when
        there are none.
      example_yaml: |
        handlers:
          session_start:
            unproven_venv_advisor:
              enabled: true
              priority: 72
      migration_note: >-
        On by default. Investigate each venv it lists and remove it only once
        you have confirmed it is unused; set `enabled: false` to silence it.
    - key: persistent_crons.initial_thread_only
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00470 Task 6.4). Default `true`: only the initial thread of a
        Claude Code session must hold the declared `persistent_crons`. A thread
        opened later in the same session (a `bg-spare` worker under the shared
        `claude daemon run --origin transient --spawned-by` process; the initial
        thread's worker carries `--fork-session --resume`) is told by
        `persistent_cron_assertor` that it holds none, and
        `cron_stop_enforcer` and `cron_subagent_stop_enforcer` do not demand
        them from it. With no such ancestor, or an unreadable `/proc`, every
        session holds them as before. `false` makes every thread hold them.
      example_yaml: |
        persistent_crons:
          enabled: true
          initial_thread_only: true
      migration_note: >-
        On by default and inert unless `persistent_crons` is enabled and a
        session opens a second thread. Set `false` to keep the previous
        behaviour of asking every thread for the declared crons.
    - key: handlers.pre_tool_use.subagent_context_budget
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00471 L2). Inside a subagent, past `soft_tokens` of context
        (default 300000) the agent is told once to hand off: write
        `<plan>/subagent-reports/<yymmdd>-<agent>-handoff.md`, commit, and
        SendMessage the lead. Past `hard_tokens` (default null, off) every
        tool except the handoff steps is denied (R-SUBAGENT-CONTEXT-BUDGET).
        Options `handoff_globs`, `allowed_bash_prefixes` (additive/replace via
        `mode`), `exempt_agent_types` and `max_override_tokens` (450000, the
        ceiling for a `budget: <N>k` line in a named dispatch's prompt). A
        transcript it cannot read always allows, with one `unmeasured`
        verdict per agent and reason.
      example_yaml: |
        handlers:
          pre_tool_use:
            subagent_context_budget:
              enabled: true
              priority: 39
              options:
                soft_tokens: 300000
                hard_tokens: null
      migration_note: >-
        On by default as an advisory only. Set `hard_tokens` to make the
        budget a handoff-only limit; leave it null until the advisory has run
        in your sessions.
    - key: handlers.subagent_stop.subagent_handoff_gate
      recommended: true
      dormant: true
      description: >-
        NEW (Plan 00471 L2). Blocks the stop of an agent that reached
        `subagent_context_budget`'s `hard_tokens` until its handoff file
        exists, at most three times (R-SUBAGENT-HANDOFF-MISSING). Shares that
        handler's options and is silent while `hard_tokens` is null.
      example_yaml: |
        handlers:
          subagent_stop:
            subagent_handoff_gate:
              enabled: true
              priority: 11
      migration_note: >-
        Keep it enabled with the budget; it does nothing until the hard band
        is on.
    - key: handlers.pre_tool_use.resume_guard
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00471 L3). A SendMessage to a stopped agent idle past
        `warm_seconds` (300) whose context is at or above `max_resume_tokens`
        (250000) would re-write its whole history to the cache. `mode: advise`
        (default) adds context naming the fresh-spawn route and the agent's
        last report; `mode: deny` refuses (R-RESUME-COLD-LARGE). A first line
        `RESUME-LARGE: <reason>` is allowed and recorded.
      example_yaml: |
        handlers:
          pre_tool_use:
            resume_guard:
              enabled: true
              priority: 39
              options:
                mode: advise
                max_resume_tokens: 250000
                warm_seconds: 300
      migration_note: >-
        On by default as an advisory. Switch to `mode: deny` once your
        coordinators spawn fresh agents from reports as a matter of course.
    - key: handlers.pre_tool_use.spawn_rate_advisor
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00471 L4, L5). On a spawn or a cold resume: at
        `max_concurrent` live agents (default null, off) names them; at
        `advise_pct` of the five-hour usage limit (default 80, read from the
        daemon's usage snapshot) says to serialise, with the reset time. Options
        `liveness_seconds` (120) and `max_age_seconds` (300). Never denies.
      example_yaml: |
        handlers:
          pre_tool_use:
            spawn_rate_advisor:
              enabled: true
              priority: 60
              options:
                max_concurrent: null
                advise_pct: 80
      migration_note: >-
        The five-hour advisory reads the daemon's usage snapshot, which every
        status-line render fills from `rate_limits`; a session with no
        usage windows (an API-key session) draws nothing.
    - key: handlers.pre_tool_use.review_round_advisor
      recommended: false
      dormant: true
      description: >-
        NEW (Plan 00471 L9). Counts review dispatches per plan or work branch
        and, from `advise_at` (4), advises comparing findings counts and
        considering an owner decision. Opt-in.
      example_yaml: |
        handlers:
          pre_tool_use:
            review_round_advisor:
              enabled: true
              priority: 60
              options:
                advise_at: 4
      migration_note: >-
        Opt in for coordinated runs with repeated review rounds.
    - key: handlers.stop.background_task_recorder
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00471 L4). A silent Stop sensor recording which agent tasks
        `background_tasks[]` reports as no longer running, so the live count
        drops them, and refreshing the live snapshot the status segment reads.
      example_yaml: |
        handlers:
          stop:
            background_task_recorder:
              enabled: true
              priority: 9
      migration_note: >-
        On by default; it never blocks.
    - key: handlers.status_line.spend_meter
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00471 L7). Status segment `Σ⚙ <ite> · N live (by model
        family) · max <ctx> · N unmeasured`, hidden until a subagent has
        stopped or the live count is fresh.
      example_yaml: |
        handlers:
          status_line:
            spend_meter:
              enabled: true
              priority: 17
      migration_note: >-
        On by default; set `enabled: false` to hide the segment.
    - key: daemon.spend_ledger_retention_days
      recommended: true
      dormant: false
      description: >-
        NEW (Plan 00471). Days a session's spend ledger is kept before the
        daemon's start-up cleanup removes it (default 90): `spend-ledger/<session>/`
        and the per-agent rows in `cache-sidecar/<session>/`. Longer than
        `stale_file_days` because the ledger is the evidence for later
        decisions about the spend levers. The `spend-offsets/` cache still
        ages out after `stale_file_days`.
      example_yaml: |
        daemon:
          spend_ledger_retention_days: 90
      migration_note: >-
        Nothing to do. `cache-sidecar/` session directories were removed after
        `stale_file_days`; they now follow this setting.
  renamed: []
  removed:
    - key: handlers.pre_tool_use.upgrade_approval_guard
      description: >-
        REMOVED (Plan 00503, GitHub #112). An upgrade no longer waits for the
        project owner's approval, so the `approve-upgrade` command, the
        `upgrade-approvals/` markers and exit code 4 are gone, and this
        handler (and its rules `R-UPGRADE-APPROVAL-AGENT` and
        `R-UPGRADE-APPROVAL-ENV-BYPASS`) has nothing left to protect. The key
        is registered in `RETIRED_HANDLERS`, so a leftover
        `upgrade_approval_guard:` entry in your config validates cleanly
        (accepted silently) rather than degrading the daemon.
      migration_note: >-
        Safe to delete this key from your config. A MAJOR bump, a
        `breaking: true` manifest, a critical pre-upgrade task or an
        unreadable installed version is now listed first in the reading the
        upgrade already stops on; confirm it with
        `--skip-reading-confirmation=<digest>` and the upgrade proceeds.
  changed: []
