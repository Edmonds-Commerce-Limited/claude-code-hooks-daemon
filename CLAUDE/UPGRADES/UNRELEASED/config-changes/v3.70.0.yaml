# Drafted by Plan 00499. The VERSION in the filename and the `version:` key are
# a target, not a decision; the release agent confirms or renames this file.
version: "3.70.0"
date: "UNRELEASED"

breaking: false

config_changes:
  added:
    - key: handlers.pre_tool_use.write_protected_paths
      recommended: false
      dormant: true
      description: >-
        NEW (Plan 00499, GitHub #88). Keeps listed paths read-only for agents:
        `Write`, `Edit` and `NotebookEdit` on a listed path, and a Bash command
        that writes it (redirect, `tee`, heredoc, `sed -i`, `dd of=`), copies,
        moves, installs or links onto it, or deletes or truncates it (`rm`,
        `truncate`, `: >`), are denied. Reading is never denied. Off by default
        and inert without `options.paths`.
      example_yaml: |
        handlers:
          pre_tool_use:
            write_protected_paths:
              enabled: true
              priority: 18
      migration_note: >-
        Opt in for files that infrastructure-as-code or a human maintains and
        an agent must only read.
    - key: handlers.pre_tool_use.write_protected_paths.options.paths
      recommended: false
      dormant: true
      description: >-
        NEW (Plan 00499). Repository-relative globs (`*`, `?`, `**`) the
        handler protects. Absolute paths and `..` are refused. The default is
        an empty list, which protects nothing.
      example_yaml: |
        handlers:
          pre_tool_use:
            write_protected_paths:
              options:
                paths:
                  - .claude/ccy/ccy.env.local
    - key: persistent_crons.initial_thread_only
      recommended: false
      dormant: false
      description: >-
        NEW (Plan 00470 Task 6.4). Default `true`: only the initial thread of a
        Claude Code session must hold the declared `persistent_crons`. A thread
        opened later in the same session (a `bg-spare` worker under the shared
        `claude daemon run --origin transient --spawned-by` process; the initial
        thread's worker carries `--fork-session --resume`) is told by
        `persistent_cron_assertor` that it holds none, and
        `cron_stop_enforcer` and `cron_subagent_stop_enforcer` do not demand
        them from it. With no such ancestor, or an unreadable `/proc`, every
        session holds them as before. `false` makes every thread hold them.
      example_yaml: |
        persistent_crons:
          enabled: true
          initial_thread_only: true
      migration_note: >-
        On by default and inert unless `persistent_crons` is enabled and a
        session opens a second thread. Set `false` to keep the previous
        behaviour of asking every thread for the declared crons.
