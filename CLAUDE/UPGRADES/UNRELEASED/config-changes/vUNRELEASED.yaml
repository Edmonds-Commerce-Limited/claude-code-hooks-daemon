version: "UNRELEASED"
date: "UNRELEASED"
breaking: false
config_changes:
  added:
    - key: handlers.pre_tool_use.artifact_publish_blocker
      recommended: true
      dormant: false
      description: >-
        NEW PreToolUse blocking handler (Plan 00259). Denies publishing an
        artefact. The Artifact tool renders a local file to a page hosted on
        claude.ai and returns a URL; the page starts private, but it lives
        OUTSIDE the project, so the repository cannot audit what left it and
        deleting the artefact later does NOT un-share a link somebody has
        already opened. Whether content leaves is the user's decision, and
        this was the one disclosure path in the daemon with no guard at all.
        Fires on any publish or update -- an absent action (which means
        publish), action "publish", or passing url to update an existing page
        -- and deliberately defaults unknown future actions to "this
        publishes" rather than waving them through. Read-only action "list"
        is never blocked, because enumerating discloses nothing new. The
        payload shape was captured from the live daemon rather than assumed.
        Ships default-ON: a guard that must be discovered and enabled before
        it protects anything protects nobody, and the cost of the default is
        one config line for projects that genuinely want to publish.
      migration_note: >-
        On by default; no action needed to adopt. If your project legitimately
        publishes artefacts (dashboards, shared reports), a HUMAN sets
        handlers.pre_tool_use.artifact_publish_blocker.enabled to false. Note
        there is deliberately NO agent-side MUST_..._BECAUSE escape hatch:
        the hatches on git_stash and ancestry_preserving_merge cover actions
        whose consequences stay inside the repository, whereas publishing
        leaves it, so an agent able to type its own justification would have
        self-authorised disclosure. Agents are told to ask rather than apply
        the setting themselves. This does not affect a human publishing
        through the claude.ai UI -- the daemon sees tool calls, not browser
        clicks.
    - key: handlers.pre_tool_use.write_clobber_guard
      recommended: true
      dormant: false
      description: >-
        NEW PreToolUse blocking handler (Plan 00261). Denies a Write to a file
        that already exists and that the session has not Read. Write replaces a
        file's ENTIRE contents, so an agent writing blind destroys content it
        cannot describe -- it could not report the loss even afterwards. This is
        a recorded incident, not a hypothetical: a Write destroyed a tracked
        58-line journal in the daemon's own repository, noticed only because
        that path happened to fall under an ADVISE-level plan-QA rule. The
        handler exists because the Write tool's own description states
        "Overwriting an existing file you haven't Read will fail" and, measured
        under bypassPermissions, it does not -- so this restores a documented
        contract rather than adding a new rule. Creating a NEW file is never
        blocked, nor is rewriting a file read or written earlier in the same
        session, nor any Edit. Non-terminal by design: the handler ALLOWs on its
        common path and a terminal ALLOW would shadow every handler behind it.
      migration_note: >-
        On by default; no action needed to adopt. If a Write is denied, Read the
        file and retry, or use Edit -- either is one call. There is deliberately
        no MUST_..._BECAUSE escape hatch, because a Read actually removes the
        hazard whereas a typed justification would only declare it acceptable.
        Note the guard tracks READS, not sizes: a byte-threshold rule would not
        have caught the motivating incident, because the clobbering write made
        the file BIGGER. Bash-mediated writes (>, >>, tee, heredoc) are not
        covered by this handler.
    - key: handlers.post_tool_use.lint_on_edit.options.lint_bash_writes
      recommended: false
      dormant: false
      description: >-
        NEW option (Plan 00260 Task 3.5), default TRUE. Lints source files a
        Bash command AUTHORS -- a > / >> / >| / &> redirect, tee, or a
        cat <<EOF heredoc -- in addition to Write/Edit. Before this, a heredoc
        put unparseable Python on disk in silence while identical content
        through Write was denied, so the route that looked safest because
        nothing complained was the only unguarded one. A command that authors
        several files (tee a.py b.py) has each of them linted, and the first
        failure is reported. Files the command merely RELOCATES (cp, mv,
        install, dd) are deliberately NEVER linted: those bytes were already on
        disk, so denying the copy would report a defect the command did not
        introduce. A predicted target that does not exist is skipped, since a
        failed command leaves nothing to check.
      migration_note: >-
        On by default. THIS IS A NEW DENIAL SURFACE -- lint_on_edit DENIES, and
        the write has already landed when it runs, so a denial is a failure
        report to fix with Edit, not a rollback (and it cancels sibling tool
        calls batched in the same turn). If your project generates source files
        via heredoc or redirect and cannot make them lint-clean, set
        lint_bash_writes to false; Write/Edit linting is unaffected either way.
    - key: handlers.post_tool_use.validate_eslint_on_write.options.check_bash_writes
      recommended: false
      dormant: false
      description: >-
        NEW option (Plan 00260 Task 3.5), default TRUE. The .ts/.tsx sibling of
        lint_bash_writes: a TypeScript file authored by a redirect, tee or a
        heredoc is ESLint-checked, not only one written with Write/Edit.
        Relocation routes are excluded on the same reasoning.
      migration_note: >-
        On by default, and this handler is the STRICTER of the two -- it denies
        on an ESLint timeout and on any failure to run ESLint at all, so do not
        carry lint_on_edit's "a missing linter never blocks" across to it. Note
        enforcement is still gated on llm: scripts in package.json: with none
        present the handler only advises, so silence is not evidence a .ts file
        is clean. Opt out with check_bash_writes: false.
