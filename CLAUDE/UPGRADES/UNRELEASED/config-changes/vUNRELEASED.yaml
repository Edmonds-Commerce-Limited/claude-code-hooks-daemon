version: "UNRELEASED"
date: "UNRELEASED"
breaking: false
config_changes:
  added:
    - key: handlers.session_start.secret_file_hygiene_checker
      recommended: true
      dormant: false
      description: >-
        NEW SessionStart advisory handler (Plan 00272 Task 6.1), ships
        enabled. For every path matching the effective secret_file_guard
        globs that exists on disk, advises (never blocks) when it is not
        gitignored, is git-tracked, or is group/world-readable (chmod 600
        remediation). This is the session-start half of the
        permissions/ownership hygiene the secret-meta CLI already reports on
        demand for a single path. Files are enumerated via git ls-files
        (tracked, untracked-visible, untracked-ignored -- three cheap index
        reads, no filesystem walk); outside a git repository (or when git is
        unavailable) gitignore/tracked checks are skipped and only
        permissions are checked via a bounded fallback walk, which reports
        explicitly if its file-count bound is hit rather than presenting a
        truncated scan as a clean one. Content is never read.
      migration_note: >-
        On by default; no action needed to adopt. If it advises on a file you
        know is safe, fix the listed issue (gitignore it, untrack it, or
        chmod 600 it) -- there is no per-finding suppression, matching
        secret_file_guard's own no-escape-hatch doctrine for protected paths.
    - key: agents.opus_security.enabled
      recommended: false
      dormant: true
      description: >-
        NEW gating key for the hooks-daemon-opus-security agent asset
        (Plan 00279), ships false. When enabled, the generic agent-asset
        subsystem deploys a quarantine-executor sub-agent into
        .claude/agents/ for safeguard-flaggable security work: the caller
        delegates the whole sub-task before reading the sensitive content
        and receives back only a clean SUMMARY artefact (the paired DETAIL
        artefact is never read by the coordinator). Deployment happens on
        daemon start and via `hooks-daemon agents install`; disabling the
        key produces a removal advisory naming `hooks-daemon agents remove
        hooks-daemon-opus-security` — the daemon never deletes agents
        itself. Pristine deployed copies (matching any shipped revision)
        are refreshed on upgrade; a customised copy is never touched and
        draws a loud warning — customising daemon-owned agents is strongly
        discouraged (copy under your own name instead).
      migration_note: >-
        Opt-in. Enable only in projects whose security work can trip a
        caller-side content classifier; provide your own
        delegation-boundary document defining which work is flaggable.
        Inspect deployment state any time with `hooks-daemon agents
        status`.
    - key: handlers.session_start.model_fallback_detector
      recommended: false
      dormant: true
      description: >-
        NEW SessionStart advisory handler (Plan 00278 Phase 3/3b), ships
        DISABLED (opt-in). Scans the session transcript JSONL for the
        platform's own model_refusal_fallback record (with assistant-message
        fallback content blocks as corroboration) and injects a loud advisory
        when the session is running a silently substituted model. Dedupe
        state is PERSISTED to disk and survives a daemon restart: an ACTIVE
        record re-advises once per (session, identity); a RECOVERED record is
        noted at most once EVER, across every session; each distinct record's
        diagnostic snapshot is written at most once EVER (fixed after a
        restart previously re-advised the full alert wall and re-wrote a
        snapshot for every historical record on every restart). It ships OFF
        because a SessionStart scan reports a fallback that ALREADY happened,
        so for a project that never does safeguard-flaggable work it
        essentially never fires. The continuous "am I downgraded?" signal is
        better served by the downgrade_indicator status-line handler (ships
        enabled), which self-detects a live downgrade on every render. This
        detector's unique value is the secret-redacted diagnostic snapshot
        (the fallback record plus a bounded window of preceding transcript
        records) for tuning delegation config.
      migration_note: >-
        Opt-in. Enable only to capture diagnostic snapshots for tuning a
        project's flaggable-work delegation config; the live downgrade signal
        is on by default via downgrade_indicator, so most projects need not
        enable this. Set handlers.session_start.model_fallback_detector.enabled:
        true. Options under .options: snapshot_enabled (default true),
        snapshot_dir (default untracked/reports), snapshot_window_records
        (default 20). Snapshot write failures degrade to a mention in the
        advisory.
    - key: handlers.pre_tool_use.flaggable_work_advisor
      recommended: false
      dormant: true
      description: >-
        NEW opt-in PreToolUse advisory handler (Plan 00278 Phase 3), ships
        DISABLED. When a Read/Edit/Write/Grep targets a path matching
        flaggable_path_globs, a Bash command mentions such a path, or the
        tool input text matches 2+ flaggable_topic_terms (seed: spoof,
        spoofing, evasion, exploit, rootkit), it advises (never denies)
        delegating the whole sub-task to the quarantine subagent BEFORE
        opening the content, deciding from framing/path never by reading
        first, taking back only the clean summary. Rate-limited once per
        session per matched path. Options: flaggable_path_globs (default
        empty), flaggable_topic_terms, quarantine_agent (default
        hooks-daemon-opus-security), mode (additive | replace — whether
        project lists extend or replace the built-in seeds, matching the
        command_hints convention).
      migration_note: >-
        Enable only in projects whose subject matter can trip an API-side
        content safety classifier (defensive-security estates). Set
        handlers.pre_tool_use.flaggable_work_advisor.enabled: true and
        configure the path globs to the project's sensitive directories.
    - key: handlers.pre_tool_use.flaggable_content_channel_guard
      recommended: false
      dormant: true
      description: >-
        NEW opt-in PreToolUse blocking handler (Plan 00278 Phase 3d.1), ships
        DISABLED. Closes the one contamination channel
        flaggable_work_advisor can only advise about: content-revealing git
        commands (git diff, git show, git log -p/--patch, git add -p/--patch)
        and the grep/rg/egrep/fgrep family pull a flaggable file's content
        into context inside a routine command's output, with no deliberate
        Read at all. Denies a Bash command segment whose SHAPE is
        content-revealing AND references a path matching
        flaggable_path_globs; a plain git status, git log (no -p), or git
        add <path> (no -p) stays allowed even when it names a flaggable
        path. No escape hatch -- an agent that could type its own
        justification would have self-authorised the disclosure this guard
        exists to prevent. Options: flaggable_path_globs (default empty --
        inert until configured), extra_content_revealing_patterns (raw
        regexes that always EXTEND the built-in shape set), mode (additive
        default | replace -- governs only the path-glob list, never the
        built-in shapes).
      migration_note: >-
        Enable only in projects that already use flaggable_work_advisor and
        want the git/grep leak closed by DENY rather than advisory. Set
        handlers.pre_tool_use.flaggable_content_channel_guard.enabled: true
        and configure flaggable_path_globs to the same paths.
    - key: handlers.pre_tool_use.quarantine_artefact_read_guard
      recommended: false
      dormant: true
      description: >-
        NEW opt-in PreToolUse blocking handler (Plan 00278 Phase 3d.2), ships
        DISABLED but PRE-SEEDED with the *-opus-security-DETAIL* marker glob
        (unlike flaggable_work_advisor's empty seed), so enabling it needs no
        configuration. Enforces the two-file artefact contract's read
        boundary by pattern, not trust: denies Read/Edit/Grep/NotebookEdit on
        a path matching a quarantine_artefact_globs entry, and any Bash
        command whose shape reveals file content (cat, head, tail, less,
        more, grep/egrep/fgrep/rg, strings, xxd/hexdump/od, awk, or an
        interpreter one-liner) mentioning such a path. Writing/creating the
        artefact stays allowed (the subagent authors it), and the subagent's
        own git add/commit/push of its artefacts is unaffected -- that
        channel is flaggable_content_channel_guard's job. No escape hatch.
        Options: quarantine_artefact_globs (additive onto the seed by
        default), mode (additive default | replace).
      migration_note: >-
        Enable in any project using the opus-security-style two-file
        artefact contract to make the DETAIL read-boundary enforced rather
        than convention-only. Set
        handlers.pre_tool_use.quarantine_artefact_read_guard.enabled: true --
        no further configuration is required.
    - key: handlers.status_line.downgrade_indicator
      recommended: true
      dormant: false
      description: >-
        NEW StatusLine advisory handler (Plan 00278), ships enabled. Makes a
        SILENT model-family downgrade (the platform's own safety classifier
        substituting the session model, e.g. fable to opus, with
        scope:session) visible on the status line, self-detected purely from
        the model id Claude Code reports on every render -- no dependency on
        the ccy supervisor or any external signal. Tracks each session's
        HIGH-WATER model family rank (haiku=0, sonnet=1, opus=2, fable=3;
        mythos canonicalises to fable) in a small per-session JSON state file
        under the daemon untracked dir, keyed by session id so a
        genuinely-fresh session starting on a high-ranked model is never
        mislabelled a downgrade. Renders a compact warning segment naming the
        drop (high-water family, an arrow, current family) only while the
        current render's family ranks below the recorded high-water; silent
        on a first render, a new high, a recovered render, or an unrecognised
        model id. Options: emoji, label_format, color (all overridable via
        handler options, following the model_context.py colour-constant
        convention).
      migration_note: >-
        On by default; no action needed to adopt. Silent unless a downgrade
        is active, so it costs nothing normally.
  removed:
    - key: handlers.session_start.skill_opportunity_detector.options.model
      description: >-
        The skill-scan model shell-out is gone (Plan 00274 Decision 9): the
        CLI no longer invokes headless `claude -p`, so the `model` option has
        nothing to configure. `bin/hooks-daemon skill-scan` now writes the
        report with the judging rubric embedded, and an in-session subagent
        dispatched at the report does the judging.
      migration_note: >-
        Delete any `options.model` line under skill_opportunity_detector; it
        is ignored. No auth is needed for the scan any more.
