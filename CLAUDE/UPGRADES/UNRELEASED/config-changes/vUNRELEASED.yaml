version: "UNRELEASED"
date: "UNRELEASED"
breaking: false
config_changes:
  added:
    - key: handlers.pre_tool_use.artifact_publish_blocker
      recommended: true
      dormant: false
      description: >-
        NEW PreToolUse blocking handler (Plan 00259). Denies publishing an
        artefact. The Artifact tool renders a local file to a page hosted on
        claude.ai and returns a URL; the page starts private, but it lives
        OUTSIDE the project, so the repository cannot audit what left it and
        deleting the artefact later does NOT un-share a link somebody has
        already opened. Whether content leaves is the user's decision, and
        this was the one disclosure path in the daemon with no guard at all.
        Fires on any publish or update -- an absent action (which means
        publish), action "publish", or passing url to update an existing page
        -- and deliberately defaults unknown future actions to "this
        publishes" rather than waving them through. Read-only action "list"
        is never blocked, because enumerating discloses nothing new. The
        payload shape was captured from the live daemon rather than assumed.
        Ships default-ON: a guard that must be discovered and enabled before
        it protects anything protects nobody, and the cost of the default is
        one config line for projects that genuinely want to publish.
      migration_note: >-
        On by default; no action needed to adopt. If your project legitimately
        publishes artefacts (dashboards, shared reports), a HUMAN sets
        handlers.pre_tool_use.artifact_publish_blocker.enabled to false. Note
        there is deliberately NO agent-side MUST_..._BECAUSE escape hatch:
        the hatches on git_stash and ancestry_preserving_merge cover actions
        whose consequences stay inside the repository, whereas publishing
        leaves it, so an agent able to type its own justification would have
        self-authorised disclosure. Agents are told to ask rather than apply
        the setting themselves. This does not affect a human publishing
        through the claude.ai UI -- the daemon sees tool calls, not browser
        clicks.
    - key: handlers.pre_tool_use.write_clobber_guard
      recommended: true
      dormant: false
      description: >-
        NEW PreToolUse blocking handler (Plan 00261). Denies a Write to a file
        that already exists and that the session has not Read. Write replaces a
        file's ENTIRE contents, so an agent writing blind destroys content it
        cannot describe -- it could not report the loss even afterwards. This is
        a recorded incident, not a hypothetical: a Write destroyed a tracked
        58-line journal in the daemon's own repository, noticed only because
        that path happened to fall under an ADVISE-level plan-QA rule. The
        handler exists because the Write tool's own description states
        "Overwriting an existing file you haven't Read will fail" and, measured
        under bypassPermissions, it does not -- so this restores a documented
        contract rather than adding a new rule. Creating a NEW file is never
        blocked, nor is rewriting a file read or written earlier in the same
        session, nor any Edit. Non-terminal by design: the handler ALLOWs on its
        common path and a terminal ALLOW would shadow every handler behind it.
      migration_note: >-
        On by default; no action needed to adopt. If a Write is denied, Read the
        file and retry, or use Edit -- either is one call. There is deliberately
        no MUST_..._BECAUSE escape hatch, because a Read actually removes the
        hazard whereas a typed justification would only declare it acceptable.
        Note the guard tracks READS, not sizes: a byte-threshold rule would not
        have caught the motivating incident, because the clobbering write made
        the file BIGGER. Bash-mediated writes (>, >>, tee, heredoc) are not
        covered by this handler.
    - key: handlers.post_tool_use.lint_on_edit.options.lint_bash_writes
      recommended: false
      # dormant: the OPTION defaults true, but the HANDLER ships
      # `enabled: false` for clients, so this does nothing until a project opts
      # the handler in. Verified in a real client install -- this repository
      # enables lint_on_edit and is not representative.
      dormant: true
      description: >-
        NEW option (Plan 00260 Task 3.5), default TRUE. Lints source files a
        Bash command AUTHORS -- a > / >> / >| / &> redirect, tee, or a
        cat <<EOF heredoc -- in addition to Write/Edit. Before this, a heredoc
        put unparseable Python on disk in silence while identical content
        through Write was denied, so the route that looked safest because
        nothing complained was the only unguarded one. A command that authors
        several files (tee a.py b.py) has each of them linted, and the first
        failure is reported. Files the command merely RELOCATES (cp, mv,
        install, dd) are deliberately NEVER linted: those bytes were already on
        disk, so denying the copy would report a defect the command did not
        introduce. A predicted target that does not exist is skipped, since a
        failed command leaves nothing to check.
      migration_note: >-
        On by default. THIS IS A NEW DENIAL SURFACE -- lint_on_edit DENIES, and
        the write has already landed when it runs, so a denial is a failure
        report to fix with Edit, not a rollback (and it cancels sibling tool
        calls batched in the same turn). If your project generates source files
        via heredoc or redirect and cannot make them lint-clean, set
        lint_bash_writes to false; Write/Edit linting is unaffected either way.
    - key: handlers.worktree_create.worktree_create.options.seed
      recommended: true
      # NOT dormant in the usual sense -- worktree_create ships enabled: true
      # and must (Claude Code parses its stdout as the worktree path). But the
      # option has no shipped default and none is possible, so it does nothing
      # until a project lists its own paths. That is what makes it recommended:
      # the daemon cannot adopt this on anyone's behalf.
      dormant: false
      description: >-
        NEW option (Plan 00267). Seeds a fresh git worktree from a
        project-owned list of git-ignored paths. A worktree is a clean
        CHECKOUT, so local env files, local settings and local secrets are
        simply absent from it -- an isolation "worktree" agent then runs
        against a different configuration from the session that spawned it,
        and nothing surfaces the difference. Each entry is either SYMLINKED
        (shared with the main checkout; one source of truth, but a write from
        inside the worktree flows back) or COPIED (isolated; safe to
        overwrite, may drift), chosen per entry with a block-level
        default_mode. Files and directories both work; there is no glob
        expansion, only explicit paths. Symlinks are always RELATIVE, so they
        survive the same tree being viewed at two different absolute prefixes
        -- a host path and a container bind-mount of the same project. A
        configured path that does not exist ABORTS worktree creation BEFORE
        the worktree is made, rather than handing an agent a quietly
        under-seeded checkout it cannot know is incomplete; an existing
        destination is never clobbered, and a re-fired event never re-seeds
        over an agent's own edits. Ships with an EMPTY list, so nothing
        changes until a project configures it.
      migration_note: >-
        No shipped default is possible here -- only your project knows which
        of its git-ignored files a worktree needs. Run
        `bin/hooks-daemon check-worktree-seed` (also run automatically at
        install and upgrade): it scans the repository, names candidates, and
        prints a paste-ready YAML block at the correct nesting. It REPORTS
        only; it never edits your config, and it never reads the contents of
        the files it names. Exit 0 clean, 1 drift, 2 error, so it is CI-able.
        Choose `copy` for anything an agent may WRITE to -- a symlinked file
        edited inside a worktree changes the main checkout. Worth checking for
        a secret/word-list file specifically: absent from a worktree, a guard
        that reads one does not fail, it goes silently inert.
    - key: handlers.pre_tool_use.verification_result_gate
      recommended: true
      dormant: false
      description: >-
        NEW PreToolUse handler (Plan 00268), ships enabled in `mode: warn`.
        Flags a verifier (ansible-lint, shellcheck, pytest, ruff, mypy,
        yamllint, go vet, bash -n, php -l, golangci-lint, npm test,
        ansible-playbook --syntax-check) followed by a mutator (git
        add/commit/push/tag, gh pr create, gh issue create, gh pr merge, a
        real ansible-playbook run) in the SAME Bash invocation with nothing
        consuming the verifier's exit status. A newline separates commands
        exactly as `;` does — the motivating field incident put the lint on
        one line and the commit on the next, so the lint FAILED, its exit code
        was printed, and the commit ran anyway, landing an unloadable file on
        a default branch. Gating shapes stand it down: `&&`, `|| { …; exit 1;
        }`, `rc=$?` consumed by an `if`/`case`, or `set -e`/`set -o errexit`
        at the top of the invocation. Printing `$?` is not consuming it.
        `ansible-playbook` sits on both tables and is classified by its flags
        (dry-run flags make it a verifier). Deliberately NOT a style rule
        about `;` versus `&&`: statements with no mutator (no-match grep,
        labelled diagnostic sweeps, exit-code observers) never fire, and every
        such shape from the field report is a tested ALLOW case.
      migration_note: >-
        Advisory by default; no action needed to adopt. Ratchet to
        `options.mode: block` once the tables fit your project. Extend
        additively with `options.extra_verifiers` / `options.extra_mutators`
        (literal command names); the built-in tables cannot be replaced, so a
        project cannot silently empty the mutator table.
    - key: handlers.pre_tool_use.bash_safe_mode
      recommended: false
      dormant: true
      description: >-
        NEW opt-in PreToolUse handler (Plan 00270), ships `enabled: false` —
        the opt-in counterpart Plan 00268 deferred. When a project enables it,
        a Bash invocation with multiple sequenced statements (`;` or newline
        separated; default threshold 2) must declare a `set` safety prelude —
        by default errexit and pipefail (`set -euo pipefail` satisfies both;
        `nounset` is available but off-default because `set -u` breaks the
        common `$OPTIONAL_VAR` probing idiom). A command already carrying the
        prelude, a single statement, and a pure `&&` chain are never flagged,
        and `only_with_mutator: true` scopes enforcement to commands
        containing an entry from the shared verifier-gate mutator table. The
        fire-time message and resident guidance teach `set -e`'s blind spots
        (disabled inside if/while conditions and under `!`; non-final
        `&&`/`||` operands; `local x=$(fail)` masking; SIGPIPE under
        pipefail) so the prelude is never mistaken for a guarantee.
        `mode: inject` (auto-prepending the prelude) is reserved but rejected
        at config load, because the daemon does not yet serialise PreToolUse
        `updatedInput`. Escape hatch:
        MUST_SKIP_SAFE_MODE_BECAUSE="reason"; <command>.
      migration_note: >-
        Deliberately NOT recommended: Plan 00268's cry-wolf analysis stands —
        forced errexit changes the semantics of every command, so this is a
        per-project policy act, never a default. If you enable it, start with
        `mode: warn` (the default when enabled) and consider
        `only_with_mutator: true`, which spares every diagnostic
        false-positive shape. Its sibling verification_result_gate stands
        down when a prelude is present, so the two never double-fire.
    - key: handlers.user_prompt_submit.standing_authorisations.options.authorisations.commit-push-cadence
      recommended: false
      dormant: true
      description: >-
        NEW built-in standing-authorisation id `commit-push-cadence` (requested
        by the daemon project's own user). When a project enables it, every
        prompt carries a recorded request to commit AND push after each
        logical unit of work — git as the primary backup — rather than
        batching pushes behind long-running checks or milestones, with
        fix-forward (never history rewrite) for problems found after a push.
        Ships disabled like every standing authorisation: the daemon must
        never assert consent nobody gave.
      migration_note: >-
        Opt in by adding `{id: commit-push-cadence, enabled: true}` to the
        authorisations list. Only enable it where an always-push cadence is
        genuinely wanted — it is a per-project policy statement, and pushing
        constantly to a shared branch is not right for every workflow.
    - key: handlers.session_start.contract_staleness
      recommended: true
      dormant: false
      description: >-
        NEW SessionStart advisory handler (Plan 00271). The daemon now vendors
        the Claude Code hooks output contract (contracts/claude-code-hooks/,
        one JSON per documented event plus META.json provenance) and a
        network-free QA check (scripts/qa/check_hook_contract.py) diffs the
        daemon's response schemas, refusal claim tables and event catalogue
        against it. This handler is the freshness half: on a new session, when
        the installed Claude Code version is newer than META.json's
        last_audited_claude_code_version, it advises running the refresh
        procedure (docs/guides/HOOK-CONTRACT-REFRESH.md). Silent otherwise;
        caches the claude --version probe for 24 hours; never auto-refreshes —
        extraction from prose docs is a verified manual step by design, after
        a summarising fetch layer fabricated a contract value during the
        Plan 00271 audit.
      migration_note: >-
        Enabled by default in newly generated configs. Existing configs adopt
        it by adding contract_staleness under handlers.session_start
        (enabled: true, priority: 60). Without it the vendored contract can
        rot silently as Claude Code moves on.
    - key: handlers.pre_tool_use.staged_lint_gate
      recommended: true
      dormant: false
      description: >-
        NEW PreToolUse handler (Plan 00268 Phase 3), ships enabled in
        `mode: warn`. Syntax-checks the files STAGED for a `git commit` —
        cheap tier only, never the extended linter — and reports any staged
        file that fails its language's syntax check. This is the batch
        counterpart Core Standard 15's corollary demands for `lint_on_edit`:
        a write-time guard cannot see files that predate it or that arrived
        by `mv`, merge or relocation, so an unloadable file already on disk
        could still reach a commit unexamined. Cost is bounded by contract:
        only staged Added/Copied/Modified files with a lint strategy, a
        `max_files` cap (default 20) above which it stands down with an
        advisory naming how many were skipped, a per-file timeout, and
        nested/foreign repos exempt.
      migration_note: >-
        Advisory by default; no action needed to adopt. Ratchet to
        `options.mode: block` to deny commits carrying syntax-broken staged
        files. A missing lint tool never blocks — the check is skipped for
        that language, as for lint_on_edit.
    - key: handlers.post_tool_use.goal_injection
      recommended: true
      # dormant: ships enabled: false (opt-in) -- only useful when the ccy PTY
      # supervisor is watching the session, and nothing is typed unless that
      # supervisor is separately armed.
      dormant: true
      description: >-
        NEW PostToolUse advisory handler (Plan 00269), ships DISABLED. The
        sensor half of supervisor /goal injection: when a PLAN.md Write/Edit
        under the active plan directory (never Completed/) results in
        "**Status**: In Progress", the daemon renders the configured goal
        lines (command_hints-style options.mode additive|replace, entries
        keyed by id, per-line enabled flags), joins them into ONE physical
        line, and atomically writes a <session>.goal-intent signal into the
        context-sidecar directory. The ccy PTY supervisor consumes the signal
        at its existing injection choke point and types a single-line
        "/goal 🤖 [ccy-supervisor] ..." message into the foreground chat,
        subject to every existing rail (idle gate, empty-input-box gate,
        own-session/foreground scoping, a fail-closed structural validation
        gate, dry-run default). The fixed machine-origin header line -- which
        includes a "NOT human authorisation" clause -- is never overridable
        or removable, even in replace mode. Optional authorisation-flavoured
        built-in lines ship disabled and point at standing_authorisations
        rather than asserting fresh consent. Manual fallback / debug tool:
        bin/hooks-daemon inject-goal NNNNN.
      migration_note: >-
        Opt-in twice by design: enable the handler AND run the session under
        an armed ccy supervisor before anything reaches the chat. Enabling
        only the handler is harmless (a small JSON signal file is written and
        eventually reaped). Recommended rollout mirrors Plan 00135: enable
        with the supervisor in dry-run first, observe the visible marker,
        then arm. Enabling an authorisation line (subagents-encouraged,
        qa-review-subagents) is a deliberate repository-owner act, the same
        as enabling a standing_authorisations entry.
    - key: handlers.post_tool_use.validate_eslint_on_write.options.check_bash_writes
      recommended: false
      # dormant for the same reason as lint_bash_writes: validate_eslint_on_write
      # also ships `enabled: false` for clients, and is additionally gated on
      # `llm:` scripts in package.json -- two opt-ins before this option matters.
      dormant: true
      description: >-
        NEW option (Plan 00260 Task 3.5), default TRUE. The .ts/.tsx sibling of
        lint_bash_writes: a TypeScript file authored by a redirect, tee or a
        heredoc is ESLint-checked, not only one written with Write/Edit.
        Relocation routes are excluded on the same reasoning.
      migration_note: >-
        On by default, and this handler is the STRICTER of the two -- it denies
        on an ESLint timeout and on any failure to run ESLint at all, so do not
        carry lint_on_edit's "a missing linter never blocks" across to it. Note
        enforcement is still gated on llm: scripts in package.json: with none
        present the handler only advises, so silence is not evidence a .ts file
        is clean. Opt out with check_bash_writes: false.
