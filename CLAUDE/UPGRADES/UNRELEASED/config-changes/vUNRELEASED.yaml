version: "UNRELEASED"
date: "UNRELEASED"
breaking: false
config_changes:
  added:
    - key: handlers.session_start.secret_file_hygiene_checker
      recommended: true
      dormant: false
      description: >-
        NEW SessionStart advisory handler (Plan 00272 Task 6.1), ships
        enabled. For every path matching the effective secret_file_guard
        globs that exists on disk, advises (never blocks) when it is not
        gitignored, is git-tracked, or is group/world-readable (chmod 600
        remediation). This is the session-start half of the
        permissions/ownership hygiene the secret-meta CLI already reports on
        demand for a single path. Files are enumerated via git ls-files
        (tracked, untracked-visible, untracked-ignored -- three cheap index
        reads, no filesystem walk); outside a git repository (or when git is
        unavailable) gitignore/tracked checks are skipped and only
        permissions are checked via a bounded fallback walk, which reports
        explicitly if its file-count bound is hit rather than presenting a
        truncated scan as a clean one. Content is never read.
      migration_note: >-
        On by default; no action needed to adopt. If it advises on a file you
        know is safe, fix the listed issue (gitignore it, untrack it, or
        chmod 600 it) -- there is no per-finding suppression, matching
        secret_file_guard's own no-escape-hatch doctrine for protected paths.
    - key: agents.opus_security.enabled
      recommended: false
      dormant: true
      description: >-
        NEW gating key for the hooks-daemon-opus-security agent asset
        (Plan 00279), ships false. When enabled, the generic agent-asset
        subsystem deploys a quarantine-executor sub-agent into
        .claude/agents/ for safeguard-flaggable security work: the caller
        delegates the whole sub-task before reading the sensitive content
        and receives back only a clean SUMMARY artefact (the paired DETAIL
        artefact is never read by the coordinator). Deployment happens on
        daemon start and via `hooks-daemon agents install`; disabling the
        key produces a removal advisory naming `hooks-daemon agents remove
        hooks-daemon-opus-security` — the daemon never deletes agents
        itself. Pristine deployed copies (matching any shipped revision)
        are refreshed on upgrade; a customised copy is never touched and
        draws a loud warning — customising daemon-owned agents is strongly
        discouraged (copy under your own name instead).
      migration_note: >-
        Opt-in. Enable only in projects whose security work can trip a
        caller-side content classifier; provide your own
        delegation-boundary document defining which work is flaggable.
        Inspect deployment state any time with `hooks-daemon agents
        status`.
  removed:
    - key: handlers.session_start.skill_opportunity_detector.options.model
      description: >-
        The skill-scan model shell-out is gone (Plan 00274 Decision 9): the
        CLI no longer invokes headless `claude -p`, so the `model` option has
        nothing to configure. `bin/hooks-daemon skill-scan` now writes the
        report with the judging rubric embedded, and an in-session subagent
        dispatched at the report does the judging.
      migration_note: >-
        Delete any `options.model` line under skill_opportunity_detector; it
        is ignored. No auth is needed for the scan any more.
