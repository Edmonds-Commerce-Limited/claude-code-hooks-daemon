[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-hooks-daemon"
version = "3.56.0"
description = "High-performance daemon for Claude Code hooks using front controller architecture"
readme = "README.md"
authors = [
    {name = "Edmonds Commerce", email = "hello@edmondscommerce.co.uk"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
keywords = ["claude-code", "hooks", "ai", "llm", "development-tools"]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "jsonschema>=4.0",
    "psutil>=5.9",
    "mdformat>=0.7",
    "mdformat-gfm>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.11",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "bandit>=1.7",
    "safety>=2.3",
    "build>=1.0",
    "twine>=4.0",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.0",
    "types-psutil>=5.9",
    "deptry>=0.20",
    # Custom static-analysis rules (Plan 00231). Ruff has no plugin mechanism,
    # so project-specific "ban this code shape" rules previously meant a
    # bespoke AST scanner per rule. Benchmarked against an 11-shape probe of
    # one defect class, a hand-written checker caught 1 and these rules caught
    # 9, for a fraction of the code and no test suite of their own. Dev-only:
    # the client installer runs `uv pip install -e <dir>` with no [dev] extra,
    # so this never reaches a client project (scripts/install/venv.sh).
    "semgrep>=1.100",
    # CONTRIBUTING.md instructs `pre-commit install`; without this the command
    # is not found on a fresh dev setup. The hooks themselves run the tools
    # above from this same environment (see .pre-commit-config.yaml), so there
    # is exactly one version source.
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://github.com/Edmonds-Commerce-Limited/claude-code-hooks-daemon"
Documentation = "https://github.com/Edmonds-Commerce-Limited/claude-code-hooks-daemon/blob/main/README.md"
Repository = "https://github.com/Edmonds-Commerce-Limited/claude-code-hooks-daemon"
Issues = "https://github.com/Edmonds-Commerce-Limited/claude-code-hooks-daemon/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundle the plan-scaffolding script so wheel installs can deploy it.
"claude_code_hooks_daemon.install" = ["templates/*.bash"]
# PEP 561 marker. This package is checked under `mypy --strict`, but without
# this file no consumer can see that: every `from claude_code_hooks_daemon...`
# import resolves to Any and silently loses type checking. The repo's own
# scripts/ were the first victims — 12 `import-untyped` errors surfaced the
# moment the type gate was widened past src/.
"claude_code_hooks_daemon" = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
# Coverage flags are NOT in addopts so that running a single test file
# (e.g. pytest tests/unit/core/test_foo.py) doesn't trigger coverage on
# the full source tree and fail the 95% threshold.
# Coverage is applied by scripts/qa/run_tests.sh during QA runs only.
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "anyio: marks tests as anyio async tests",
]

[tool.coverage.run]
source = ["src", ".claude/ccy"]
branch = true
# Disabled parallel mode - causes fork bomb when running pytest with --cov
# parallel = true
omit = [
    "tests/*",
    "**/__pycache__/*",
    "**/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 95.0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "\\.\\.\\.",  # Protocol ellipsis (stub methods)
]

[tool.coverage.html]
directory = "htmlcov"

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | __pycache__
  | dist
  | build
  | tests/fixtures/project_handlers_error_cases
  | tests/fixtures/type_safety_violations
)
| tests/fixtures/plugins/syntax_error_handler\.py
'''

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures/plugins/syntax_error_handler.py", "tests/fixtures/project_handlers_error_cases/**/*.py", "tests/fixtures/type_safety_violations/**/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "SIM102",  # nested if statements (readability preference)
    "SIM103",  # return negated condition (readability preference)
    "SIM112",  # env variable capitalization (false positive - 'container' is lowercase by design)
    "SIM117",  # nested with statements (readability preference)
    "ARG002",  # unused method arguments (valid for interface compliance)
    "TC001",  # type-checking imports (causes circular import issues)
    "TC002",  # move third-party import into TYPE_CHECKING block (stylistic; newly
    "TC003",  # move stdlib import into TYPE_CHECKING block (stylistic)
    # TC002/TC003: ruff 0.14 began enforcing these across the tree (30 findings /
    # 24 files) where prior toolchains did not. They only ask that type-only
    # imports be shuffled into `if TYPE_CHECKING:` blocks -- no runtime effect --
    # so, consistent with the existing TC001 ignore, we do not enforce the churn.
    "PTH123",  # open() vs Path.open() (open() is fine for /dev/null and simple cases)
    "E402",  # module import not at top (false positive from sys.path manipulation)
    "RUF043",  # pytest match patterns (false positive - pytest handles regex escaping)
    "B007",  # unused loop control variables in tests (tests often need all values for clarity)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = ["ARG", "S101", "SIM"]  # Allow unused arguments, asserts, and simplify rules in tests

[tool.ruff.lint.isort]
known-first-party = ["claude_code_hooks_daemon"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
strict_equality = true
strict_optional = true
enable_error_code = ["truthy-bool", "redundant-expr", "unused-awaitable"]
exclude = [
    'tests/fixtures/plugins/syntax_error_handler\.py$',
    'tests/fixtures/project_handlers_error_cases/.*\.py$',
    # Plan 00265: deliberately-invalid code proving the narrowed result types
    # are enforced STATICALLY. tests/integration/test_static_type_safety_is_
    # enforced.py runs mypy over it and asserts each planted error is reported,
    # so it must fail type-checking — excluded here only so the QA run does not
    # report the very errors that test requires.
    'tests/fixtures/type_safety_violations/.*\.py$',
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

# NOTE: there is deliberately no [tool.bandit] section.
#
# Three surfaces run bandit, and all three now pass their filtering explicitly
# on the command line so they cannot drift apart:
#   scripts/qa/run_security_check.sh  bandit -r src/ <supervisor> -s B101
#   .pre-commit-config.yaml           bandit -r src/ -s B101
#   .github/workflows/qa.yml          bandit -r src/ <supervisor> -s B101
#
# A [tool.bandit] block here previously carried a skips list exempting B108,
# B324, B602, B603, B607 and B404. Bandit only reads a config file when invoked
# with `-c`, so the two local surfaces ignored it entirely - but CI DID pass
# `-c pyproject.toml`, which made CI the LOOSEST of the three while appearing
# to be the strictest. The justification for the B602 skip also described
# `shell=True` usage that does not exist anywhere in src/.
#
# The single source of truth for filtering is the `-s B101` flag: ONLY B101
# (assert statements) is skipped, matching the Security Standards in CLAUDE.md.
# HIGH, MEDIUM and LOW findings all fail the check. Do not reintroduce a skips
# list here, and do not add `-c pyproject.toml` back to any surface - fix the
# finding instead.

[tool.deptry]
# Exclude non-source directories (regex patterns)
exclude = [
    "tests/.*",
    "scripts/.*",
    "CLAUDE/.*",
    "untracked/.*",
    "\\.claude/.*",
    "\\.venv/.*",
]
# DEP002: dev tools (CLI-only, not imported in code) - false positives
# DEP003: self-package imports (claude_code_hooks_daemon imports itself) - false positives
ignore = ["DEP002", "DEP003"]
