# Allowlisted input-contract findings (check_input_contract.py, Plan 00273).
#
# Each entry records a KNOWN, deliberate read of a top-level hook_input field
# that no vendored input_example documents. Entries must carry id, reason and
# a linked plan/task; a stale entry (whose finding no longer exists) fails QA.
entries:
  - id: "unknown-input-field:(shared):stopHookActive"
    reason: >-
      Deliberate defensive dual-read in utils/stop_hook_helpers.py: the
      canonical snake_case stop_hook_active is read first and the camelCase
      spelling is a legacy fallback for older Claude Code payloads. The
      examples document only the snake_case form, so the fallback can never
      appear in an input_example by design.
    link: "CLAUDE/Plan/00273-hook-input-payload-validation/PLAN.md"
  - id: "unknown-input-field:(shared):terminal_columns"
    reason: >-
      StatusLine-payload field read by core/front_controller.py while routing
      the status-line surface. StatusLine is out-of-contract by design (Plan
      00271 Task 3.2), so no vendored input_example can ever document it; the
      read is deliberate and correct.
    link: "CLAUDE/Plan/00273-hook-input-payload-validation/PLAN.md"
  - id: "unknown-input-field:(shared):context_window"
    reason: >-
      StatusLine-payload field read by core/session_state.py to track context
      usage. StatusLine is out-of-contract by design (Plan 00271 Task 3.2),
      so no vendored input_example can ever document it; the read is
      deliberate and correct.
    link: "CLAUDE/Plan/00273-hook-input-payload-validation/PLAN.md"
  - id: "unknown-input-field:(shared):hooks_daemon_hostname"
    reason: >-
      Not sent by Claude Code: the daemon's own transport stamps it. init.sh
      writes the session's HOOKS_DAEMON_HOSTNAME or CCY_HOST_HOSTNAME onto the
      payload, and on the relay the daemon reads it from the connected hook
      process's environment (daemon/server.py _stamp_session_hostname). It is
      read by utils/cron_hosts.effective_hostname to match persistent_crons
      hosts:. No vendored input_example can document a field the daemon adds.
    link: "CLAUDE/Plan/00470-persistent-session-optimisation/PLAN.md"
