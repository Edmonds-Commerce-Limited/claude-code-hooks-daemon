  - id: git-merge-noff
    command: |-
      git merge --no-ff feature/x
  - id: git-pull
    command: |-
      git pull --ff-only
  - id: git-fetch
    command: |-
      git fetch origin
  - id: git-push
    command: |-
      git push origin HEAD
  - id: git-remote
    command: |-
      git remote -v
