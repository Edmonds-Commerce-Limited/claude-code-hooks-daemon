  # --- owner ruling A6 (Plan 00483 Task 2.2) ---------------------------------
  # The neighbours of the five new denies (host-root docker mount, remote ref
  # deletion, gh auth token, a non-PyPI pip index, crontab -r) and the rows the
  # ruling ALLOWS, so none of the new rules can catch an everyday command. The
  # prose rows pin that a MENTION of a denied shape is not the shape.
  - id: a6-docker-run-pwd
    command: |-
      docker run -v "$PWD":/app img
  - id: a6-docker-run-tmp
    command: |-
      docker run -v /tmp/x:/x img
