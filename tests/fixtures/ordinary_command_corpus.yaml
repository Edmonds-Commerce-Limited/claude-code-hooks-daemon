  - id: a6-git-push-u-feature
    command: |-
      git push -u origin feature
  - id: a6-git-push-refspec
    command: |-
      git push origin HEAD:refs/heads/feature
  - id: a6-git-push-follow-tags
    command: |-
      git push --follow-tags origin main
  - id: a6-git-tag-delete-local
    command: |-
      git tag -d v1
