    command: |-
      set -euo pipefail; cd {ROOT} && git status
  - id: cd-abs-src-grep
    command: |-
      set -euo pipefail; cd {ROOT}/src && grep -rn "import" .
  - id: git-c-abs
    command: |-
      git -C {ROOT} log --oneline -n 3

  # --- everyday shell shapes ---------------------------------------------------
  - id: sh-arith
    command: |-
      set -euo pipefail; n=0; n=$(( n + 1 )); echo $n
