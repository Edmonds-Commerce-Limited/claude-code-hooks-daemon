    command: |-
      set -euo pipefail; shopt -s nullglob; ls *.py
  - id: sh-function
    command: |-
      set -euo pipefail; f() { echo hi; }; f
  - id: sh-alias-ll
    command: |-
      alias ll='ls -la'
  - id: sh-export-assign
    command: |-
      export FOO=bar
  - id: sh-printf-var
    command: |-
      set -euo pipefail; x=a; printf '%s\n' "$x"
