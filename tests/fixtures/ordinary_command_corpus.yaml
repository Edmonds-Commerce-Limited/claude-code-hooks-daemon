  # --- a different working directory ----------------------------------------
  - id: cwd-src-ls
    cwd: src
    command: |-
      ls
  - id: cwd-src-ls-parent
    cwd: src
    command: |-
      ls ..
  - id: cwd-src-ls-parent-docs
    cwd: src
    command: |-
      ls ../docs
  - id: cwd-src-cat-parent
    cwd: src
    command: |-
      cat ../README.md
  - id: cwd-src-grep-r-dot
    cwd: src
    command: |-
      grep -rn "def " .
  - id: cwd-src-rg
    cwd: src
    command: |-
      rg "import"
  - id: cwd-src-find
    cwd: src
    command: |-
      find . -name '*.py'
  - id: cwd-src-glob
    cwd: src
    command: |-
      ls */*
  - id: cwd-tests-grep
    cwd: tests
    command: |-
      grep -rn "def test" .
  - id: cwd-docs-glob
    cwd: docs
    command: |-
      cat *.md
  - id: cwd-repos-loop
    cwd: repos
    command: |-
      set -euo pipefail; for d in *; do ls "$d"; done
  - id: cwd-untracked-ls
    cwd: untracked
    command: |-
      ls -la
  - id: cwd-untracked-star-loop
    cwd: untracked
    command: |-
      set -euo pipefail; for d in repos/*; do ls "$d"; done
  - id: cd-twice
    command: |-
      set -euo pipefail; cd src && cd util && ls
  - id: cd-up-ls
    cwd: src
    command: |-
      set -euo pipefail; cd .. && ls
