  # --- Plan 00483 Task 3.2 batch (b): git guards judge the command ---------------
  - id: a8-clean-dry-run-operand-with-f
    command: |-
      git clean -nd build-final/
  - id: a8-clean-dry-run-then-rm-f
    command: |-
